/* =========================================================
   STACK NAVIGATION
   ========================================================= */
const stackEls=[];

/* 横遷移中だけ装飾アニメーションを休止するための印。
   画面の位置・速度・暗転方法には触れない。 */
let animTimer=0;
function beginAnim(ms=460){
  const app=document.getElementById('app');
  if(!app) return;
  app.classList.add('anim');
  clearTimeout(animTimer);
  animTimer=setTimeout(()=>app.classList.remove('anim'), ms);
}

function push(node){
  beginAnim();
  $('#stack').appendChild(node);
  fitBars(node);                       /* heights are only real once attached */
  stackEls.push(node);
  $('#tabsRoot').classList.add('pushed');
  $('#navwrap').classList.add('hide');
  raf(()=>node.classList.add('in'));
  wireEdgeBack(node);
  return node;
}
function pop(){
  const node=stackEls.pop(); if(!node) return;
  beginAnim();
  const leavingChat=!!node.dataset.chat;
  if(node.dataset.post) $('#tabsRoot').classList.remove('post-detail-no-bg-slide');

  node.classList.remove('in');
  node.classList.add('out');

  if(!stackEls.length){
    $('#tabsRoot').classList.remove('pushed');
    $('#navwrap').classList.remove('hide');
    navMorph.expand();          /* the bar is back, so the "+" rejoins it */
  }

  /* DMだけは、戻る420msの途中で背面リストを再描画しない。
     夜空DOMを動かしている最中のreflow/repaint競合を避ける。 */
  if(leavingChat){
    let finished=false;
    let fallback=0;

    const finish=()=>{
      if(finished) return;
      finished=true;
      node.removeEventListener('transitionend',onEnd);
      if(fallback) clearTimeout(fallback);
      node.remove();

      if(S.tab==='chat'){
        chatSig=null;
        renderChatList(true);   /* 戻り切った後、アニメーションなしで1回だけ */
      }else{
        refreshPane(S.tab);
      }
      syncNavBadges();
    };

    const onEnd=e=>{
      if(e.target===node && e.propertyName==='transform') finish();
    };

    node.addEventListener('transitionend',onEnd);
    fallback=setTimeout(finish,500);
    syncNavBadges();
    return;
  }

  setTimeout(()=>node.remove(),430);
  refreshPane(S.tab);
  syncNavBadges();
}
/* edge swipe back */
function wireEdgeBack(node){
  let sx=0, sy=0, dragging=false, pending=false, w=window.innerWidth;
  const reset=()=>{
    dragging=false; pending=false;
    node.style.transition=''; node.style.transform='';
    $('#tabsRoot').style.transform='';
  };
  node.addEventListener('touchstart',e=>{
    if(e.touches.length!==1) return;
    const t=e.touches[0];
    if(t.clientX>28) return;
    sx=t.clientX; sy=t.clientY; pending=true; dragging=false;
    w=node.getBoundingClientRect().width;
  },{passive:true});
  node.addEventListener('touchmove',e=>{
    if((!pending&&!dragging) || e.touches.length!==1) return;
    const t=e.touches[0];
    const rawDx=t.clientX-sx, ax=Math.abs(rawDx), ay=Math.abs(t.clientY-sy);

    /* Decide the gesture axis before moving anything. Once horizontal wins,
       own the gesture until touchend so the vertical scroller cannot move too. */
    if(pending){
      if(Math.max(ax,ay)<6) return;
      if(rawDx<=0 || ay>=ax){ reset(); return; }
      pending=false; dragging=true;
      node.style.transition='none';
    }

    if(!dragging) return;
    e.preventDefault();
    const dx=Math.max(0,rawDx);
    node.style.transform=`translate3d(${dx}px,0,0)`;
    const pr=Math.min(1,dx/w);
    $('#tabsRoot').style.transform=`translate3d(${-22+22*pr}%,0,0)`;
  },{passive:false});
  const end=()=>{
    if(!dragging){ pending=false; return; }
    const m=/translate3d\((-?[\d.]+)px/.exec(node.style.transform);
    const dx=m?parseFloat(m[1]):0;
    reset();
    if(dx>w*0.30){ pop(); }
  };
  node.addEventListener('touchend',end); node.addEventListener('touchcancel',reset);
}

   DM THREAD
   ========================================================= */

/* Keep already-rendered message nodes across DM close/open.
   This preserves loaded <img>/<video> elements instead of constructing them again. */
const DM_ROW_CACHE=new Map();
const DM_ROW_CACHE_MAX=320;

function dmRowCacheKey(cid,m,i=0){
  return `${cid}:${threadMessageKey(m,i)}`;
}
function rememberDmRow(cid,m,i,node){
  if(!node) return node;
  const key=dmRowCacheKey(cid,m,i);
  DM_ROW_CACHE.delete(key);
  DM_ROW_CACHE.set(key,node);

  if(DM_ROW_CACHE.size>DM_ROW_CACHE_MAX){
    for(const [oldKey,oldNode] of DM_ROW_CACHE){
      if(!oldNode.isConnected){
        DM_ROW_CACHE.delete(oldKey);
        if(DM_ROW_CACHE.size<=DM_ROW_CACHE_MAX) break;
      }
    }
  }
  return node;
}
function forgetDmRow(cid,m,i=0){
  DM_ROW_CACHE.delete(dmRowCacheKey(cid,m,i));
}
function clearDmRowCache(cid){
  const prefix=`${cid}:`;
  for(const key of [...DM_ROW_CACHE.keys()]){
    if(key.startsWith(prefix)) DM_ROW_CACHE.delete(key);
  }
}
function cachedDmRow(cid,m,i=0){
  return DM_ROW_CACHE.get(dmRowCacheKey(cid,m,i))||null;
}


function attachNightSkyToChat(screen){
  if(!screen || S.theme!=='night') return;
  const slot=screen.querySelector('.dm-sky-slot');
  if(!slot) return;

  const source=document.querySelector('.tabpane[data-pane="home"] .home-sky');
  if(!source) return;

  /* 250個の星DOMは複製しない。
     Homeの星の位置・サイズ・色・透明度を1枚のcanvasへ描くだけ。 */
  const sky=document.createElement('div');
  sky.className='home-sky dm-sky-lite';
  sky.setAttribute('aria-hidden','true');

  const canvas=document.createElement('canvas');
  canvas.className='dm-sky-canvas';
  sky.appendChild(canvas);

  /* 流れ星だけはHomeと同じCSSアニメーションをそのまま使う。 */
  sky.insertAdjacentHTML('beforeend',`
    
    
    
    <i class="sky-meteor meteor-a"></i>
    <i class="sky-meteor meteor-b"></i>
    <i class="sky-meteor meteor-c"></i>
  `);

  const app=$('#app');
  const w=Math.max(1, app?.clientWidth || window.innerWidth || 390);
  const h=Math.max(1, app?.clientHeight || window.innerHeight || 844);
  const dpr=Math.min(2, Math.max(1, window.devicePixelRatio || 1));

  canvas.width=Math.round(w*dpr);
  canvas.height=Math.round(h*dpr);
  canvas.style.width=w+'px';
  canvas.style.height=h+'px';

  const ctx=canvas.getContext('2d');
  if(ctx){
    ctx.scale(dpr,dpr);
    source.querySelectorAll('.sky-star').forEach(star=>{
      const cs=star.style;
      const x=parseFloat(cs.getPropertyValue('--x'))||0;
      const y=parseFloat(cs.getPropertyValue('--y'))||0;
      const size=parseFloat(cs.getPropertyValue('--s'))||1;
      const opacity=parseFloat(cs.getPropertyValue('--o'))||.6;
      const color=(cs.getPropertyValue('--star')||'#FFFFFF').trim();

      ctx.save();
      ctx.globalAlpha=opacity;
      ctx.fillStyle=color;

      if(star.classList.contains('bright')){
        ctx.shadowColor=color;
        ctx.shadowBlur=4;
      }

      ctx.beginPath();
      ctx.arc((x/100)*w,(y/100)*h,Math.max(.35,size/2),0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    });
  }

  slot.replaceWith(sky);
}

function pushThread(cid){
  const c=S.chats.find(x=>x.id===cid); if(!c) return;
  /* A warm-cache chat can be behind the server. Do not advance last_read_at to
     "now" before the fresh page arrives, or unseen messages could be marked read.
     cloudRefreshUI() will mark it read after the current server snapshot replaces it. */
  if(!c._dmWarm){
    c.unread=0;
    cloudMarkChatRead(c.id);
  }
  syncNavBadges();
  const u=S.users[c.u];
  const s=el(`<section class="screen" data-chat="${c.id}" data-owner="${c.u}">
    <div class="dm-sky-slot" aria-hidden="true"></div>
    <header class="navbar">
      <div class="side"><button class="iconbtn js-back" aria-label="戻る">${I.back}</button></div>
      <button class="ttl" id="thHead" style="display:flex;align-items:center;justify-content:center;gap:7px;flex:1">
        ${uav(c.u,22)}<span>${esc(u.name)}</span>
      </button>
      <div class="side"><button class="iconbtn" id="thMore" aria-label="その他">${I.dots}</button></div>
    </header>
    <div class="thread" id="thread"></div>
    <div class="composer-bar dm-composer-bar">
      <div id="dmAtt" class="dm-att-slot"></div>
      <div class="dm-compose-shell">
        <button class="dm-media-btn" id="dmMedia" aria-label="画像・動画を追加" title="画像・動画">${I.plusS}</button>
        <textarea class="msgfield" id="msgIn" rows="1" placeholder="メッセージ…"></textarea>
        <button class="dm-mic-btn" id="dmAudio" aria-label="音声を追加" title="音声">${I.mic}</button>
        <button class="sendbtn" id="sendBtn" aria-label="送信">${I.send}</button>
      </div>
    </div>
  </section>`);
  s.querySelector('.js-back').onclick=()=>{haptic(5);pop();};
  $('#thHead',s).onclick=()=>pushProfile(c.u);
  $('#thMore',s).onclick=()=>openMenu([
    {t:'プロフィールを見る', fn:()=>pushProfile(c.u)},
    {t:'通知をオフにする', fn:()=>toast('通知をオフにしました')},
    {t:'ブロックする', danger:true, fn:()=>confirmBlock(c.u)}
  ]);

  const th=$('#thread',s);
  /* Reuse old message nodes if this DM has been opened before.
     Existing media is therefore already decoded/loaded and appears immediately. */
  paintThread(th,c,{reuse:true});

  const inp=$('#msgIn',s), send=$('#sendBtn',s), dmAttBox=$('#dmAtt',s);
  let dmAtts=[];
  const autoGrow=()=>{ inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,120)+'px';
    send.classList.toggle('live', inp.value.trim().length>0 || dmAtts.length>0); };

  /* A voice note stands alone, exactly as in the post composer. */
  const dmHasAudio=()=>dmAtts.some(a=>a.kind==='audio');

  function paintDmAtts(){
    dmAttBox.innerHTML = dmAtts.length
      ? `<div class="dm-att-row">${dmAtts.map((v,i)=>{
          const preview = v.kind==='audio'
            ? mediaHTML(v,{forceShow:true})
            : `<div class="dm-att-thumb">${v.kind==='video'
                ? `<video src="${v.src}" muted playsinline preload="metadata"></video>`
                : `<img src="${v.src}" alt="選択中の画像">`}</div>`;
          return `<div class="dm-att-preview">
            <button class="dm-att-x" data-dm-att-x="${i}" aria-label="取り消す">${I.close}</button>${preview}
          </div>`;
        }).join('')}</div>`
      : '';
    dmAttBox.querySelectorAll('[data-dm-att-x]').forEach(b=>b.onclick=()=>{
      haptic(6); stopAudio();
      dmAtts.splice(Number(b.dataset.dmAttX),1);
      paintDmAtts();
    });
    const full = dmAtts.length>=MEDIA_MAX || dmHasAudio();
    const media=$('#dmMedia',s), audio=$('#dmAudio',s);
    if(media) media.disabled=full;
    if(audio) audio.disabled=full || dmAtts.length>0;
    autoGrow(); fitBars(s);
  }
  function addDmAtts(v){
    for(const it of (Array.isArray(v)?v:[v])){
      if(!it || dmAtts.length>=MEDIA_MAX) break;
      dmAtts.push(it);
    }
    paintDmAtts();
  }
  const setDmAtt=v=>{ dmAtts = v ? (Array.isArray(v)?v.slice(0,MEDIA_MAX):[v]) : []; paintDmAtts(); };

  $('#dmMedia',s).onclick=()=>{
    haptic(7);
    if(!favoredBy(c.u)){
      toast('お気に入りされてないので送信できません');
      return;
    }
    pickMedia('image/*,video/*', addDmAtts, {multiple:true, max:MEDIA_MAX-dmAtts.length});
  };
  $('#dmAudio',s).onclick=()=>{
    haptic(7);
    openRecorder(addDmAtts);
  };
  inp.addEventListener('input',autoGrow);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();fire();} });
  send.onclick=fire;
  { const mini=$('#repSendMini',s); if(mini) mini.onclick=fire; }

  function fire(){
    const t=inp.value.trim(), picked=dmAtts.slice();
    if(!t && !picked.length) return;
    if(!canSendDmNow(c)){ notifyDmWait(); return; }
    if(picked.some(p=>p.kind==='image'||p.kind==='video') && !favoredBy(c.u)){
      toast('お気に入りされてないので送信できません');
      return;
    }

    /* Commit locally first. The same text/media is impossible to submit twice
       because the composer is cleared before any await/network work starts. */
    const m={id:newRowId(),me:true,t,ts:Date.now(),pending:true};
    setMediaList(m, picked);
    haptic(9);
    c.msgs.push(m); c.ts=m.ts;
    inp.value=''; setDmAtt(null); autoGrow();
    appendMsg(th,c,m,true);
    scrollThread(th);
    quiet(()=>{ chatSig=null; if(S.tab==='chat') renderChatList(); });

    void (async()=>{
      try{
        await cloudSendMessage(c,m);
        m.pending=false; m.failed=false;
        const liveC=S.chats.find(x=>x.id===c.id)||c;
        const liveM=(liveC.msgs||[]).find(x=>x.id===m.id);
        if(liveM && liveM!==m) Object.assign(liveM,m);
        else if(!liveM) liveC.msgs.push(m);
        liveC.ts=Math.max(liveC.ts||0,m.ts||0);
        if(th.isConnected) syncThread(th,liveC);
        quiet(()=>{ chatSig=null; if(S.tab==='chat') renderChatList(); });
      }catch(e){
        m.pending=false; m.failed=true;
        const liveC=S.chats.find(x=>x.id===c.id)||c;
        const liveM=(liveC.msgs||[]).find(x=>x.id===m.id);
        if(liveM && liveM!==m) Object.assign(liveM,m);
        else if(!liveM) liveC.msgs.push(m);
        if(th.isConnected) syncThread(th,liveC);
        if(String(e?.message||e).includes('dm_waiting_for_reply')) notifyDmWait();
        else if(String(e?.message||e).includes('dm_favorite_only')) notifyFavOnly();
        else{ cloudErr('message',e); toast('メッセージを送信できませんでした'); }
      }
    })();

    // demo/botだけは従来どおり自動返信。本物のユーザーには勝手に返さない。
    if(u.demo||u.bot) setTimeout(()=>{
      const dots=el(`<div class="msgrow" id="typingRow">${uav(c.u,30)}<div class="bub"><span class="typing"><i></i><i></i><i></i></span></div></div>`);
      th.appendChild(dots); scrollThread(th);
      setTimeout(()=>{
        dots.remove();
        const reply={me:false, t:REPLIES[Math.floor(Math.random()*REPLIES.length)], ts:Date.now()};
        c.msgs.push(reply); c.ts=Date.now();
        appendMsg(th,c,reply,true); scrollThread(th);
      }, 1150+Math.random()*700);
    }, 420);
  }
  /* 夜空は画面遷移が始まる前に軽量版を完成させる。
     移動中にDOMを差し込まない。 */
  if(S.theme==='night') attachNightSkyToChat(s);

  /* push() がDOMへ追加した直後に同期でbar高さを確定する。
     その時点ではまだ .in が付いておらず画面外なので、ここで最終位置まで
     スクロールしてから次フレームのスライドを始める。 */
  push(s);
  th.scrollTop=th.scrollHeight;

  /* v5.0: only media close to the viewport is signed/downloaded. */
  wireDmThreadLazyMedia(th,c);

  /* Older message pages are fetched only when the user approaches the top. */
  let historyTick=false;
  th.addEventListener('scroll',()=>{
    if(historyTick || th.scrollTop>DM_HISTORY_TRIGGER_PX) return;
    historyTick=true;
    requestAnimationFrame(()=>{
      historyTick=false;
      const liveC=S.chats.find(x=>String(x.id)===String(c.id))||c;
      void cloudLoadOlderDm(liveC,th);
    });
  },{passive:true});
}

function threadMessageKey(m,i=0){
  return String(m?.id || `local:${m?.ts||0}:${i}`);
}
function threadDayKey(ts){
  return new Date(ts).toDateString();
}
function threadDayLabel(ts){
  const d=new Date(ts), day=d.toDateString(), today=new Date().toDateString();
  return day===today ? '今日' : `${d.getMonth()+1}月${d.getDate()}日`;
}
function rebuildThreadDayChips(th){
  /* Day labels are cheap to rebuild. Message nodes themselves are kept alive,
     so images/videos/audio do not get recreated or downloaded again. */
  $$('.daychip',th).forEach(x=>x.remove());
  let lastDay='';
  Array.from(th.children).filter(x=>x.dataset?.mid).forEach(node=>{
    const day=node.dataset.day||'';
    if(day!==lastDay){
      lastDay=day;
      const ts=Number(node.dataset.msgTs)||Date.now();
      node.before(el(`<div class="daychip" data-day="${esc(day)}">${threadDayLabel(ts)}</div>`));
    }
  });
}
/* System lines are stored as plain text, so old rows keep their original
   wording. Rendering through here means both sides read the new way. */
function dmSystemText(c,m){
  const raw=String(m?.t||'');
  const isGreeting = raw==='会話申請を送信しました' || raw==='会話の申請が届きました' || raw==='はなしかけました';
  if(!isGreeting) return raw;
  if(m?.me) return `${honor(S.users[c?.u]?.name||'相手')}に話しかけています`;
  return `${honor(S.users[c?.u]?.name||'相手')}が話したがっています`;
}

function updateMessageNode(node,m,c){
  if(!node||!m) return;
  node.dataset.day=threadDayKey(m.ts);
  node.dataset.msgTs=String(m.ts);

  /* Keep an existing cached bubble visibly stable even if iOS preserved
     an animation frame while the screen was detached. */
  const stableBub=node.querySelector('.bub');
  if(stableBub && !node.classList.contains('dm-new-message')){
    stableBub.style.animation='none';
    stableBub.style.opacity='1';
    stableBub.style.transform='none';
    stableBub.style.visibility='visible';
  }
  if(node.classList.contains('syschip') && !node.classList.contains('dm-new-message')){
    node.style.animation='none';
    node.style.opacity='1';
    node.style.transform='none';
  }

  if(m.sys){
    const label=node.querySelector('span:not(.t)');
    if(label) label.textContent=dmSystemText(c,m);
    const t=node.querySelector('.t');
    if(t){ t.dataset.ts=String(m.ts); t.textContent=ago(m.ts); }
    return;
  }

  node.classList.toggle('is-sending',!!m.pending);
  node.classList.toggle('is-failed',!!m.failed);
  syncDmMediaNode(node,m);

  let tm=node.querySelector('.mtime');
  if(!tm){
    tm=document.createElement('span');
    tm.className='mtime';
    node.appendChild(tm);
  }
  if(m.pending){
    tm.className='mtime send-state';
    tm.removeAttribute('data-ts');
    tm.textContent='送信中';
  }else if(m.failed){
    tm.className='mtime send-state failed';
    tm.removeAttribute('data-ts');
    tm.textContent='送信失敗';
  }else{
    tm.className='mtime';
    tm.dataset.ts=String(m.ts);
    tm.textContent=ago(m.ts);
  }
}
function paintThread(th,c,{reuse=false}={}){
  /* Normal open reuses cached message nodes. A deliberate media-setting change
     passes reuse:false after clearing the cache and rebuilds only then. */
  th.replaceChildren();
  let lastDay='';
  c.msgs.forEach((m,i)=>{
    const day=threadDayKey(m.ts);
    if(day!==lastDay){
      lastDay=day;
      th.appendChild(el(`<div class="daychip" data-day="${esc(day)}">${threadDayLabel(m.ts)}</div>`));
    }

    let node=reuse ? cachedDmRow(c.id,m,i) : null;
    if(node){
      node.classList.remove('dm-new-message');

      /* Safari can retain the animation's opacity/transform when a detached
         element is reused and its animation is cancelled. That made the bubble
         invisible while the time (outside .bub) stayed visible.
         Never cancel the animation object; explicitly restore the stable state. */
      if(node.classList.contains('syschip')){
        node.style.animation='none';
        node.style.opacity='1';
        node.style.transform='none';
      }
      const bub=node.querySelector('.bub');
      if(bub){
        bub.style.animation='none';
        bub.style.opacity='1';
        bub.style.transform='none';
        bub.style.visibility='visible';
      }

      /* A broken/stale cache entry is cheaper to rebuild once than to show
         a timestamp with no message bubble. */
      const structurallyValid = m.sys
        ? node.classList.contains('syschip')
        : node.classList.contains('msgrow') && !!node.querySelector('.bub');

      if(structurallyValid){
        updateMessageNode(node,m,c);
        th.appendChild(node);
      }else{
        forgetDmRow(c.id,m,i);
        appendMsg(th,c,m,false,i);
      }
    }else{
      appendMsg(th,c,m,false,i);
    }
  });
  wireDmThreadLazyMedia(th,c);
}
function syncThread(th,c){
  if(!th||!c) return;

  const desired=c.msgs.map((m,i)=>({m,i,key:threadMessageKey(m,i)}));
  const desiredKeys=new Set(desired.map(x=>x.key));
  const existing=new Map();

  Array.from(th.children).forEach(node=>{
    if(node.dataset?.mid) existing.set(node.dataset.mid,node);
  });

  /* Remove only messages that genuinely disappeared (e.g. send cancel).
     Existing message DOM, including <img>/<video>, is never recreated. */
  existing.forEach((node,key)=>{
    if(!desiredKeys.has(key)){
      node.remove();
      DM_ROW_CACHE.delete(`${c.id}:${key}`);
      existing.delete(key);
    }
  });

  const currentKeys=Array.from(th.children)
    .filter(node=>node.dataset?.mid)
    .map(node=>node.dataset.mid);

  /* Only true chronological tail appends may use the cheap append path.
     A warm-cache thread can start with only the newest page. When the server
     later supplies older messages, those keys belong BEFORE the current DOM.
     Treating every missing key as realtime-new would append history at the
     bottom and make old messages look newest. Repaint once in desired order
     while reusing the existing rows and preserving the user's viewport. */
  const prefixOK=currentKeys.every((key,i)=>desired[i]?.key===key);

  if(!prefixOK){
    const rootTop=th.getBoundingClientRect().top;
    const beforeNodes=Array.from(th.children).filter(node=>node.dataset?.mid);
    const anchor=beforeNodes.find(node=>node.getBoundingClientRect().bottom>rootTop+1)||null;
    const anchorKey=anchor?.dataset?.mid||'';
    const anchorOffset=anchor ? anchor.getBoundingClientRect().top-rootTop : 0;
    const bottomGap=Math.max(0,th.scrollHeight-th.clientHeight-th.scrollTop);
    const keepBottom=bottomGap<=80;

    paintThread(th,c,{reuse:true});

    if(keepBottom){
      th.scrollTop=th.scrollHeight;
    }else if(anchorKey){
      const escaped=(window.CSS&&CSS.escape) ? CSS.escape(anchorKey) : anchorKey.replace(/([\"'\\])/g,'\\$1');
      const nextAnchor=th.querySelector(`[data-mid="${escaped}"]`);
      if(nextAnchor){
        const nextRootTop=th.getBoundingClientRect().top;
        const nextOffset=nextAnchor.getBoundingClientRect().top-nextRootTop;
        th.scrollTop += nextOffset-anchorOffset;
      }
    }
    return;
  }

  desired.forEach(({m,i,key})=>{
    let node=existing.get(key);
    if(node){
      const structurallyValid = m.sys
        ? node.classList.contains('syschip')
        : node.classList.contains('msgrow') && !!node.querySelector('.bub');

      if(structurallyValid){
        updateMessageNode(node,m,c);
        return;
      }

      /* Never preserve a timestamp-only/corrupted cached row. */
      node.remove();
      existing.delete(key);
      DM_ROW_CACHE.delete(`${c.id}:${key}`);
      node=null;
    }

    /* A new realtime/local message is appended once. Old media nodes stay untouched. */
    appendMsg(th,c,m,true,i);
    node=Array.from(th.children).find(x=>x.dataset?.mid===key) || null;
    if(node) existing.set(key,node);
  });

  rebuildThreadDayChips(th);
  wireDmThreadLazyMedia(th,c);
}
function appendMsg(th,c,m,animate,i=0){
  const key=threadMessageKey(m,i);
  const day=threadDayKey(m.ts);

  if(m.sys){
    const chip=el(`<div class="syschip${animate?' dm-new-message':''}" data-mid="${esc(key)}" data-day="${esc(day)}" data-msg-ts="${m.ts}">${I.check}<span>${esc(dmSystemText(c,m))}</span><span class="t" data-ts="${m.ts}">${ago(m.ts)}</span></div>`);
    th.appendChild(chip);
    rememberDmRow(c.id,m,i,chip);
    if(animate) setTimeout(()=>{
      chip.classList.remove('dm-new-message');
      chip.style.animation='none';
      chip.style.opacity='1';
      chip.style.transform='none';
    },340);
    return chip;
  }

  const sendClass=m.pending?' is-sending':(m.failed?' is-failed':'');
  const timeHTML=m.pending
    ? `<span class="mtime send-state">送信中</span>`
    : m.failed
      ? `<span class="mtime send-state failed">送信失敗</span>`
      : `<span class="mtime" data-ts="${m.ts}">${ago(m.ts)}</span>`;

  const row=el(`<div class="msgrow${m.me?' me':''}${sendClass}${animate?' dm-new-message':''}" data-mid="${esc(key)}" data-day="${esc(day)}" data-msg-ts="${m.ts}">
    ${m.me?uav('me',30):uav(c.u,30)}
    <div class="bub${m.media?' has-media':''}">${m.media?dmLazyMediaHTML(m):''}${m.t?esc(m.t):''}</div>
    ${timeHTML}
  </div>`);

  if(m.me) holdMenu(row, ()=>{
    /* cloudReloadAll may replace chat/message JS objects, while this DOM node stays alive. */
    const liveC=S.chats.find(x=>x.id===c.id)||c;
    const liveM=(liveC.msgs||[]).find(x=>threadMessageKey(x)===key)||m;
    openMessageMenu(liveC,liveM,th);
  });

  th.appendChild(row);
  syncDmMediaNode(row,m);
  const dmMediaEl=row.querySelector('.media img, .media video');
  if(m.media && dmMediaEl) rememberDmMediaGeometryFromElement(m.media,dmMediaEl);
  rememberDmRow(c.id,m,i,row);
  wireDmThreadLazyMedia(th,c);

  /* Arrival animation is one-shot. Removing the marker after it ends means
     moving this same cached node on a later DM open can never replay it. */
  if(animate) setTimeout(()=>{
    row.classList.remove('dm-new-message');
    const bub=row.querySelector('.bub');
    if(bub){
      bub.style.animation='none';
      bub.style.opacity='1';
      bub.style.transform='none';
      bub.style.visibility='visible';
    }
  },340);
  return row;
}

/* Focus only after the compose/reply modal has completely finished its entrance.
   This prevents the iOS keyboard from racing the 500ms modal animation and panning
   the whole app while the screen is still moving. */
function focusAfterModalShown(modal, field){
  let finished=false;
  let timer=0;
  const focusNow=()=>{
    if(finished) return;
    finished=true;
    clearTimeout(timer);
    modal.removeEventListener('transitionend',onEnd);
    if(!modal.isConnected || !modal.classList.contains('on') || !field.isConnected) return;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      if(!modal.isConnected || !modal.classList.contains('on') || !field.isConnected) return;
      try{ field.focus({preventScroll:true}); }catch(_){ field.focus(); }
    }));
  };
  const onEnd=e=>{
    if(e.target===modal && e.propertyName==='transform') focusNow();
  };
  modal.addEventListener('transitionend',onEnd);
  /* .modal transition is 500ms; fallback covers reduced-motion / missed events. */
  timer=setTimeout(focusNow,560);
}

/* =========================================================
   REPLY COMPOSER  —  the same full screen the post composer uses,
   minus the category tags
   ========================================================= */
function openReplyCompose(p, toReply, done){
  if($('#replyM')) return;

/* =========================================================
   DEVICE NOTIFICATIONS / PWA
   ========================================================= */
let IROHA_SW_REG=null;

function isStandaloneWebApp(){
  return !!(
    window.matchMedia?.('(display-mode: standalone)').matches ||
    window.navigator.standalone === true
  );
}
function notificationSupported(){
  return 'Notification' in window && 'serviceWorker' in navigator;
}
function notificationPermission(){
  return notificationSupported() ? Notification.permission : 'unsupported';
}
function notificationPermissionLabel(){
  const p=notificationPermission();
  if(p==='granted') return 'オン';
  if(p==='denied') return '端末設定でオフ';
  if(p==='unsupported') return 'この端末では利用できません';
  return 'オフ';
}
async function ensureIrohaServiceWorker(){
  if(!('serviceWorker' in navigator)) return null;
  try{
    const reg=await navigator.serviceWorker.register('./iroha-sw.js',{scope:'./'});
    IROHA_SW_REG=reg;
    await navigator.serviceWorker.ready;
    return reg;
  }catch(e){
    console.warn('[iroha notify] service worker',e);
    return null;
  }
}
async function requestDeviceNotifications(){
  if(!notificationSupported()){
    toast('このブラウザでは端末通知を利用できません');
    return false;
  }

  /* iPhone/iPad Web Push is for Home Screen web apps. */
  const isiOS=/iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  if(isiOS && !isStandaloneWebApp()){
    toast('iPhoneではホーム画面に追加したirohaから設定してください');
    return false;
  }

  const reg=await ensureIrohaServiceWorker();
  if(!reg){
    toast('通知の準備に失敗しました');
    return false;
  }

  let permission=Notification.permission;
  if(permission==='default'){
    permission=await Notification.requestPermission();
  }

  if(permission==='granted') return true;
  if(permission==='denied'){
    toast('通知が拒否されています。端末の通知設定から変更できます');
    return false;
  }
  return false;
}

/* ---------- Web Push ----------
   A subscription is this device's mailbox address plus the keys that let the
   server encrypt for it. We hand it to Supabase so the Edge Function can find
   it later. Anything else about the person stays out of it. */
function urlBase64ToUint8Array(base64){
  const padded=(base64+'='.repeat((4-base64.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(padded);
  const out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
  return out;
}
function abToB64(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf)));
}

async function ensureBrowserPushSubscription(){
  if(!pushConfigured()) return null;
  if(notificationPermission()!=='granted') return null;
  if(!('PushManager' in window)) return null;

  const reg=IROHA_SW_REG || await ensureIrohaServiceWorker();
  if(!reg) return null;

  let sub=await reg.pushManager.getSubscription();

  if(sub){
    const current=abToB64(
      sub.options?.applicationServerKey || new ArrayBuffer(0)
    );

    const wanted=abToB64(
      urlBase64ToUint8Array(VAPID_PUBLIC_KEY).buffer
    );

    if(current && wanted && current!==wanted){
      await sub.unsubscribe();
      sub=null;
    }
  }

  if(!sub){
    sub=await reg.pushManager.subscribe({
      userVisibleOnly:true,
      applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
  }

  return sub;
}

async function pushSubscribe(){
  if(!CLOUD.enabled) return false;

  try{
    const sub=await ensureBrowserPushSubscription();
    if(!sub) return false;

    const j=sub.toJSON();

    if(!j?.endpoint || !j.keys?.p256dh || !j.keys?.auth){
      return false;
    }

    await cloudEnsureProfile();

    const q=await CLOUD.client
      .from('push_subscriptions')
      .upsert({
        endpoint:j.endpoint,
        user_id:CLOUD.userId,
        p256dh:j.keys.p256dh,
        auth:j.keys.auth,
        user_agent:navigator.userAgent.slice(0,200),
        notify_dm:!!S.notifyDM,
        notify_activity:!!S.notifyActivity,
        quiet_until:(S.quiet && S.quietUntil>Date.now())
          ? new Date(S.quietUntil).toISOString()
          : null,
        last_seen_at:new Date().toISOString(),
        failed_at:null
      },{onConflict:'endpoint'});

    if(q.error) throw q.error;

    return true;

  }catch(e){
    console.warn('[iroha push] subscribe',e);
    return false;
  }
}

async function pushUnsubscribe(){
  try{
    const reg=IROHA_SW_REG || (('serviceWorker' in navigator) ? await navigator.serviceWorker.ready : null);
    const sub=reg && await reg.pushManager?.getSubscription();
    if(!sub) return;
    const endpoint=sub.endpoint;
    await sub.unsubscribe();
    if(CLOUD.enabled && endpoint){
      await CLOUD.client.from('push_subscriptions').delete().eq('endpoint',endpoint);
    }
  }catch(e){ console.warn('[iroha push] unsubscribe',e); }
}

/* Keep the row warm on every launch, so a subscription that the browser
   quietly renewed does not go stale in the table. */
async function pushRefresh(){
  if(!S.notifyWanted) return;
  if(notificationPermission()!=='granted') return;
  await pushSubscribe();
}

async function pushIsActive(){
  if(!S.notifyWanted) return false;
  if(notificationPermission()!=='granted') return false;
  if(!CLOUD.enabled) return false;

  try{
    const reg=IROHA_SW_REG || await ensureIrohaServiceWorker();
    if(!reg) return false;

    const sub=await reg.pushManager.getSubscription();
    if(!sub) return false;

    const q=await CLOUD.client
      .from('push_subscriptions')
      .select('endpoint')
      .eq('endpoint',sub.endpoint)
      .eq('user_id',CLOUD.userId)
      .maybeSingle();

    return !q.error && !!q.data;

  }catch(_){
    return false;
  }
}

async function syncNotificationSettingsUI(root=document){
  const sw=$('#notifySw',root);
  const label=$('#notifyNow',root);

  const active=await pushIsActive();

  if(sw){
    sw.classList.toggle('on',active);
  }

  if(label){
    const p=notificationPermission();

    if(active){
      label.textContent='オン';
    }else if(p==='denied'){
      label.textContent='端末設定でオフ';
    }else if(p==='unsupported'){
      label.textContent='この端末では利用できません';
    }else{
      label.textContent='オフ';
    }
  }

  return active;
}

/* unsend: the message simply stops existing — no tombstone, no notice */
function openMessageMenu(c, m, th){
  openMenu([
    ...(m.t ? [{t:'テキストをコピー', fn:()=>{
      try{ navigator.clipboard.writeText(m.t); toast('コピーしました'); }
      catch(e){ toast('コピーできませんでした'); }
    }}] : []),
    {t:'送信を取り消す', danger:true, fn:()=>{
      const i=c.msgs.indexOf(m);
      if(i<0) return;
      c.msgs.splice(i,1);
      cloudUnsendMessage(m).catch(e=>cloudErr('unsend',e));
      haptic(12);
      if(th) syncThread(th,c);
