   ========================================================= */
function pickImage(cb){
  const inp=el('<input type="file" accept="image/*" style="position:absolute;left:-9999px">');
  document.body.appendChild(inp);
  inp.addEventListener('change',()=>{
    const f=inp.files && inp.files[0];
    inp.remove();
    if(!f) return;
    if(!/^image\//.test(f.type)){ toast('画像ファイルを選んでください'); return; }
    const rd=new FileReader();
    rd.onload=()=>cb(rd.result);
    rd.onerror=()=>toast('画像を読み込めませんでした');
    rd.readAsDataURL(f);
  });
  inp.click();
}

/* aspect: 1 = square/avatar, 3 = wide banner.  out = exported width in px. */
function openCropper(src, {aspect=1, round=false, out=512, title='切り抜き'}, done){
  if($('.crop')) return;
  const vw=Math.min(window.innerWidth, 520);
  const fw=Math.min(vw-32, 340);
  const fh=Math.round(fw/aspect);

  const m=el(`<div class="crop">
    <div class="crop-bar">
      <button id="crNo">キャンセル</button>
      <div class="ttl">${esc(title)}</div>
      <button class="go" id="crGo">完了</button>
    </div>
    <div class="crop-stagewrap">
      <div class="crop-stage" id="crStage" style="width:${fw}px;height:${fh}px">
        <img id="crImg" alt="">
        <div class="crop-mask">
          <div class="hole${round?' round':''}"></div>
          <div class="grid">
            <i class="v" style="left:33.33%"></i><i class="v" style="left:66.66%"></i>
            <i class="h" style="top:33.33%"></i><i class="h" style="top:66.66%"></i>
          </div>
        </div>
      </div>
    </div>
    <div class="crop-tools">
      <p class="crop-hint">ドラッグで位置を調整・ピンチかスライダーで拡大</p>
      <div class="zoomrow">
        ${I.image}
        <input type="range" id="crZoom" min="100" max="320" value="100">
        ${I.plusS}
      </div>
    </div>
  </div>`);
  $('#overlays').appendChild(m);
  raf(()=>m.classList.add('on'));

  const img=$('#crImg',m), stage=$('#crStage',m), zoom=$('#crZoom',m);
  let nw=0, nh=0, base=1, z=1, x=0, y=0;

  img.onload=()=>{
    nw=img.naturalWidth; nh=img.naturalHeight;
    base=Math.max(fw/nw, fh/nh);          /* cover the frame */
    z=1; x=0; y=0; apply();
  };
  img.src=src;

  function clamp(){
    const sw=nw*base*z, sh=nh*base*z;
    const mx=Math.max(0,(sw-fw)/2), my=Math.max(0,(sh-fh)/2);
    x=Math.min(mx,Math.max(-mx,x));
    y=Math.min(my,Math.max(-my,y));
  }
  function apply(){
    clamp();
    const sw=nw*base*z, sh=nh*base*z;
    img.style.transform=`translate3d(${(x-sw/2).toFixed(2)}px,${(y-sh/2).toFixed(2)}px,0)`;
    img.style.width=sw+'px'; img.style.height=sh+'px';
  }

  /* pan + pinch */
  const pts=new Map();
  let startX=0, startY=0, startZ=1, pinch0=0;
  stage.addEventListener('pointerdown',e=>{
    captureViewerPointer(stage,e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){ startX=e.clientX-x; startY=e.clientY-y; }
    if(pts.size===2){ pinch0=dist(); startZ=z; }
  });
  stage.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){ const p=[...pts.values()][0]; x=p.x-startX; y=p.y-startY; apply(); }
    else if(pts.size===2 && pinch0>0){
      z=Math.min(3.2,Math.max(1,startZ*(dist()/pinch0)));
      zoom.value=Math.round(z*100); apply();
    }
  });
  const drop=e=>{ pts.delete(e.pointerId); uncaptureViewerPointer(stage,e.pointerId); if(pts.size<2) pinch0=0;
    if(pts.size===1){ const p=[...pts.values()][0]; startX=p.x-x; startY=p.y-y; } };
  stage.addEventListener('pointerup',drop);
  stage.addEventListener('pointercancel',drop);
  function dist(){ const [a,b]=[...pts.values()]; return Math.hypot(a.x-b.x,a.y-b.y); }

  zoom.addEventListener('input',()=>{ z=+zoom.value/100; apply(); });

  $('#crNo',m).onclick=close;
  $('#crGo',m).onclick=()=>{
    const scale=base*z;
    const cv=document.createElement('canvas');
    cv.width=out; cv.height=Math.round(out/aspect);
    const g=cv.getContext('2d');
    g.imageSmoothingQuality='high';
    /* frame rectangle expressed in source-image coordinates */
    const sw=fw/scale, sh=fh/scale;
    const sx=nw/2-(fw/2+x)/scale, sy=nh/2-(fh/2+y)/scale;
    g.drawImage(img, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
    let url;
    try{ url=cv.toDataURL('image/jpeg',0.88); }
    catch(err){ toast('画像を書き出せませんでした'); return; }
    haptic(12); close(); setTimeout(()=>done(url),200);
  };
  function close(){ m.classList.remove('on'); setTimeout(()=>m.remove(),500); }
}


/* =========================================================
   ATTACHMENTS  —  photo, video and voice notes
   ========================================================= */
const MEDIA_LABEL={image:'画像', video:'動画', audio:'音声'};

/* pick a file and hand back {kind, src, name} */
/* One chosen file, described without waiting on anything slow. */
function describePickedFile(f){
  const kind = /^video\//.test(f.type) ? 'video' : /^audio\//.test(f.type) ? 'audio' : 'image';
  /* Never block attachment selection on metadata decoding. Some iPhone photos
     can leave an Image load pending for a long time; posting must still work. */
  const media={kind,src:URL.createObjectURL(f),name:f.name};
  /* Keep the source File as non-enumerable upload state. It never enters the
     post JSON/DB payload, but cloudUploadMedia can use it directly. */
  try{Object.defineProperty(media,'_file',{value:f,configurable:true});}catch(_){}
  if(kind==='image'||kind==='video'){
    pickedVisualGeometry(kind,media.src).then(g=>{
      /* The caller keeps this same object reference, so dimensions can arrive
         in the background without delaying the user's file selection. */
      if(g){media.w=g.w;media.h=g.h;}
    }).catch(()=>{});
  }
  return media;
}

/* multiple:true hands back an array; otherwise one item, as before. */
function pickMedia(accept, cb, {multiple=false, max=MEDIA_MAX}={}){
  const inp=el(`<input type="file" accept="${accept}"${multiple?' multiple':''} style="position:absolute;left:-9999px">`);
  document.body.appendChild(inp);
  inp.addEventListener('change',()=>{
    const files=[...(inp.files||[])];
    inp.remove();
    if(!files.length) return;
    if(!multiple){ cb(describePickedFile(files[0])); return; }
    const picked=files.slice(0,max).map(describePickedFile);
    if(files.length>max) toast(`${MEDIA_MAX}枚までです`);
    cb(picked);
  });
  inp.click();
}

/* how the viewer's own setting says this should be shown */
function mediaMode(m){
  if(!m) return 'none';
  if(m.kind==='audio') return 'show';        /* the setting covers stills and video */
  if(S.media==='hide') return 'off';
  if(S.media==='safety') return 'blur';
  return 'show';
}

/* Safety reveal state is shared by feed, post detail and profile/reply views. */
const REVEALED_MEDIA=new Set();
function mediaKey(m){ return String(m && (m.src||m.name||'')); }
function mediaKeyAttr(m){ return encodeURIComponent(mediaKey(m)); }

/* Home-feed intrinsic media geometry + generated video thumbnail cache.
   These are presentation-only. New post uploads also carry w/h inside the existing
   media JSONB so another device can reserve the correct box before first paint. */
const FEED_MEDIA_GEOMETRY_KEY='iroha_feed_media_intrinsic_v1';
const FEED_VIDEO_POSTER_KEY='iroha_feed_video_posters_v1';
const FEED_MEDIA_CACHE_MAX=500;
const FEED_VIDEO_POSTER_MAX=36;
let FEED_MEDIA_GEOMETRY=(()=>{try{const v=JSON.parse(localStorage.getItem(FEED_MEDIA_GEOMETRY_KEY)||'{}');return v&&typeof v==='object'?v:{}}catch(_){return {}}})();
let FEED_VIDEO_POSTERS=(()=>{try{const v=JSON.parse(localStorage.getItem(FEED_VIDEO_POSTER_KEY)||'{}');return v&&typeof v==='object'?v:{}}catch(_){return {}}})();
const FEED_POSTER_JOBS=new Map();
function feedMediaCacheKey(m){
  if(!m) return '';
  if(m.bucket&&m.path) return `${m.bucket}:${m.path}`;
  return String(m.src||m.name||'');
}
function validMediaWH(w,h){
  w=Number(w)||0; h=Number(h)||0;
  return Number.isFinite(w)&&Number.isFinite(h)&&w>0&&h>0;
}
function feedMediaGeometry(m){
  const mw=Number(m&&m.w)||0, mh=Number(m&&m.h)||0;
  if(validMediaWH(mw,mh)) return {w:mw,h:mh,known:true};
  const key=feedMediaCacheKey(m), v=key&&FEED_MEDIA_GEOMETRY[key];
  const w=Number(v&&v.w)||0, h=Number(v&&v.h)||0;
  return validMediaWH(w,h)?{w,h,known:true}:null;
}
function rememberFeedMediaGeometry(key,w,h){
  if(!key||!validMediaWH(w,h)) return;
  w=Math.round(Number(w)); h=Math.round(Number(h));
  const prev=FEED_MEDIA_GEOMETRY[key];
  if(prev&&Number(prev.w)===w&&Number(prev.h)===h) return;
  const next={...FEED_MEDIA_GEOMETRY}; delete next[key]; next[key]={w,h};
  const keys=Object.keys(next);
  if(keys.length>FEED_MEDIA_CACHE_MAX) for(const k of keys.slice(0,keys.length-FEED_MEDIA_CACHE_MAX)) delete next[k];
  FEED_MEDIA_GEOMETRY=next;
  try{localStorage.setItem(FEED_MEDIA_GEOMETRY_KEY,JSON.stringify(next))}catch(_){}
}
function feedMediaBoxStyle(m){
  const g=feedMediaGeometry(m) || (m?.kind==='video'?{w:16,h:9,known:false}:{w:4,h:3,known:false});
  const ratio=g.w/g.h;
  /* Preserve the full image/video while respecting the existing 340px height cap. */
  const maxW=Math.max(80,Math.min(2400,340*ratio));
  return {style:`width:100%;max-width:${maxW.toFixed(2)}px;aspect-ratio:${g.w} / ${g.h}`,known:g.known,key:feedMediaCacheKey(m)};
}
function feedVideoPoster(key){ return key&&typeof FEED_VIDEO_POSTERS[key]==='string'?FEED_VIDEO_POSTERS[key]:''; }
function rememberFeedVideoPoster(key,dataUrl){
  if(!key||!/^data:image\/jpeg;base64,/i.test(String(dataUrl||''))) return;
  const next={...FEED_VIDEO_POSTERS}; delete next[key]; next[key]=dataUrl;
  const keys=Object.keys(next);
  if(keys.length>FEED_VIDEO_POSTER_MAX) for(const k of keys.slice(0,keys.length-FEED_VIDEO_POSTER_MAX)) delete next[k];
  FEED_VIDEO_POSTERS=next;
  try{localStorage.setItem(FEED_VIDEO_POSTER_KEY,JSON.stringify(next))}catch(_){}
}
function captureFeedVideoPoster(src,key,targetVideo){
  if(!src||!key||FEED_POSTER_JOBS.has(key)) return;
  const cached=feedVideoPoster(key); if(cached){ if(targetVideo?.isConnected) targetVideo.poster=cached; return; }
  const job=(async()=>{
    const v=document.createElement('video');
    v.muted=true; v.playsInline=true; v.preload='auto'; v.crossOrigin='anonymous';
    const cleanup=()=>{try{v.pause();v.removeAttribute('src');v.load()}catch(_){}};
    try{
      await new Promise((resolve,reject)=>{
        const timer=setTimeout(()=>reject(new Error('thumb metadata timeout')),4500);
        v.addEventListener('loadedmetadata',()=>{clearTimeout(timer);resolve()},{once:true});
        v.addEventListener('error',()=>{clearTimeout(timer);reject(new Error('thumb load failed'))},{once:true});
        v.src=src;
      });
      if(!validMediaWH(v.videoWidth,v.videoHeight)) throw new Error('no video size');
      const dur=Number.isFinite(v.duration)?v.duration:0;
      const at=dur>0?Math.min(.18,Math.max(.03,dur*.03)):.05;
      await new Promise((resolve,reject)=>{
        const timer=setTimeout(()=>reject(new Error('thumb seek timeout')),3500);
        const done=()=>{clearTimeout(timer);resolve()};
        v.addEventListener('seeked',done,{once:true});
        v.addEventListener('error',()=>{clearTimeout(timer);reject(new Error('thumb seek failed'))},{once:true});
        try{v.currentTime=at}catch(_){done()}
      });
      const max=480, scale=Math.min(1,max/Math.max(v.videoWidth,v.videoHeight));
      const cw=Math.max(2,Math.round(v.videoWidth*scale)), ch=Math.max(2,Math.round(v.videoHeight*scale));
      const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
      const ctx=cv.getContext('2d'); if(!ctx) throw new Error('no canvas');
      ctx.drawImage(v,0,0,cw,ch);
      const data=cv.toDataURL('image/jpeg',.76);
      rememberFeedVideoPoster(key,data);
      if(targetVideo?.isConnected) targetVideo.poster=data;
    }catch(e){ console.debug('[iroha video thumbnail]',e); }
    finally{cleanup()}
  })();
  FEED_POSTER_JOBS.set(key,job);
  job.finally(()=>FEED_POSTER_JOBS.delete(key));
}
function wireFeedMediaStability(root){
  if(!root) return;
  root.querySelectorAll('.feed-media-stable').forEach(box=>{
    const node=box.querySelector('img,video'); if(!node) return;
    const key=decodeURIComponent(box.dataset.feedMediaKey||'');
    const storeSize=()=>{
      const w=node.tagName==='VIDEO'?node.videoWidth:node.naturalWidth;
      const h=node.tagName==='VIDEO'?node.videoHeight:node.naturalHeight;
      rememberFeedMediaGeometry(key,w,h);
      /* Remembering alone only helps the next render. The box on screen right
         now was reserved from a guess, so correct it here or the card visibly
         jumps the moment the picture paints. */
      if(!validMediaWH(w,h)) return;
      if(box.dataset.feedMediaSized==='1') return;
      box.dataset.feedMediaSized='1';
      box.style.maxWidth=`${Math.max(80,Math.min(2400,340*(w/h))).toFixed(2)}px`;
      box.style.aspectRatio=`${w} / ${h}`;
    };
    if(node.tagName==='IMG'){
      if(node.complete&&node.naturalWidth) storeSize();
      else{
        node.addEventListener('load',storeSize,{once:true});
      }
      return;
    }
    if(node.readyState>=1&&node.videoWidth) storeSize(); else node.addEventListener('loadedmetadata',storeSize,{once:true});
    const cached=feedVideoPoster(key);
    if(cached){ node.poster=cached; return; }
    const startThumb=()=>captureFeedVideoPoster(node.currentSrc||node.src,key,node);
    if('IntersectionObserver' in window){
      const io=new IntersectionObserver(entries=>{
        if(entries.some(x=>x.isIntersecting)){io.disconnect();startThumb()}
      },{root:root.closest('.scroll')||$('#feedScroll')||null,rootMargin:'500px 0px'});
      io.observe(box);
    }else startThumb();
  });
}

/* Feed video playback is entirely user-initiated: nothing plays until the
   center button is tapped. Scroll position is still tracked, but only to
   pause a video the user started once it scrolls mostly out of view — this
   never resumes anything and never picks a video to start on its own. Sound
   is a shared preference across every feed video, same as before, it just
   now controls how a tapped-play video starts instead of an autoplay policy. */
let FEED_VIDEO_MUTED=true;
let FEED_VIDEO_ACTIVE=null;
let FEED_VIDEO_AUTOPLAY_CLEANUP=null;
let FEED_VIDEO_AUTOPLAY_RAF=0;
const FEED_VIDEO_CHROME_TIMERS=new WeakMap();
const FEED_VIDEO_CHROME_HIDE_MS=2300;
function clearFeedVideoChromeTimer(box){
  if(!box) return;
  const t=FEED_VIDEO_CHROME_TIMERS.get(box);
  if(t){ clearTimeout(t); FEED_VIDEO_CHROME_TIMERS.delete(box); }
}
function scheduleFeedVideoChromeHide(v,delay=FEED_VIDEO_CHROME_HIDE_MS){
  const box=v&&v.closest('.feed-media-stable'); if(!box) return;
  clearFeedVideoChromeTimer(box);
  if(v.paused||v.ended){ box.classList.remove('chrome-hidden'); return; }
  box.classList.remove('chrome-hidden');
  const timer=setTimeout(()=>{
    FEED_VIDEO_CHROME_TIMERS.delete(box);
    if(v.isConnected&&!v.paused&&!v.ended) box.classList.add('chrome-hidden');
  },delay);
  FEED_VIDEO_CHROME_TIMERS.set(box,timer);
}
function feedVideoSoundIcon(){ return FEED_VIDEO_MUTED?I.volumeOff:I.volume; }
function paintFeedVideoMuteState(root=document){
  root.querySelectorAll('[data-feed-video-mute]').forEach(btn=>{
    btn.innerHTML=feedVideoSoundIcon();
    btn.setAttribute('aria-label',FEED_VIDEO_MUTED?'動画のミュートを解除':'動画をミュート');
    btn.setAttribute('aria-pressed',FEED_VIDEO_MUTED?'true':'false');
  });
  root.querySelectorAll('video[data-feed-video]').forEach(v=>{ v.muted=FEED_VIDEO_MUTED; });
}
function toggleFeedVideoMute(){
  FEED_VIDEO_MUTED=!FEED_VIDEO_MUTED;
  paintFeedVideoMuteState(document);
}
function pauseFeedVideoAutoplay(){
  if(FEED_VIDEO_AUTOPLAY_RAF){ cancelAnimationFrame(FEED_VIDEO_AUTOPLAY_RAF); FEED_VIDEO_AUTOPLAY_RAF=0; }
  document.querySelectorAll('#feed video[data-feed-video]').forEach(v=>{ try{v.pause()}catch(_){} });
  FEED_VIDEO_ACTIVE=null;
}
function refreshFeedVideoAutoplay(){
  if(FEED_VIDEO_AUTOPLAY_RAF) return;
  FEED_VIDEO_AUTOPLAY_RAF=requestAnimationFrame(()=>{
    FEED_VIDEO_AUTOPLAY_RAF=0;
    const active=FEED_VIDEO_ACTIVE;
    if(!active||!active.isConnected||active.paused) return;
    const feed=$('#feed'), scroller=$('#feedScroll');
    if(!feed||!scroller||S.tab!=='home'||document.visibilityState==='hidden'||(typeof stackEls!=='undefined'&&stackEls.length)){
      pauseFeedVideoAutoplay(); return;
    }
    const sr=scroller.getBoundingClientRect();
    const viewTop=Math.max(0,sr.top), viewBottom=Math.min(innerHeight,sr.bottom);
    if(viewBottom<=viewTop){ pauseFeedVideoAutoplay(); return; }
    const r=active.getBoundingClientRect();
    if(r.height<=0||r.width<=0){ pauseFeedVideoAutoplay(); return; }
    const shown=Math.max(0,Math.min(r.bottom,viewBottom)-Math.max(r.top,viewTop));
    if(shown/r.height<.34) pauseFeedVideoAutoplay();
  });
}
/* Center button: tap to start, tap again to pause. Starting one pauses every
   other feed video and any playing voice note, so only one thing plays at a
   time. Starts muted/unmuted according to the shared sound button. */
function toggleFeedVideoPlay(btn){
  const box=btn.closest('.media'); const v=box&&box.querySelector('video[data-feed-video]');
  if(!v) return;
  if(v.paused||v.ended){
    document.querySelectorAll('#feed video[data-feed-video]').forEach(o=>{ if(o!==v&&!o.paused){ try{o.pause()}catch(_){} } });
    stopAudio();
    v.muted=FEED_VIDEO_MUTED;
    FEED_VIDEO_ACTIVE=v;
    const p=v.play();
    if(p&&p.catch) p.catch(()=>toast('動画を再生できませんでした'));
  }else{
    v.pause();
  }
}
/* Corner button: the same full video detail screen a tap anywhere used to
   open directly. */
function openFeedVideoDetail(btn){
  const box=btn.closest('.media'); const v=box&&box.querySelector('video');
  if(v) openMediaViewer(v.currentSrc||v.src,'video',v);
}
function paintFeedVideoBox(v){
  const box=v.closest('.media'); if(!box) return;
  const btn=box.querySelector('[data-feed-video-play]'); if(!btn) return;
  const playing=!v.paused&&!v.ended;
  btn.innerHTML=playing?I.pause:I.play;
  btn.setAttribute('aria-label',playing?'一時停止':'再生');
  /* While playing, show the controls briefly and then fade them away like a
     normal video player. Pausing always brings them back immediately. */
  if(playing){
    scheduleFeedVideoChromeHide(v);
  }else{
    clearFeedVideoChromeTimer(box);
    box.classList.remove('chrome-hidden');
    if(FEED_VIDEO_ACTIVE===v) FEED_VIDEO_ACTIVE=null;
  }
}
function wireFeedVideoButtons(root){
  (root||document).querySelectorAll('video[data-feed-video]:not([data-feed-video-wired])').forEach(v=>{
    v.dataset.feedVideoWired='1';
    v.loop=true; v.playsInline=true;
    v.addEventListener('play',()=>paintFeedVideoBox(v));
    v.addEventListener('pause',()=>paintFeedVideoBox(v));
  });
}
function wireFeedVideoAutoplay(root){
  if(FEED_VIDEO_AUTOPLAY_CLEANUP){ FEED_VIDEO_AUTOPLAY_CLEANUP(); FEED_VIDEO_AUTOPLAY_CLEANUP=null; }
  const scroller=$('#feedScroll'); if(!root||!scroller) return;
  const schedule=()=>refreshFeedVideoAutoplay();
  scroller.addEventListener('scroll',schedule,{passive:true});
  window.addEventListener('resize',schedule,{passive:true});
  document.addEventListener('visibilitychange',schedule);
  FEED_VIDEO_AUTOPLAY_CLEANUP=()=>{
    scroller.removeEventListener('scroll',schedule);
    window.removeEventListener('resize',schedule);
    document.removeEventListener('visibilitychange',schedule);
  };
  schedule();
}

/* Read intrinsic dimensions before a newly selected visual enters the optimistic feed. */
function pickedVisualGeometry(kind,src){
  return new Promise(resolve=>{
    if(kind==='image'){
      const img=new Image();
      let settled=false;
      const finish=(ok=true)=>{
        if(settled) return; settled=true; clearTimeout(timer);
        const out=ok&&validMediaWH(img.naturalWidth,img.naturalHeight)?{w:img.naturalWidth,h:img.naturalHeight}:null;
        img.onload=null; img.onerror=null; resolve(out);
      };
      /* Geometry is only a layout optimisation. Never let a stubborn decoder
         block image attachment or leave a background job hanging forever. */
      const timer=setTimeout(()=>finish(false),1800);
      img.onload=()=>finish(true); img.onerror=()=>finish(false); img.src=src; return;
    }
    if(kind==='video'){
      const v=document.createElement('video'); v.preload='metadata'; v.muted=true; v.playsInline=true;
      let settled=false;
      const finish=()=>{if(settled)return;settled=true;clearTimeout(timer);const out=validMediaWH(v.videoWidth,v.videoHeight)?{w:v.videoWidth,h:v.videoHeight}:null; try{v.removeAttribute('src');v.load()}catch(_){} resolve(out)};
      const timer=setTimeout(finish,2200);
      v.addEventListener('loadedmetadata',finish,{once:true});
      v.addEventListener('error',finish,{once:true});
      v.src=src; return;
    }
    resolve(null);
  });
}

/* DM image display-size cache.
   Display-only: never changes messages.media, uploads, Storage paths, or send payloads.
   We remember the final CSS content-box width AND height that iroha actually rendered.
   On later renders the wrapper reserves that same box; narrower screens scale it down
   proportionally, so the image never stretches and never exceeds its available width. */
const DM_MEDIA_GEOMETRY_KEY='iroha_dm_media_display_box_v2';
const DM_MEDIA_GEOMETRY_MAX=600;
let DM_MEDIA_GEOMETRY=(()=>{
  try{
    const v=JSON.parse(localStorage.getItem(DM_MEDIA_GEOMETRY_KEY)||'{}');
    return v && typeof v==='object' ? v : {};
  }catch(_){ return {}; }
})();
function dmMediaGeometryKey(m){
  if(!m || !m.bucket || !m.path) return '';
  return `${m.bucket}:${m.path}`;
}
function dmMediaGeometry(m){
  /* The size stored with the message wins: it is there for everyone, not just
     the device that uploaded it. The local cache is only a fallback. */
  const mw=Number(m&&m.w)||0, mh=Number(m&&m.h)||0;
  if(validMediaWH(mw,mh)) return {w:mw,h:mh};
  const key=dmMediaGeometryKey(m);
  if(!key) return null;
  const v=DM_MEDIA_GEOMETRY[key];
  const w=Number(v&&v.w)||0, h=Number(v&&v.h)||0;
  if(!Number.isFinite(w)||!Number.isFinite(h)||w<=0||h<=0) return null;
  return {w,h};
}
function rememberDmMediaGeometry(m,w,h){
  const key=dmMediaGeometryKey(m);
  w=Math.round((Number(w)||0)*100)/100;
  h=Math.round((Number(h)||0)*100)/100;
  if(!key || !Number.isFinite(w) || !Number.isFinite(h) || w<=0 || h<=0) return;

  /* Values come from the rendered DM box, but reject obviously broken measurements. */
  if(w>260 || h>380) return;

  const prev=DM_MEDIA_GEOMETRY[key];
  if(prev && Math.abs((Number(prev.w)||0)-w)<.1 && Math.abs((Number(prev.h)||0)-h)<.1) return;

  /* Reinsert to keep object order roughly LRU-like without touching media data. */
  const next={};
  for(const [k,v] of Object.entries(DM_MEDIA_GEOMETRY)){
    if(k!==key) next[k]=v;
  }
  next[key]={w,h};
  const keys=Object.keys(next);
  if(keys.length>DM_MEDIA_GEOMETRY_MAX){
    for(const k of keys.slice(0,keys.length-DM_MEDIA_GEOMETRY_MAX)) delete next[k];
  }
  DM_MEDIA_GEOMETRY=next;
  try{ localStorage.setItem(DM_MEDIA_GEOMETRY_KEY,JSON.stringify(next)); }catch(_){}
}
function rememberDmMediaGeometryFromElement(m,mediaEl){
  if(!m || !mediaEl || !['IMG','VIDEO'].includes(mediaEl.tagName)) return;

  const ready=()=>mediaEl.tagName==='IMG'
    ? (mediaEl.complete && mediaEl.naturalWidth>0)
    : (mediaEl.readyState>=1 && mediaEl.videoWidth>0 && mediaEl.videoHeight>0);

  const measure=()=>{
    /* Two frames let the media layout settle. client/computed size ignores the
       message entrance transform, so we do not accidentally save a scaled animation frame. */
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const box=mediaEl.closest('.media');
      if(!box || !box.isConnected || !ready()) return;
      const cs=getComputedStyle(box);
      const w=parseFloat(cs.width)||box.clientWidth||0;
      const h=parseFloat(cs.height)||box.clientHeight||0;
      rememberDmMediaGeometry(m,w,h);
    }));
  };

  if(ready()) measure();
  else mediaEl.addEventListener(mediaEl.tagName==='VIDEO'?'loadedmetadata':'load',measure,{once:true});
}


/* One attachment renders exactly as before. Several become a swipeable strip
   with a dot per item, the way Instagram does it. */
/* Measured off Threads: several attachments share one height and keep their
   own aspect ratio, so the strip reads as a row of pictures rather than a
   slideshow. It runs past the right edge and is dragged sideways. */
const MEDIA_STRIP_H=240;   /* pt */
const MEDIA_STRIP_GAP=8;


/* True while a strip is settling from a drag, so a click that lands right
   after the flick can be ignored. */
function stripJustScrolled(node){
  const strip=node && node.closest && node.closest('.mstrip');
  if(!strip) return false;
  const until=Number(strip.dataset.scrolledUntil||0);
  return Date.now() < until;
}

/* Mark a strip as "in motion" for a moment after any scroll. */
function markStripScrolling(track){
  const strip=track.closest('.mstrip');
  if(!strip) return;
  strip.dataset.scrolledUntil=String(Date.now()+320);
}

function mediaGroupHTML(list, opts={}){
  const items=(list||[]).filter(Boolean);
  if(!items.length) return '';
  /* A lone attachment fills the column and never overflows it. */
  if(items.length===1) return mediaHTML(items[0],opts);

  const slides=items.map((m,i)=>{
    const g=feedMediaGeometry(m);
    /* Width follows the picture; height is shared. Without a known ratio a
       portrait-ish default keeps the row from lurching when it loads. */
    const ratio = g ? (g.w/g.h) : 0.8;
    /* Width follows the picture, but never so far that the row stops looking
       like a row: Threads always leaves the next one peeking in, and that peek
       is what says "there is more". The cap guarantees it for any shape. */
    const w=Math.round(Math.min(MEDIA_STRIP_H*Math.max(0.56,Math.min(1.34,ratio)), 258));
    return `<div class="mstrip-item" style="width:${w}px">
      ${mediaHTML(m,{...opts,stripped:true,loadPriority:i===0?opts.loadPriority:'low'})}
    </div>`;
  }).join('');

  return `<div class="mstrip" data-count="${items.length}">
    <div class="mstrip-track">${slides}</div>
  </div>`;
}

/* The strip scrolls natively, but the page needs to know a drag happened so a
   flick is not mistaken for a tap on the card underneath. */
function wireCarousels(root){
  (root||document).querySelectorAll('.mstrip-track:not([data-wired])').forEach(track=>{
    track.dataset.wired='1';
    track.addEventListener('scroll',()=>markStripScrolling(track),{passive:true});
  });
}

/* Carousels turn up in the feed, post detail, profile and DM. Rather than
   chase every render path, watch for them arriving. */
let CAROUSEL_WATCH=null;
function watchCarousels(){
  if(CAROUSEL_WATCH) return;
  CAROUSEL_WATCH=new MutationObserver(muts=>{
    for(const mu of muts){
      for(const node of mu.addedNodes){
        if(node.nodeType!==1) continue;
        if(node.classList?.contains('mstrip')||node.querySelector?.('.mstrip')){
          wireCarousels(document);
          return;
        }
      }
    }
  });
  CAROUSEL_WATCH.observe(document.body,{childList:true,subtree:true});
}

function mediaHTML(m, opts={}){
  if(!m) return '';

  const safeSrc = safeAssetUrl(m.src, { allowLocal: true });
  if(!safeSrc) return '';

  m = {...m, src:safeSrc};

  if(m.kind==='audio') return audioHTML(m);

  let mode=mediaMode(m);

  /* A just-selected upload is always previewed raw. My own posted media also skips safety blur. */
  if(opts.forceShow) mode='show';
  else if(opts.owner==='me' && mode==='blur') mode='show';

  const key=mediaKey(m), keyAttr=mediaKeyAttr(m);
  const wasRevealed=!!key && REVEALED_MEDIA.has(key);

  if(mode==='blur' && wasRevealed) mode='show';

  if(mode==='off')
    return `<div class="media-off">${I.eyeoff}<span>${MEDIA_LABEL[m.kind]}は非表示に設定されています</span></div>`;

  /* Keep v5's network priority rules. Only the viewer presentation changes. */
  const loadPriority=opts.loadPriority||'auto';
  const imgLoad=loadPriority==='high'
    ? ' loading="eager" fetchpriority="high"'
    : loadPriority==='low'
      ? ' loading="lazy" fetchpriority="low"'
      : '';
  const videoPreload=loadPriority==='low'?'none':'metadata';
  const feedBox=opts.feedStable ? feedMediaBoxStyle(m) : null;
  const feedBoxStyle=feedBox ? ` style="${feedBox.style}"` : '';
  const feedClass=feedBox ? ' feed-media-stable' : '';
  const feedData=feedBox ? ` data-feed-media-key="${encodeURIComponent(feedBox.key)}"` : '';
  const feedPoster=feedBox&&m.kind==='video' ? feedVideoPoster(feedBox.key) : '';

  /* DM media display box is local-only and never changes messages.media or upload payloads. */
  const dmGeom=(opts.dmStable && (m.kind==='image'||m.kind==='video')) ? dmMediaGeometry(m) : null;
  const dmBoxStyle=dmGeom
    ? ` style="width:${dmGeom.w}px;max-width:100%;height:auto;aspect-ratio:${dmGeom.w} / ${dmGeom.h}"`
    : '';
  const dmMediaStyle=dmGeom
    ? ' style="width:100%;height:100%;max-height:none;object-fit:cover"'
    : '';
  const feedMediaStyle=feedBox&&!dmGeom ? ` style="width:100%;height:100%;max-height:none;object-fit:${opts.stripped?'cover':'contain'}"` : '';
  const mediaStyle=dmMediaStyle||feedMediaStyle;
  const posterAttr=feedPoster?` poster="${escAttr(feedPoster)}"`:'';
  const crossAttr=feedBox?' crossorigin="anonymous"':'';
  /* Feed video never autoplays. data-feed-video only marks a video as eligible
     for the tap-to-play overlay below (built in onPostClick) and for the
     feed<->viewer playback-position link; every other context keeps the
     plain "tap to open" indicator, now including the profile grid, which
     used to autoplay silently with no affordance at all. */
  const feedInline=feedBox && !opts.noVideoAdornment;
  const feedVideoAttrs=feedInline ? ` data-feed-video` : '';
  const videoAdornment=feedInline
    ? `<button class="feed-video-play" data-feed-video-play type="button" aria-label="再生">${I.play}</button><button class="feed-video-mute" data-feed-video-mute type="button" aria-label="${FEED_VIDEO_MUTED?'動画のミュートを解除':'動画をミュート'}" aria-pressed="${FEED_VIDEO_MUTED?'true':'false'}">${feedVideoSoundIcon()}</button><button class="feed-video-expand" data-feed-video-expand type="button" aria-label="動画の詳細を見る">${I.expand}</button>`
    : `<span class="video-open-indicator" aria-hidden="true">${I.play}</span>`;

  const inner = m.kind==='video'
    ? `<video class="iroha-inline-video" src="${escAttr(m.src)}"${mediaStyle}${posterAttr}${crossAttr}${feedVideoAttrs} playsinline preload="${videoPreload}"></video>${videoAdornment}`
    : `<img src="${escAttr(m.src)}"${mediaStyle} alt="" decoding="async"${imgLoad}>`;

  const boxStyle=dmBoxStyle||feedBoxStyle;
  if(mode==='blur')
    return `<div class="media${feedClass} blurred" data-reveal data-media-key="${keyAttr}"${feedData}${boxStyle}>${inner}
      <div class="veil">${I.eye}<span>タップして表示<small>セーフティ表示がオンです</small></span></div></div>`;

  /* Only media that was manually revealed gets X-style “restore filter”. */
  const restore = wasRevealed && S.media==='safety' && !opts.forceShow && opts.owner!=='me'
    ? `<button class="media-filter-restore" data-restore-filter type="button">${I.eyeoff}<span>フィルターを戻す</span></button>` : '';

  const keyData = restore ? ` data-media-key="${keyAttr}"` : '';

  return `<div class="media${feedClass}"${keyData}${feedData}${boxStyle}>${inner}${restore}</div>`;
}

function mediaSaveType(src,blobType,kind){
  const t=String(blobType||'').toLowerCase();
  if(kind==='image' && t.startsWith('image/')) return t;
  if(kind==='video' && t.startsWith('video/')) return t;
  let path='';
  try{ path=decodeURIComponent(new URL(src,location.href).pathname).toLowerCase(); }catch(_){ path=String(src||'').toLowerCase(); }
  if(kind==='image'){
    if(/\.png(?:$|[?#])/.test(path)) return 'image/png';
    if(/\.webp(?:$|[?#])/.test(path)) return 'image/webp';
    if(/\.gif(?:$|[?#])/.test(path)) return 'image/gif';
    if(/\.heic(?:$|[?#])/.test(path)) return 'image/heic';
    return 'image/jpeg';
  }
  if(/\.mov(?:$|[?#])/.test(path)) return 'video/quicktime';
  if(/\.webm(?:$|[?#])/.test(path)) return 'video/webm';
  return 'video/mp4';
}
function mediaSaveExtension(type,kind){
  const t=String(type||'').toLowerCase();
  if(t.includes('jpeg')) return 'jpg';
  if(t.includes('png')) return 'png';
  if(t.includes('webp')) return 'webp';
  if(t.includes('gif')) return 'gif';
  if(t.includes('heic')) return 'heic';
  if(t.includes('quicktime')) return 'mov';
  if(t.includes('webm')) return 'webm';
  if(t.includes('mp4')) return 'mp4';
  return kind==='video'?'mp4':'jpg';
}
function prepareViewerMediaFile(src,kind){
  return (async()=>{
    const r=await fetch(src,{cache:'force-cache'});
    if(!r.ok) throw new Error(`media fetch ${r.status}`);
    const raw=await r.blob();
    const type=mediaSaveType(src,raw.type,kind);
    const blob=raw.type===type ? raw : raw.slice(0,raw.size,type);
    const ext=mediaSaveExtension(type,kind);
    const stamp=new Date().toISOString().replace(/[:.]/g,'-');
    const name=`iroha-${kind==='video'?'video':'photo'}-${stamp}.${ext}`;
    return {blob,file:new File([blob],name,{type}),name};
  })();
}
function mobileFileSharePreferred(){
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
}
function downloadPreparedMedia(prepared){
  const url=URL.createObjectURL(prepared.blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=prepared.name;
  a.rel='noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
async function saveViewerMedia(btn,preparedPromise,kind){
  if(btn.classList.contains('is-preparing')){
    toast('保存の準備中です');
    return;
  }
  if(btn.classList.contains('is-error')){
    toast('保存の準備に失敗しました。長押し保存をお試しください');
    return;
  }
  let prepared;
  try{ prepared=await preparedPromise; }
  catch(_){ toast('保存の準備に失敗しました'); return; }

  if(mobileFileSharePreferred() && navigator.share && navigator.canShare){
    try{
      if(navigator.canShare({files:[prepared.file]})){
        await navigator.share({files:[prepared.file],title:kind==='video'?'iroha 動画':'iroha 写真'});
        return;
      }
    }catch(err){
      if(err && err.name==='AbortError') return;
      console.warn('[iroha media share]',err);
    }
  }

  try{
    downloadPreparedMedia(prepared);
    toast(kind==='video'?'動画を保存しました':'画像を保存しました');
  }catch(err){
    console.warn('[iroha media save]',err);
    toast('保存できませんでした。長押し保存をお試しください');
  }
}
function feedVideoViewerLink(originEl){
  if(!(originEl instanceof HTMLVideoElement)||!originEl.matches('video[data-feed-video]')) return null;
  const box=originEl.closest('.feed-media-stable');
  return {
    origin:originEl,
    key:box?.dataset.feedMediaKey||'',
    time:Number.isFinite(originEl.currentTime)?originEl.currentTime:0
  };
}
function linkedFeedVideo(link){
  if(!link) return null;
  if(link.origin?.isConnected) return link.origin;
  if(!link.key) return null;
  return [...document.querySelectorAll('#feed .feed-media-stable video[data-feed-video]')].find(v=>
    v.closest('.feed-media-stable')?.dataset.feedMediaKey===link.key
  )||null;
}
function syncLinkedFeedVideoTime(link,time){
  if(!link||!Number.isFinite(time)) return;
  link.time=Math.max(0,time);
  const target=linkedFeedVideo(link); if(!target) return;
  const apply=()=>{
    const dur=Number.isFinite(target.duration)&&target.duration>0?target.duration:0;
    const next=dur?Math.min(link.time,Math.max(0,dur-.04)):link.time;
    try{ if(Math.abs((Number(target.currentTime)||0)-next)>.04) target.currentTime=next; }catch(_){}
  };
  if(target.readyState>=1) apply();
  else target.addEventListener('loadedmetadata',apply,{once:true});
}

function initIrohaVideoViewer(s,videoLink=null){
  const v=s.querySelector('.media-viewer-video');
  const toggle=s.querySelector('.media-video-toggle');
  const sound=s.querySelector('.media-video-sound-toggle');
  const center=s.querySelector('.media-video-center');
  const range=s.querySelector('.media-video-range');
  if(!v||!toggle||!center||!range) return;

  let scrubbing=false, linkedPlaybackReady=!videoLink;
  const paint=()=>{
    const dur=Number.isFinite(v.duration)?v.duration:0;
    const cur=Number.isFinite(v.currentTime)?v.currentTime:0;
    const p=dur?Math.max(0,Math.min(1,cur/dur)):0;
    if(!scrubbing) range.value=String(Math.round(p*1000));
    range.style.setProperty('--video-progress',`${(p*100).toFixed(3)}%`);
    const playing=!v.paused&&!v.ended;
    toggle.innerHTML=playing?I.pause:I.play;
    toggle.setAttribute('aria-label',playing?'一時停止':'再生');
    if(sound){
      sound.innerHTML=v.muted?I.volumeOff:I.volume;
      sound.setAttribute('aria-label',v.muted?'音声をオン':'音声をオフ');
      sound.setAttribute('aria-pressed',v.muted?'true':'false');
    }
    center.innerHTML=I.play;
    center.classList.toggle('playing',playing);
  };
  const syncLink=()=>{
    if(videoLink&&linkedPlaybackReady) syncLinkedFeedVideoTime(videoLink,Number.isFinite(v.currentTime)?v.currentTime:0);
  };
  s._syncLinkedFeedVideo=syncLink;
  const togglePlay=()=>{
    if(v.paused||v.ended){
      v.play().catch(()=>toast('動画を再生できませんでした'));
    }else v.pause();
  };
  const toggleSound=()=>{ v.muted=!v.muted; paint(); };

  /* Detail sound remains independent from feed sound and starts audible. */
  v.muted=false;
  toggle.onclick=e=>{ e.preventDefault(); e.stopPropagation(); haptic(5); togglePlay(); };
  if(sound) sound.onclick=e=>{ e.preventDefault(); e.stopPropagation(); haptic(4); toggleSound(); };
  v.addEventListener('click',e=>{
    e.preventDefault(); e.stopPropagation(); haptic(4); toggleSound();
  });

  let scrubPointer=null;
  const applyRangeValue=()=>{
    const dur=Number.isFinite(v.duration)?v.duration:0;
    const pos=Math.max(0,Math.min(1,Number(range.value)/1000));
    const next=dur>0?pos*dur:0;
    range.style.setProperty('--video-progress',`${(pos*100).toFixed(3)}%`);
    if(dur>0) v.currentTime=next;
    if(videoLink){ linkedPlaybackReady=true; syncLinkedFeedVideoTime(videoLink,next); }
  };
  const seekFromClientX=x=>{
    const r=range.getBoundingClientRect();
    if(r.width<=0) return;
    const pos=Math.max(0,Math.min(1,(x-r.left)/r.width));
    range.value=String(Math.round(pos*1000));
    applyRangeValue();
  };
  const beginScrub=e=>{
    if(e.pointerType==='mouse'&&e.button!==0) return;
    scrubbing=true; scrubPointer=e.pointerId;
    e.preventDefault(); e.stopPropagation();
    try{ range.setPointerCapture(e.pointerId); }catch(_){}
    seekFromClientX(e.clientX);
  };
  const moveScrub=e=>{
    if(!scrubbing||e.pointerId!==scrubPointer) return;
    e.preventDefault(); e.stopPropagation();
    seekFromClientX(e.clientX);
  };
  const endScrub=e=>{
    if(!scrubbing||(scrubPointer!==null&&e.pointerId!==undefined&&e.pointerId!==scrubPointer)) return;
    e.preventDefault&&e.preventDefault(); e.stopPropagation&&e.stopPropagation();
    if(Number.isFinite(e.clientX)) seekFromClientX(e.clientX);
    try{ if(scrubPointer!==null&&range.hasPointerCapture(scrubPointer)) range.releasePointerCapture(scrubPointer); }catch(_){}
    scrubPointer=null; scrubbing=false; paint(); syncLink();
  };
  range.addEventListener('pointerdown',beginScrub,{passive:false});
  range.addEventListener('pointermove',moveScrub,{passive:false});
  range.addEventListener('pointerup',endScrub,{passive:false});
  range.addEventListener('pointercancel',endScrub,{passive:false});
  range.addEventListener('input',e=>{ e.stopPropagation(); if(!scrubbing) applyRangeValue(); });
  range.addEventListener('change',e=>{ e.stopPropagation(); applyRangeValue(); });

  ['loadedmetadata','durationchange','timeupdate','play','pause','ended','volumechange'].forEach(ev=>v.addEventListener(ev,paint));
  v.addEventListener('timeupdate',syncLink);
  v.addEventListener('seeked',syncLink);
  paint();

  const beginLinkedPlayback=()=>{
    if(!v.isConnected) return;
    const start=videoLink&&Number.isFinite(videoLink.time)?Math.max(0,videoLink.time):0;
    const play=()=>{
      if(!v.isConnected) return;
      linkedPlaybackReady=true;
      syncLink();
      v.play().catch(()=>{});
    };
    if(start>.03&&Number.isFinite(v.duration)&&v.duration>0){
      const next=Math.min(start,Math.max(0,v.duration-.04));
      try{ v.currentTime=next; }catch(_){}
      if(v.seeking){
        let done=false;
        const go=()=>{ if(done)return; done=true; play(); };
        v.addEventListener('seeked',go,{once:true});
        setTimeout(go,500);
      }else play();
    }else play();
  };
  if(v.readyState>=1) requestAnimationFrame(beginLinkedPlayback);
  else v.addEventListener('loadedmetadata',()=>requestAnimationFrame(beginLinkedPlayback),{once:true});

  /* pop() can also happen by edge swipe. Sync the exact frame back to the feed
     before pausing, then let feed autoplay resume from that same position. */
  const mo=new MutationObserver(()=>{
    if(s.classList.contains('out')){
      syncLink();
      v.pause();
      setTimeout(refreshFeedVideoAutoplay,460);
    }
    if(!s.isConnected) mo.disconnect();
  });
  mo.observe(s,{attributes:true,attributeFilter:['class']});
}

function viewerIntrinsicRatio(media,fallback=1){
  if(!media) return fallback>0?fallback:1;
  const w=media.tagName==='VIDEO'?media.videoWidth:media.naturalWidth;
  const h=media.tagName==='VIDEO'?media.videoHeight:media.naturalHeight;
  const r=Number(w)/Number(h);
  return Number.isFinite(r)&&r>0?r:(fallback>0?fallback:1);
}
function layoutMediaViewerCard(stage,card,media,fallbackRatio=1){
  if(!stage||!card) return;
  const cs=getComputedStyle(stage);
  const px=(v)=>Number.parseFloat(v)||0;
  const maxW=Math.max(1,stage.clientWidth-px(cs.paddingLeft)-px(cs.paddingRight));
  const maxH=Math.max(1,stage.clientHeight-px(cs.paddingTop)-px(cs.paddingBottom));
  const ratio=viewerIntrinsicRatio(media,fallbackRatio);
  let w=maxW, h=w/ratio;
  if(h>maxH){ h=maxH; w=h*ratio; }
  card.style.width=`${Math.max(1,Math.round(w*100)/100)}px`;
  card.style.height=`${Math.max(1,Math.round(h*100)/100)}px`;
}
function animateMediaViewerFromOrigin(s,card,originEl){
  if(!s||!card||!originEl||!originEl.isConnected||!card.animate) return;
  const from=originEl.getBoundingClientRect();
  const to=card.getBoundingClientRect();
  if(from.width<2||from.height<2||to.width<2||to.height<2) return;
  const tx=from.left-to.left, ty=from.top-to.top;
  const sx=from.width/to.width, sy=from.height/to.height;
  const radius=Math.min(22,Math.max(0,parseFloat(getComputedStyle(originEl.closest('.media')||originEl).borderRadius)||12));
  const a=card.animate([
    {transform:`translate3d(${tx}px,${ty}px,0) scale(${sx},${sy})`,borderRadius:`${radius}px`},
    {transform:'translate3d(0,0,0) scale(1,1)',borderRadius:getComputedStyle(card).borderRadius}
  ],{duration:420,easing:'cubic-bezier(.2,.78,.2,1)',fill:'both'});
  a.onfinish=()=>{ try{a.cancel();}catch(_){} };
}
function initIrohaImageViewerGestures(s,stage,card,wrap,onDismiss,galleryHooks=null){
  if(!s||!stage||!card||!wrap) return null;
  const MAX=4, MIN=1;
  let scale=1, tx=0, ty=0;
  let sx=0, sy=0, sScale=1, sTx=0, sTy=0;
  const pts=new Map();
  let mode=null;
  let startDist=0, startMidX=0, startMidY=0, moved=false, lastTap=0, lastDx=0;
  const nav=s.querySelector('.media-viewer-nav');
  const back=s.querySelector('.media-viewer-backdrop');

  const apply=(dur=0)=>{
    wrap.classList.toggle('settling',dur>0);
    wrap.style.transform=`translate3d(${tx.toFixed(2)}px,${ty.toFixed(2)}px,0) scale(${scale.toFixed(4)})`;
  };
  const bounds=()=>{
    const st=stage.getBoundingClientRect();
    const w=wrap.offsetWidth*scale, h=wrap.offsetHeight*scale;
    return {
      x:Math.max(0,(w-st.width)/2),
      y:Math.max(0,(h-st.height)/2)
    };
  };
  const clamp=()=>{
    const b=bounds();
    tx=Math.min(b.x,Math.max(-b.x,tx));
    ty=Math.min(b.y,Math.max(-b.y,ty));
  };
  const dist=()=>{
    const [a,b]=[...pts.values()];
    return a&&b?Math.hypot(a.x-b.x,a.y-b.y):0;
  };
  const mid=()=>{
    const [a,b]=[...pts.values()];
    return a&&b?{x:(a.x+b.x)/2,y:(a.y+b.y)/2}:{x:0,y:0};
  };
  const chrome=(show)=>{
    if(!nav) return;
    nav.style.transition=show?'opacity 200ms ease':'none';
    nav.style.opacity=show?'1':'0';
    nav.style.pointerEvents=show?'':'none';
  };
  const reset=(animate=false)=>{
    scale=1; tx=0; ty=0; mode=null; lastDx=0;
    wrap.style.opacity='1';
    wrap.style.transition='';
    card.classList.remove('image-gesture-dismissing');
    s.classList.remove('image-zoomed','image-zooming');
    if(galleryHooks&&typeof galleryHooks.cancel==='function') galleryHooks.cancel(animate);
    if(back){
      back.style.transition=animate?'opacity 260ms ease':'none';
      back.style.opacity='1';
      if(animate) setTimeout(()=>{ if(back.isConnected) back.style.transition=''; },280);
    }
    chrome(true);
    apply(animate?320:0);
  };

  const down=e=>{
    if(e.pointerType==='mouse'&&e.button!==0) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    wrap.classList.remove('settling');

    if(pts.size===1){
      sx=e.clientX; sy=e.clientY; sTx=tx; sTy=ty; moved=false; lastDx=0;
      mode=scale>1.01?'pan':(galleryHooks&&galleryHooks.enabled&&galleryHooks.enabled()?'decide':'dismiss');
    }else if(pts.size===2){
      mode='pinch';
      startDist=dist()||1; sScale=scale;
      const m=mid(); startMidX=m.x; startMidY=m.y; sTx=tx; sTy=ty;
      card.classList.remove('image-gesture-dismissing');
      s.classList.add('image-zooming');
      chrome(false);
    }
    captureViewerPointer(wrap,e.pointerId);
  };

  const move=e=>{
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});

    if(mode==='pinch'&&pts.size>=2){
      const m=mid();
      scale=Math.min(MAX,Math.max(.6,sScale*(dist()/startDist)));
      /* 5.8.7: keep the point between the fingers under the fingers. */
      tx=sTx+(m.x-startMidX);
      ty=sTy+(m.y-startMidY);
      /* 5.8.7: do not clamp while the fingers are still pinching. */
      apply(0); e.preventDefault(); return;
    }

    const dx=e.clientX-sx, dy=e.clientY-sy;
    lastDx=dx;
    if(!moved&&Math.hypot(dx,dy)>6) moved=true;

    if(mode==='decide'&&moved){
      /* Horizontal intent belongs to the gallery; downward intent belongs to
         dismiss. Waiting for the axis prevents a diagonal finger from making
         both gestures twitch at once. */
      if(Math.abs(dx)>Math.abs(dy)*1.08){
        mode='gallery';
        card.classList.remove('image-gesture-dismissing');
        chrome(false);
      }else if(dy>0 || Math.abs(dy)>=Math.abs(dx)){
        mode='dismiss';
      }
    }

    if(mode==='gallery'){
      if(galleryHooks&&typeof galleryHooks.move==='function') galleryHooks.move(dx);
      e.preventDefault(); return;
    }

    if(mode==='pan'){
      tx=sTx+dx; ty=sTy+dy;
      clamp(); apply(0); e.preventDefault(); return;
    }

    if(mode==='dismiss'){
      if(!moved) return;
      if(dy<=0&&Math.abs(dx)>Math.abs(dy)) return;
      const d=Math.max(0,dy);
      /* Reference motion: the photo stays solid while the dim layer beneath it
         gives the feed back gradually. Keep the fade deliberately softer than
         the movement; the final 160 ms does the fast dissolve seen in the video. */
      const k=Math.min(1,d/320);
      scale=1-k*.22;
      tx=dx*.6;
      ty=d;
      if(back){
        back.style.transition='none';
        back.style.opacity=String(Math.max(.25,1-k*.75));
      }
      card.classList.add('image-gesture-dismissing');
      chrome(false);
      apply(0); e.preventDefault();
    }
  };

  const up=e=>{
    if(!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId); uncaptureViewerPointer(wrap,e.pointerId);

    if(mode==='pinch'){
      if(pts.size===1){
        /* 5.8.7: one finger lifted, carry on from the current position. */
        const p=[...pts.values()][0];
        sx=p.x; sy=p.y; sTx=tx; sTy=ty;
        mode=scale>1.01?'pan':'dismiss';
        return;
      }
      s.classList.remove('image-zooming');
      chrome(true);
      if(scale<=1.01) reset(true);
      else{
        scale=Math.min(MAX,scale);
        clamp(); apply(320);
        s.classList.add('image-zoomed');
      }
      return;
    }

    if(mode==='gallery'){
      const handled=galleryHooks&&typeof galleryHooks.end==='function'
        ? galleryHooks.end(lastDx)
        : false;
      mode=null; lastDx=0;
      if(!handled) chrome(true);
      return;
    }

    if(mode==='dismiss'){
      if(ty>150){
        /* Keep the original v7.6 dismiss motion exactly: continue downward
           from the released position and shrink slightly. Only the opacity is
           added here so the image fades away while following the same path. */
        if(back){
          back.style.transition='opacity 140ms ease-out';
          back.style.opacity='0';
        }
        wrap.classList.add('settling');
        wrap.style.transition='transform 320ms cubic-bezier(.22,1,.36,1), opacity 140ms ease-out';
        wrap.style.opacity='0';
        wrap.style.transform=`translate3d(${tx}px,${ty+220}px,0) scale(.86)`;
        setTimeout(()=>{ if(typeof onDismiss==='function') onDismiss(); },140);
        return;
      }
      reset(true);
      return;
    }

    if(mode==='pan'){
      clamp(); apply(220);
      s.classList.toggle('image-zoomed',scale>1.01);
    }

    /* 5.8.7: double tap toggles fit <-> 2.4x around the tap position. */
    if(!moved&&pts.size===0){
      const now=Date.now();
      if(now-lastTap<300){
        lastTap=0;
        if(scale>1.01) reset(true);
        else{
          const st=stage.getBoundingClientRect();
          scale=2.4;
          tx=(st.width/2-(e.clientX-st.left))*(scale-1)/scale;
          ty=(st.height/2-(e.clientY-st.top))*(scale-1)/scale;
          clamp(); apply(320);
          s.classList.add('image-zoomed');
        }
      }else lastTap=now;
    }
    if(pts.size===0) mode=null;
  };

  wrap.addEventListener('pointerdown',down);
  wrap.addEventListener('pointermove',move,{passive:false});
  wrap.addEventListener('pointerup',up);
  wrap.addEventListener('pointercancel',e=>{
    pts.delete(e.pointerId); uncaptureViewerPointer(wrap,e.pointerId);
    if(!pts.size) reset(true);
  });

  return {
    reset,
    zoomed:()=>scale>1.01,
    active:()=>mode==='pinch'||mode==='pan'||mode==='dismiss'||mode==='gallery'||mode==='decide'
  };
}

/* Pointer capture survives an element going invisible, so release it by hand
   before a viewer starts leaving. */
function releaseViewerPointers(scope){
  if(!scope) return;
  scope.querySelectorAll('[data-captured]').forEach(node=>{
    String(node.dataset.captured||'').split(',').filter(Boolean).forEach(id=>{
      try{ node.releasePointerCapture(Number(id)); }catch(_){}
    });
    delete node.dataset.captured;
  });
}

/* Capture, remembering the id so it can always be given back. */
function captureViewerPointer(node,id){
  try{ node.setPointerCapture(id); }catch(_){ return; }
  const have=String(node.dataset.captured||'').split(',').filter(Boolean);
  if(!have.includes(String(id))) have.push(String(id));
  node.dataset.captured=have.join(',');
}
function uncaptureViewerPointer(node,id){
  const have=String(node.dataset.captured||'').split(',').filter(x=>x&&x!==String(id));
  if(have.length) node.dataset.captured=have.join(','); else delete node.dataset.captured;
}

function mediaViewerImageGallery(originEl){
  if(!originEl || !originEl.isConnected || originEl.tagName!=='IMG') return null;
  const strip=originEl.closest('.mstrip');
  if(!strip) return null;
  const nodes=[...strip.querySelectorAll('.mstrip-item .media:not(.blurred) img')];
  const items=nodes.map(node=>({
    node,
    src:safeAssetUrl(node.currentSrc||node.src,{allowLocal:true})
  })).filter(x=>x.src);
  const index=items.findIndex(x=>x.node===originEl);
  return items.length>1&&index>=0 ? {items,index} : null;
}

function initMediaViewerImageGallery(s,stage,card,media,gallery,onChange){
  if(!gallery||gallery.items.length<2) return null;
  let index=gallery.index;
  let neighbour=null, neighbourMedia=null, neighbourIndex=-1;
  let lastDx=0, animating=false, settleTimer=0;
  let lastRawDx=0, lastMoveAt=0, swipeVelocity=0;
  const nav=s.querySelector('.media-viewer-nav');
  const title=s.querySelector('.media-viewer-nav .ttl');

  const updateTitle=()=>{ if(title) title.textContent=`写真 ${index+1}/${gallery.items.length}`; };
  updateTitle();

  const stageMetrics=()=>{
    const cs=getComputedStyle(stage), px=v=>Number.parseFloat(v)||0;
    const pl=px(cs.paddingLeft), pr=px(cs.paddingRight), pt=px(cs.paddingTop), pb=px(cs.paddingBottom);
    return {pl,pr,pt,pb,w:Math.max(1,stage.clientWidth-pl-pr),h:Math.max(1,stage.clientHeight-pt-pb)};
  };
  const travel=()=>Math.max(280,stage.clientWidth+18);
  const targetForDx=dx=>dx<0?index+1:index-1;

  const removeNeighbour=()=>{
    if(neighbour){ try{neighbour.remove();}catch(_){} }
    neighbour=null; neighbourMedia=null; neighbourIndex=-1;
  };

  const placeNeighbour=()=>{
    if(!neighbour||!neighbourMedia) return;
    const item=gallery.items[neighbourIndex];
    const r=item?.node?.getBoundingClientRect?.();
    const fallback=r&&r.height>0?r.width/r.height:1;
    layoutMediaViewerCard(stage,neighbour,neighbourMedia,fallback);
    const m=stageMetrics();
    const w=neighbour.offsetWidth||1, h=neighbour.offsetHeight||1;
    neighbour.style.left=`${m.pl+(m.w-w)/2}px`;
    neighbour.style.top=`${m.pt+(m.h-h)/2}px`;
  };

  const ensureNeighbour=target=>{
    if(target<0||target>=gallery.items.length) return null;
    if(neighbour&&neighbourIndex===target) return neighbour;
    removeNeighbour();
    neighbourIndex=target;
    const item=gallery.items[target];
    neighbour=el(`<div class="media-viewer-card is-image media-viewer-gallery-neighbor">
      <div class="media-viewer-image-zoom"><img class="media-viewer-image" src="${escAttr(item.src)}" alt="隣の画像" decoding="async"></div>
    </div>`);
    neighbourMedia=neighbour.querySelector('img');
    stage.appendChild(neighbour);
    placeNeighbour();
    if(!(neighbourMedia.complete&&neighbourMedia.naturalWidth>0)) neighbourMedia.addEventListener('load',placeNeighbour,{once:true});
    return neighbour;
  };

  const move=rawDx=>{
    if(animating) return;
    const now=performance.now();
    if(lastMoveAt){
      const dt=Math.max(4,now-lastMoveAt);
      const instant=(rawDx-lastRawDx)/dt;
      swipeVelocity=swipeVelocity*.64+instant*.36;
    }
    lastRawDx=rawDx; lastMoveAt=now;
    let dx=rawDx;
    const target=targetForDx(dx);
    const valid=target>=0&&target<gallery.items.length;
    if(!valid) dx*=.28;
    lastDx=dx;
    card.classList.add('media-viewer-gallery-sliding');
    card.style.transition='none';
    card.style.transform=`translate3d(${dx}px,0,0)`;
    if(!valid){ removeNeighbour(); return; }
    const n=ensureNeighbour(target);
    if(!n) return;
    const start=target>index?travel():-travel();
    n.style.transition='none';
    n.style.transform=`translate3d(${start+dx}px,0,0)`;
  };

  const settleBack=()=>{
    animating=true;
    const dur=380;
    const ease='cubic-bezier(.18,.72,.16,1)';
    card.style.transition=`transform ${dur}ms ${ease}`;
    card.style.transform='translate3d(0,0,0)';
    if(neighbour){
      const start=neighbourIndex>index?travel():-travel();
      neighbour.style.transition=`transform ${dur}ms ${ease}`;
      neighbour.style.transform=`translate3d(${start}px,0,0)`;
    }
    clearTimeout(settleTimer);
    settleTimer=setTimeout(()=>{
      animating=false; lastDx=0; lastRawDx=0; lastMoveAt=0; swipeVelocity=0; removeNeighbour();
      card.classList.remove('media-viewer-gallery-sliding');
      card.style.transition=''; card.style.transform='';
      if(nav){ nav.style.transition='opacity 180ms ease'; nav.style.opacity='1'; nav.style.pointerEvents=''; }
    },dur+18);
  };

  const commit=target=>{
    const n=ensureNeighbour(target);
    if(!n) return settleBack(),false;
    animating=true;
    const dir=target>index?1:-1;
    const dist=travel();
    const remaining=Math.max(0,dist-Math.min(dist,Math.abs(lastDx)));
    const speed=Math.abs(swipeVelocity);
    const dur=Math.round(Math.max(330,Math.min(500,440-speed*70+(remaining/dist)*55)));
    const ease='cubic-bezier(.18,.72,.16,1)';
    card.style.transition=`transform ${dur}ms ${ease}`;
    card.style.transform=`translate3d(${-dir*dist}px,0,0)`;
    n.style.transition=`transform ${dur}ms ${ease}`;
    n.style.transform='translate3d(0,0,0)';

    clearTimeout(settleTimer);
    settleTimer=setTimeout(()=>{
      const item=gallery.items[target];
      const ratio=viewerIntrinsicRatio(neighbourMedia,1);
      index=target; updateTitle();
      card.style.transition='none';
      card.style.transform='translate3d(0,0,0)';
      card.style.opacity='0';
      media.src=item.src;
      layoutMediaViewerCard(stage,card,media,ratio);
      if(typeof onChange==='function') onChange(item,index,ratio);

      let revealed=false;
      const reveal=()=>{
        if(revealed) return; revealed=true;
        layoutMediaViewerCard(stage,card,media,ratio);
        requestAnimationFrame(()=>{
          card.style.opacity='1';
          removeNeighbour();
          animating=false; lastDx=0; lastRawDx=0; lastMoveAt=0; swipeVelocity=0;
          card.classList.remove('media-viewer-gallery-sliding');
          card.style.transition=''; card.style.transform='';
          if(nav){ nav.style.transition='opacity 180ms ease'; nav.style.opacity='1'; nav.style.pointerEvents=''; }
        });
      };
      if(media.complete&&media.naturalWidth>0) reveal();
      else{
        media.addEventListener('load',reveal,{once:true});
        setTimeout(reveal,420);
      }
    },dur+8);
    return true;
  };

  const end=rawDx=>{
    if(animating) return true;
    const dx=Number.isFinite(rawDx)?rawDx:lastDx;
    const target=targetForDx(dx);
    const threshold=Math.min(110,Math.max(64,stage.clientWidth*.18));
    if(target>=0&&target<gallery.items.length&&Math.abs(dx)>=threshold) return commit(target);
    settleBack();
    return true;
  };

  const cancel=(animate=true)=>{
    if(animating) return;
    if(Math.abs(lastDx)<.5&&!neighbour) return;
    if(animate) settleBack();
    else{
      clearTimeout(settleTimer); removeNeighbour(); lastDx=0; lastRawDx=0; lastMoveAt=0; swipeVelocity=0;
      card.classList.remove('media-viewer-gallery-sliding');
      card.style.transition=''; card.style.transform='';
    }
  };

  return {enabled:()=>!animating&&gallery.items.length>1,move,end,cancel,index:()=>index};
}

function openMediaViewer(src,kind,originEl=null){
  if(document.querySelector('.media-viewer-screen:not(.is-closing)')) return;
  const safeSrc=safeAssetUrl(src,{allowLocal:true});
  kind=kind==='video'?'video':'image';
  const gallery=kind==='image'?mediaViewerImageGallery(originEl):null;
  if(!safeSrc) return;
  const videoLink=kind==='video'?feedVideoViewerLink(originEl):null;
  if(kind==='video') pauseFeedVideoAutoplay();

  let activeOriginEl=originEl;
  const originRect=originEl&&originEl.isConnected?originEl.getBoundingClientRect():null;
  let fallbackRatio=originRect&&originRect.height>0?originRect.width/originRect.height:(kind==='video'?9/16:1);
  const body=kind==='video'
    ? `<div class="media-viewer-stage is-video">
         <div class="media-viewer-card is-video">
           <video class="media-viewer-video" src="${escAttr(safeSrc)}" playsinline preload="metadata"></video>
           <div class="media-video-center" aria-hidden="true">${I.play}</div>
         </div>
         <div class="media-video-controls" data-video-controls>
           <button class="media-video-toggle" type="button" aria-label="再生">${I.play}</button>
           <input class="media-video-range" type="range" min="0" max="1000" step="1" value="0" aria-label="再生位置">
           <button class="media-video-sound-toggle" type="button" aria-label="音声をオフ" aria-pressed="false">${I.volume}</button>
         </div>
       </div>`
    : `<div class="media-viewer-stage">
         <div class="media-viewer-card is-image">
           <div class="media-viewer-image-zoom">
             <img class="media-viewer-image" src="${escAttr(safeSrc)}" alt="拡大画像" decoding="async">
           </div>
         </div>
       </div>`;

  const s=el(`<section class="screen media-viewer-screen" data-media-viewer="${kind}">
    <div class="media-viewer-backdrop" aria-hidden="true"></div>
    ${body}
    <header class="navbar media-viewer-nav">
      <div class="side"><button class="iconbtn media-viewer-close" type="button" aria-label="閉じる">${I.close}</button></div>
      <div class="ttl">${kind==='video'?'動画':'写真'}</div>
      <div class="side"><button class="iconbtn media-viewer-save is-preparing" type="button" aria-label="保存">${I.save}</button></div>
    </header>
  </section>`);

  const stage=s.querySelector('.media-viewer-stage');
  const card=s.querySelector('.media-viewer-card');
  const media=s.querySelector(kind==='video'?'.media-viewer-video':'.media-viewer-image');
  const imageZoom=s.querySelector('.media-viewer-image-zoom');
  let imageGestures=null, imageGallery=null;
  let closing=false, dragY=0, dragAxis='', dragStartX=0, dragStartY=0;

  const fit=()=>layoutMediaViewerCard(stage,card,media,fallbackRatio);
  const finishClose=()=>{
    if(!s.isConnected) return;
    pop();
    /* Belt and braces: if the leave transition never reports back, the inert
       layer still goes away rather than lingering over the page. */
    setTimeout(()=>{ if(s.isConnected) s.remove(); }, 700);
  };
  const close=({drag=false,imageGesture=false}={})=>{
    if(closing) return;
    closing=true;
    const v=s.querySelector('.media-viewer-video');
    if(v){ if(typeof s._syncLinkedFeedVideo==='function') s._syncLinkedFeedVideo(); v.pause(); }
    if(imageGesture){
      /* The gesture layer has already performed the downward exit + fade.
         Do not add another transform here; just remove the viewer. */
      haptic(5);
      finishClose();
      return;
    }
    if(imageGestures) imageGestures.reset(true);
    haptic(5);
    /* Let go of anything the gesture layer still holds. A captured pointer
       keeps delivering to the old element even after it stops being visible,
       which is what left the page unable to scroll for a moment. */
    releaseViewerPointers(s);
    s.classList.add('is-closing');
    s.style.pointerEvents='none';
    const nav=s.querySelector('.media-viewer-nav');
    if(nav) nav.style.opacity='0';

    if(card&&card.animate){
      if(drag){
        const from=card.style.transform||'translate3d(0,0,0) scale(1)';
        card.animate([
          {transform:from,opacity:1},
          {transform:`translate3d(0,${Math.max(window.innerHeight*.34,dragY+120)}px,0) scale(.90)`,opacity:.15}
        ],{duration:220,easing:'cubic-bezier(.3,.7,.2,1)',fill:'forwards'});
      }else if(activeOriginEl&&activeOriginEl.isConnected){
        const from=card.getBoundingClientRect();
        const to=activeOriginEl.getBoundingClientRect();
        if(from.width>1&&from.height>1&&to.width>1&&to.height>1){
          const tx=to.left-from.left, ty=to.top-from.top;
          const sx=to.width/from.width, sy=to.height/from.height;
          card.animate([
            {transform:'translate3d(0,0,0) scale(1,1)',opacity:1},
            {transform:`translate3d(${tx}px,${ty}px,0) scale(${sx},${sy})`,opacity:.92}
          ],{duration:300,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'});
        }else{
          card.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.94)',opacity:0}],{duration:220,fill:'forwards'});
        }
      }else{
        card.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.94)',opacity:0}],{duration:220,easing:'ease',fill:'forwards'});
      }
    }
    if(s.animate) s.animate([{opacity:1},{opacity:0}],{duration:drag?220:300,easing:'ease',fill:'forwards'});
    setTimeout(finishClose,drag?215:295);
  };
  s.querySelector('.media-viewer-close').onclick=()=>close();

  const save=s.querySelector('.media-viewer-save');
  let currentViewerSrc=safeSrc;
  let prep=null;
  let prepToken=0;
  const prepareCurrentSave=()=>{
    const token=++prepToken;
    save.classList.add('is-preparing');
    save.classList.remove('is-error');
    prep=prepareViewerMediaFile(currentViewerSrc,kind);
    prep.then(()=>{
      if(token!==prepToken||!save.isConnected) return;
      save.classList.remove('is-preparing');
    }).catch(err=>{
      console.warn('[iroha media prepare]',err);
      if(token!==prepToken||!save.isConnected) return;
      save.classList.remove('is-preparing');
      save.classList.add('is-error');
    });
  };
  prepareCurrentSave();
  save.onclick=e=>{
    e.preventDefault();e.stopPropagation();haptic(7);
    if(prep) saveViewerMedia(save,prep,kind);
  };

  /* Pull the floating media card down to dismiss it. Controls keep their own gestures. */
  card.addEventListener('touchstart',e=>{
    if(kind==='image') return;
    if(e.touches.length!==1||e.target.closest('button,input,[data-video-controls]')||(imageGestures&&imageGestures.zoomed())) return;
    const t=e.touches[0];
    dragStartX=t.clientX; dragStartY=t.clientY; dragY=0; dragAxis='';
  },{passive:true});
  card.addEventListener('touchmove',e=>{
    if(kind==='image') return;
    if(closing||e.touches.length!==1||(!dragStartX&&!dragStartY)||(imageGestures&&imageGestures.active())) return;
    const t=e.touches[0], dx=t.clientX-dragStartX, dy=t.clientY-dragStartY;
    if(!dragAxis){
      if(Math.max(Math.abs(dx),Math.abs(dy))<6) return;
      dragAxis=Math.abs(dy)>Math.abs(dx)?'y':'x';
    }
    if(dragAxis!=='y'||dy<=0) return;
    e.preventDefault();
    dragY=dy;
    card.classList.add('is-dragging');
    const scale=Math.max(.92,1-Math.min(.08,dy/1400));
    card.style.transition='none';
    card.style.transform=`translate3d(0,${dy}px,0) scale(${scale})`;
    const nav=s.querySelector('.media-viewer-nav');
    if(nav) nav.style.opacity=String(Math.max(0,1-dy/150));
  },{passive:false});
  const endDrag=()=>{
    if(kind==='image') return;
    if(!dragAxis){ dragStartX=dragStartY=0; return; }
    if(dragAxis==='y'&&dragY>105){ close({drag:true}); return; }
    card.classList.remove('is-dragging');
    card.style.transition='transform 360ms var(--spring)';
    card.style.transform='translate3d(0,0,0) scale(1)';
    const nav=s.querySelector('.media-viewer-nav');
    if(nav){ nav.style.transition='opacity 220ms ease'; nav.style.opacity='1'; }
    setTimeout(()=>{ if(card.isConnected){card.style.transition='';} },380);
    dragStartX=dragStartY=dragY=0; dragAxis='';
  };
  card.addEventListener('touchend',endDrag,{passive:true});
  card.addEventListener('touchcancel',endDrag,{passive:true});

  if(kind==='video') initIrohaVideoViewer(s,videoLink);
  else if(imageZoom){
    if(gallery){
      imageGallery=initMediaViewerImageGallery(s,stage,card,media,gallery,(item,_index,ratio)=>{
        activeOriginEl=item.node;
        currentViewerSrc=item.src;
        fallbackRatio=ratio>0?ratio:fallbackRatio;
        prepareCurrentSave();
      });
    }
    imageGestures=initIrohaImageViewerGestures(
      s,stage,card,imageZoom,()=>close({imageGesture:true}),imageGallery
    );
  }
  push(s);
  fit();
  requestAnimationFrame(()=>requestAnimationFrame(()=>animateMediaViewerFromOrigin(s,card,originEl)));

  const readyEvent=kind==='video'?'loadedmetadata':'load';
  const ready=kind==='video'
    ? (media.readyState>=1&&media.videoWidth>0)
    : (media.complete&&media.naturalWidth>0);
  const refit=()=>{
    const before=card.getBoundingClientRect();
    fit();
    const after=card.getBoundingClientRect();
    if(before.width&&after.width&&Math.abs(before.width-after.width)>1&&card.animate){
      const sx=before.width/after.width, sy=before.height/after.height;
      card.animate([{transform:`scale(${sx},${sy})`},{transform:'scale(1,1)'}],{duration:260,easing:'cubic-bezier(.2,.7,.2,1)'});
    }
  };
  if(ready) refit(); else media.addEventListener(readyEvent,refit,{once:true});
  window.addEventListener('resize',fit,{once:true});
}

function revealMediaByAttr(keyAttr){
  let key='';
  try{ key=decodeURIComponent(keyAttr||''); }catch(_){ key=keyAttr||''; }
  if(key) REVEALED_MEDIA.add(key);
  $$('[data-media-key]').forEach(node=>{
    if(node.dataset.mediaKey!==keyAttr) return;
    node.classList.remove('blurred');
    node.removeAttribute('data-reveal');
    const v=node.querySelector('video'); if(v) v.controls=false;
    const veil=node.querySelector('.veil'); if(veil) veil.remove();
    if(!node.querySelector('[data-restore-filter]')){
      node.insertAdjacentHTML('beforeend',`<button class="media-filter-restore" data-restore-filter type="button">${I.eyeoff}<span>フィルターを戻す</span></button>`);
    }
  });
  refreshFeedVideoAutoplay();
}

function restoreMediaFilterByAttr(keyAttr){
  let key='';
  try{ key=decodeURIComponent(keyAttr||''); }catch(_){ key=keyAttr||''; }
  if(key) REVEALED_MEDIA.delete(key);
  if(S.media!=='safety') return;
  $$('[data-media-key]').forEach(node=>{
    if(node.dataset.mediaKey!==keyAttr) return;
    node.classList.add('blurred');
    node.setAttribute('data-reveal','');
    const v=node.querySelector('video');
    if(v){
      v.controls=false;
      try{v.pause()}catch(_){}
      if(FEED_VIDEO_ACTIVE===v) FEED_VIDEO_ACTIVE=null;
    }
    const restore=node.querySelector('[data-restore-filter]'); if(restore) restore.remove();
    if(!node.querySelector('.veil')){
      node.insertAdjacentHTML('beforeend',`<div class="veil">${I.eye}<span>タップして表示<small>セーフティ表示がオンです</small></span></div>`);
    }
  });
  refreshFeedVideoAutoplay();
}

function handleMediaSafetyClick(e){
  const target=e.target instanceof Element ? e.target : null;
  if(!target) return false;

  const restore=target.closest('[data-restore-filter]');
  if(restore){
    const media=restore.closest('[data-media-key]');
    if(!media) return false;
    e.preventDefault(); e.stopPropagation();
    haptic(5);
    restoreMediaFilterByAttr(media.dataset.mediaKey);
    return true;
  }

  /* The normal target is the veil. target.closest('[data-reveal]') also
     covers browsers that retarget a native video tap to the <video> itself. */
  const rev=target.closest('[data-reveal]');
  if(rev){
    e.preventDefault(); e.stopPropagation();
    haptic(6);
    revealMediaByAttr(rev.dataset.mediaKey||'');
    return true;
  }
  return false;
}

function audioHTML(m){

  return `<div class="aplayer" data-audio="${escAttr(safeSrc)}">
    <button class="apbtn">${I.play}</button>
    <div class="apwave">${bars}</div>
    <span class="aptime">${fmtDur(m.dur||0)}</span>
  </div>`;
}
  
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
}

/* Native long-press menus can emit a synthetic click when they close. Suppress
   only that follow-up click so Save-to-Photos never unexpectedly opens/plays media. */
let MEDIA_NATIVE_PRESS_SUPPRESS_UNTIL=0;

  if(!target || !target.closest('.media:not(.blurred) img, .media:not(.blurred) video, .media-viewer-image, .media-viewer-video')) return;
  MEDIA_NATIVE_PRESS_SUPPRESS_UNTIL=Date.now()+900;
  /* Do not preventDefault: the whole point is to keep the OS media menu. */
},true);

  if(Date.now()>=MEDIA_NATIVE_PRESS_SUPPRESS_UNTIL) return;
  const target=e.target instanceof Element ? e.target : null;
  if(!target || !target.closest('.media:not(.blurred) img, .media:not(.blurred) video, .media-viewer-image, .media-viewer-video')) return;

/* Revealed photos/videos open iroha's own viewer. Safety reveal runs first, so
   the first tap on blurred media only reveals it; the next tap opens the viewer. */
document.addEventListener('click',e=>{
  if(e.defaultPrevented) return;
  const target=e.target instanceof Element ? e.target : null;
  if(!target) return;
  const media=target.closest('.media:not(.blurred) img, .media:not(.blurred) video');
  if(!media) return;

  /* v8.7: feed videos already own taps outside their buttons: while playing,
     that tap shows/hides the play/mute/detail chrome. Do not let the global
     media-viewer capture handler steal that tap and open the detail screen.
     The dedicated expand button still opens the detail viewer normally. */
  if(media.matches('video[data-feed-video]')) return;

  /* The click that ends a strip flick lands on whichever picture stopped under
     the finger. Opening the viewer there would make the row feel like it
     cannot be scrolled at all. */
  if(stripJustScrolled(target)){ e.preventDefault(); e.stopImmediatePropagation(); return; }

  e.preventDefault();
  e.stopImmediatePropagation();
  haptic(5);
  const kind=media.tagName==='VIDEO'?'video':'image';
  openMediaViewer(media.currentSrc||media.src,kind,media);
},true);

/* =========================================================
   VOICE RECORDER  —  record, listen back, then send
   ========================================================= */
function openRecorder(done){
  if($('#recSheet')) return;          /* a second tap must not stack recorders */
  let rec=null, chunks=[], stream=null, t0=0, timer=null, blobURL=null, dur=0, raf0=0, analyser=null;

  const sheet=el(`<div class="sheet" id="recSheet">
    <div class="grab"></div>
    <div class="rec-face">
      <div class="rec-time" id="recTime">0:00</div>
      <div class="rec-bars" id="recBars">${Array.from({length:22},()=>'<i></i>').join('')}</div>
      <button class="rec-dot" id="recDot">${I.micBig}</button>
      <p class="rec-hint" id="recHint">タップして録音を始めます</p>
    </div>
    <div id="recPreview"></div>
    <button class="bigbtn" id="recSend" style="opacity:.4;pointer-events:none">送信する</button>
    <button class="textlink" id="recNo">キャンセル</button>
  </div>`);
  $('#overlays').appendChild(sheet);
  showScrim(true, close);
  raf(()=>sheet.classList.add('on'));

  const dot=$('#recDot',sheet), hint=$('#recHint',sheet), tEl=$('#recTime',sheet),
        prev=$('#recPreview',sheet), send=$('#recSend',sheet), bars=$$('#recBars i',sheet);

  dot.onclick=()=>{ rec && rec.state==='recording' ? stop() : start(); };
  $('#recNo',sheet).onclick=close;
  send.onclick=()=>{
    if(!blobURL) return;
    haptic(12);
    const m={kind:'audio', src:blobURL, dur};
    blobURL=null;                     /* handed over, don't revoke on close */
    close(); setTimeout(()=>done(m),200);
  };

  async function start(){
    if(!navigator.mediaDevices || !window.MediaRecorder){
      toast('この環境では録音できません'); return;
    }
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(err){ toast('マイクの使用が許可されませんでした'); return; }
    chunks=[]; rec=new MediaRecorder(stream);
    rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    rec.onstop=()=>{
      const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});
      blobURL=URL.createObjectURL(blob);
      prev.innerHTML=audioHTML({kind:'audio', src:blobURL, dur});
      send.style.opacity=''; send.style.pointerEvents='';
      hint.textContent='聞き返してから送信できます';
      dot.innerHTML=I.micBig; dot.classList.remove('on');
      dot.style.background='';
    };
    rec.start();
    t0=Date.now(); dur=0;
    dot.innerHTML=I.stopBig; dot.classList.add('on');
    hint.textContent='タップで録音を止めます';
    prev.innerHTML=''; send.style.opacity='.4'; send.style.pointerEvents='none';
    timer=setInterval(()=>{
      dur=(Date.now()-t0)/1000;
      tEl.textContent=fmtDur(dur);
      if(dur>=180) stop();              /* three minutes is plenty */
    },200);
    meter();
    haptic(12);
  }
  function meter(){
    try{
      const ctx=new (window.AudioContext||window.webkitAudioContext)();
      const srcNode=ctx.createMediaStreamSource(stream);
      analyser=ctx.createAnalyser(); analyser.fftSize=64;
      srcNode.connect(analyser);
      const data=new Uint8Array(analyser.frequencyBinCount);
      const tick=()=>{
        if(!analyser) return;
        analyser.getByteFrequencyData(data);
        bars.forEach((b,i)=>{
          const v=data[i%data.length]/255;
          b.style.height=(4+v*30).toFixed(0)+'px';
        });
        raf0=requestAnimationFrame(tick);
      };
      tick();
    }catch(e){/* metering is decoration; recording still works */}
  }
  function stop(){
    if(rec && rec.state==='recording') rec.stop();
    clearInterval(timer); timer=null;
    cancelAnimationFrame(raf0); analyser=null;
    bars.forEach(b=>b.style.height='4px');
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
    haptic(9);
  }
  function close(){
    stop(); stopAudio();
    if(blobURL) URL.revokeObjectURL(blobURL);
    sheet.classList.remove('on'); showScrim(false);
    setTimeout(()=>sheet.remove(),520);
  }
}


/* the "会話できる相手" setting, applied to incoming requests */
function canRequestMe(uid){
  if(S.blocked.includes(uid)) return false;
  if(S.who==='all') return true;
  if(S.who==='fav') return !!(S.users[uid] && S.users[uid].fav);
  /* 'replied' — only people whose posts I have replied to */
  return S.posts.some(p=>p.u===uid && (p.rep||[]).some(r=>r.u==='me'));
}

/* image and video in a DM only require that the other user has favourited me */
function favoredBy(uid){
  const u=S.users[uid];
  return !!(u && u.favMe);
}
