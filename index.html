<meta name="theme-color" content="#151225">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="iroha">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-512.png">
<script>
/* saved theme before first paint: keeps iOS/Safari top area in sync */
try{
  const p=JSON.parse(localStorage.getItem('iroha:prefs:v1')||'null');
  let t='night';
  if(p){
    if(['night','light','dark'].includes(p.themeChoiceV2)) t=p.themeChoiceV2;
    else if(p.theme==='dark') t='dark';
  }
  document.documentElement.dataset.theme=t;
  document.querySelector('meta[name="theme-color"]').content =
    t==='dark' ? '#0B0B0B' : t==='light' ? '#FFFFFF' : '#151225';
}catch(_){}
</script>

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* iOS/スマホ: 表示中の文字や画像を長押ししても選択・コールアウトへ入らない。
   入力欄だけは編集のため文字選択を許可する。 */
#app,#app *{
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}
#app input,#app textarea{
  -webkit-user-select:text;
  user-select:text;
  -webkit-touch-callout:default;
}
html,body{height:100%}
html{
  background:var(--bg);
  transition:background-color var(--dur-3) var(--ease-out);
}
html[data-theme="dark"]{background:#0B0B0B}
html[data-theme="light"]{background:#FFFFFF}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
  font-size:15px; line-height:1.62;
  letter-spacing:.01em;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  transition:background-color var(--dur-3) var(--ease-out), color var(--dur-3) var(--ease-out);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:none}
:focus-visible{outline:none}
.msgfield:focus-visible,.replyfield:focus-visible,.field input:focus-visible,
.field textarea:focus-visible,.obox textarea:focus-visible{outline:none}
.msgfield,.replyfield{
  -webkit-appearance:none; appearance:none;
  resize:none; overflow-y:auto; scrollbar-width:none;
}
.msgfield::-webkit-scrollbar,.replyfield::-webkit-scrollbar{display:none;width:0;height:0}
.msgfield::-webkit-resizer,.replyfield::-webkit-resizer{display:none}

/* ---------- app frame ---------- */
#app{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  overflow:hidden;
  max-width:520px; margin:0 auto;
  background:var(--bg);
  transition:background-color var(--dur-3) var(--ease-out);
}
.layer{position:absolute; inset:0; display:flex; flex-direction:column; background:var(--bg);
  transition:background-color var(--dur-3) var(--ease-out)}

/* ============ TAB LAYER ============ */
.tabs-root{position:absolute; inset:0}
.tabpane{
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  opacity:0; visibility:hidden;
  transform:translate3d(0,10px,0) scale(.994);
  transition:opacity 110ms var(--ease-out), transform 170ms var(--ease-out), visibility 0s linear 170ms;
}
.tabpane.on{opacity:1; visibility:visible; transform:none; transition:opacity 170ms var(--ease-out), transform 260ms var(--spring-soft), visibility 0s;}
.tabpane.leaving{transform:translate3d(0,-8px,0) scale(.994)}

/* ---------- header ---------- */
.appbar{
  position:absolute; top:0; left:0; right:0; z-index:6;
  padding:calc(var(--safe-t) + 10px) 18px 12px;
  background:var(--bar);
  -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
  box-shadow:inset 0 1px 0 var(--glass-edge);
  border-bottom:1px solid transparent;
  transition:border-color var(--dur-3) var(--ease-out), background-color var(--dur-3) var(--ease-out);
}
.appbar.stuck{border-bottom-color:var(--glass-line)}
.appbar-row{display:flex; align-items:center; gap:12px; min-height:34px}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:auto}
.brand-dot{
  width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle at 34% 32%,#FFF0B4,var(--accent) 62%,var(--accent-deep));
  box-shadow:var(--glow);
  align-self:center; flex:0 0 auto;
  animation:dotIn 900ms var(--spring) both;
}
@keyframes dotIn{0%{transform:scale(.2) rotate(-90deg);opacity:0}100%{transform:none;opacity:1}}
.brand-name{font-family:"Snell Roundhand","Segoe Script","Brush Script MT",cursive; font-size:28px; font-weight:600; letter-spacing:.01em; line-height:1}
.brand-ver{font-size:11px; font-weight:700; color:var(--ink-3); letter-spacing:.02em}
.iconbtn{
  width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center; color:var(--ink);
  transition:transform var(--dur-2) var(--spring), background-color var(--dur-1) linear;
}
.iconbtn:active{transform:scale(.86); background:var(--field)}
.ttl{font-size:16px;font-weight:800;letter-spacing:.01em}

/* ---------- composer ---------- */
.composer{
  margin:14px 0 0; width:100%;
  display:flex; align-items:center; gap:10px;
  background:var(--field); border-radius:16px;
  padding:13px 16px; text-align:left; color:var(--ink-3);
  font-size:14.5px; font-weight:500;
  transition:transform var(--dur-2) var(--spring), background-color var(--dur-3) var(--ease-out), box-shadow var(--dur-2) var(--ease-out);
}
.composer span{flex:1}
.composer:active{transform:scale(.978)}

/* ---------- filter chips ---------- */
.chiprow{
  display:flex; gap:9px; margin-top:13px;
  overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none;
  padding:2px 18px; margin-left:-18px; margin-right:-18px;
  scroll-behavior:smooth;
}
.chiprow::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; padding:9px 19px; border-radius:999px;
  background:var(--field); color:var(--ink); font-size:14px; font-weight:700;
  transition:transform var(--dur-2) var(--spring), background-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out), box-shadow var(--dur-3) var(--ease-out);
}
.chip:active{transform:scale(.93)}
.chip.on{background:var(--accent); color:var(--accent-ink); box-shadow:var(--glow)}

/* ---------- scroller ---------- */
.scroll{
  flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  padding:calc(var(--barH,124px) + 12px) 12px calc(var(--safe-b) + 116px);
  scrollbar-width:none;
}
.scroll.withbar{padding-bottom:calc(var(--barB,66px) + 16px)}
.scroll::-webkit-scrollbar{display:none}
.scroll.flush{padding-left:0;padding-right:0}

/* ---------- pull to refresh ---------- */
.ptr{
  position:absolute; left:0; right:0; top:calc(var(--barH,124px) + 10px);
  display:grid; place-items:center; pointer-events:none; z-index:3;
}
.ptr-ring{
  width:32px;height:32px;border-radius:50%;
  background:var(--bg-elev); box-shadow:0 3px 12px rgba(0,0,0,.14);
  display:grid; place-items:center; color:var(--ink-3);
  opacity:0; transform:scale(.5);
  transition:opacity 160ms linear, box-shadow 220ms var(--ease-out), color 220ms linear;
}
.ptr-ring.ready{color:var(--accent-deep)}
[data-theme="dark"] .ptr-ring.ready{color:var(--accent)}
.ptr-ring .arc{transform-origin:50% 50%}
.ptr-ring.busy{color:var(--accent-deep)}
[data-theme="dark"] .ptr-ring.busy{color:var(--accent)}
.ptr-ring.busy .arc{animation:sp .68s linear infinite}
.pull-host{transition:transform 460ms var(--spring-soft)}

/* ---------- post card ---------- */
.card{
  background:var(--card); border:1px solid var(--line);
  border-radius:20px; padding:16px 17px 13px; margin-bottom:12px;
  box-shadow:var(--shadow-card);
  transition:transform var(--dur-2) var(--ease-out), background-color var(--dur-3) var(--ease-out), border-color var(--dur-3) var(--ease-out);
}
.card.tap:active{transform:scale(.988)}
.card.tap:has(.mstrip-track:active){transform:none}
.p-head{display:flex; align-items:flex-start; gap:15px}
.av{flex:0 0 auto; border-radius:50%; overflow:hidden; display:block; background:var(--card-2);
  transition:transform var(--dur-2) var(--spring)}
.av:active{transform:scale(.92)}
.av svg{display:block;width:100%;height:100%}
.p-meta{flex:1 1 auto; min-width:0}
.p-line{display:flex; align-items:center; gap:5px; flex-wrap:nowrap; line-height:1.35; min-width:0}
.p-name{font-size:15px; font-weight:800; letter-spacing:-.01em; white-space:nowrap; flex:0 0 auto}
.gtag{
  flex:0 0 auto; width:18px; height:18px; border-radius:50%;
  display:inline-grid; place-items:center;
  font-size:12px; font-weight:700; line-height:1;
  transition:background-color var(--dur-3) var(--ease-out);
}
.g-male{background:rgba(74,124,180,.16); color:#4A7CB4}
.g-female{background:rgba(196,96,132,.16); color:#C46084}
.gtag .gender-svg{display:block;width:12px;height:12px}
[data-theme="dark"] .g-male{background:rgba(122,166,214,.18); color:#7AA6D6}
[data-theme="dark"] .g-female{background:rgba(224,138,170,.18); color:#E08AAA}
.badge-demo{
  flex:0 0 auto;
  display:inline-flex; align-items:center; gap:4px;
  background:var(--field); color:var(--ink-2); border:1px solid var(--line);
  font-size:10.5px; font-weight:700; letter-spacing:.06em;
  padding:3px 10px; border-radius:999px;
}
.badge-bot{
  flex:0 0 auto;
  display:inline-flex; align-items:center; gap:4px;
  background:rgba(228,180,28,.20); color:#8A6B14;
  font-size:11px; font-weight:700; letter-spacing:.05em;
  padding:3.5px 10px; border-radius:999px;
}
[data-theme="dark"] .gtag{
  flex:0 0 auto; width:18px; height:18px; border-radius:50%;
  display:inline-grid; place-items:center;
  font-size:12px; font-weight:700; line-height:1;
  transition:background-color var(--dur-3) var(--ease-out);
}
.g-male{background:rgba(74,124,180,.16); color:#4A7CB4}
.g-female{background:rgba(196,96,132,.16); color:#C46084}
[data-theme="dark"] .g-male{background:rgba(122,166,214,.18); color:#7AA6D6}
[data-theme="dark"] .g-female{background:rgba(224,138,170,.18); color:#E08AAA}
.badge-demo{
  flex:0 0 auto;
  display:inline-flex; align-items:center; gap:4px;
  background:var(--field); color:var(--ink-2); border:1px solid var(--line);
  font-size:10.5px; font-weight:700; letter-spacing:.06em;
  padding:3px 10px; border-radius:999px;
}
.badge-bot{background:#4A3D14;color:var(--accent)}
.p-time{font-size:13px; white-space:nowrap; color:var(--ink-3); font-weight:500; margin-left:auto; text-align:right; flex:0 0 auto}
.dot-sep{width:3.5px; height:3.5px; border-radius:50%; background:var(--ink-3);
  display:inline-block; margin:0 4px; flex:0 0 auto; align-self:center}
.p-more{margin-left:auto; width:34px;height:22px; display:grid;place-items:center; color:var(--ink-3);
  transition:transform var(--dur-2) var(--spring), color var(--dur-2) linear}
.p-more:active{transform:scale(.8); color:var(--ink)}
.p-line .p-more{margin-left:4px}
.p-body{margin:9px 0 0; font-size:16px; font-weight:600; line-height:1.64; letter-spacing:.005em; word-break:break-word; white-space:pre-wrap}
.p-full .p-body{padding-left:0}
.p-col{flex:1 1 auto; min-width:0}
.tag{
  display:inline-block; margin-top:9px;
  font-size:12.5px; font-weight:700; line-height:1.25; padding:4px 11px; border-radius:9px;
}
.tag-hitorigoto{background:#F6F0DC;color:#7B6A42}
.tag-soudan{background:#EDE9F7;color:#625787}
.tag-zatsudan{background:#E7F0E8;color:#4E6B54}
.tag-shitsumon{background:#F5ECE7;color:#87614F}
.tag-shumi{background:#E6EFF6;color:#4B6075}
.tag-arch{background:var(--field);color:var(--ink-3)}
.p-foot{display:flex; align-items:center; gap:22px; margin-top:9px}
.act{
  display:inline-flex; align-items:center; gap:8px;
  font-size:14px; font-weight:700; color:var(--ink-3);
  padding:6px 2px; border-radius:10px;
  transition:color var(--dur-2) var(--ease-out), transform var(--dur-2) var(--spring);
}
.act:active{transform:scale(.9)}
.act.liked{color:#E24A6B}
.act.liked svg{fill:#E24A6B; stroke:#E24A6B}
.act .hb{display:inline-grid; place-items:center; position:relative}
.act.pop .hb{animation:heartPop 560ms var(--spring)}
@keyframes heartPop{
  0%{transform:scale(1)} 22%{transform:scale(.78)} 48%{transform:scale(1.36)} 70%{transform:scale(.94)} 100%{transform:scale(1)}
}
.burst{position:absolute; inset:-14px; pointer-events:none; overflow:visible; font-size:0; line-height:0}
.burst i{
  position:absolute; left:50%; top:50%; width:3.5px;height:3.5px;border-radius:2px;
  background:#E24A6B; opacity:0;
}
.act.pop .burst i{animation:sparkle 640ms var(--ease-out) forwards}
@keyframes sparkle{
  0%{opacity:0; transform:translate(-50%,-50%) scale(.3)}
  25%{opacity:1}
  100%{opacity:0; transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.5)}
}
.talkbtn{
  margin-left:auto; display:inline-flex; align-items:center; gap:8px;
  border:1px solid var(--line); border-radius:999px;
  padding:9px 17px; font-size:14px; font-weight:800; color:var(--ink);
  transition:transform var(--dur-2) var(--spring), background-color var(--dur-2) var(--ease-out), border-color var(--dur-2) var(--ease-out);
}
.talkbtn:active{transform:scale(.92); background:var(--field)}
.talkbtn.done{
  border-color:#E1E2E5;
  background:#F1F2F4;
  color:#777B82;
  box-shadow:none;
}
[data-theme="dark"] .talkbtn.done{
  border-color:#343434;
  background:#242424;
  color:#A8A8AA;
  box-shadow:none;
}

/* entrance stagger */
.stagger{opacity:0; transform:translate3d(0,16px,0)}
.stagger.in{animation:riseIn 330ms var(--spring-soft) both}
@keyframes riseIn{from{opacity:0;transform:translate3d(0,18px,0) scale(.985)}to{opacity:1;transform:none}}

/* ---------- skeleton ---------- */
.sk{border-radius:8px; background:var(--skel); background-size:220% 100%; animation:shimmer 1.35s linear infinite}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}

/* ---------- empty ---------- */
.empty{padding:64px 30px; text-align:center; animation:riseIn 300ms var(--spring-soft) both}
.empty h3{margin:0 0 8px; font-size:15px; font-weight:800}
.empty p{margin:0; font-size:13px; color:var(--ink-3); font-weight:600; line-height:1.8}

/* ============ BOTTOM NAV ============ */
.navwrap{
  position:absolute; left:0; right:0; bottom:0; z-index:40;
  padding:0 16px calc(var(--safe-b) + 12px);
  pointer-events:none;
  transition:transform var(--dur-3) var(--ease-out), opacity var(--dur-2) var(--ease-out);
}
.navwrap.hide{transform:translate3d(0,120%,0); opacity:0}
.nav{
  position:relative; pointer-events:auto;
  height:70px; border-radius:999px;
  background:var(--nav);
  -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
  box-shadow:var(--shadow-nav), inset 0 1px 0 var(--glass-edge);
  display:grid; grid-template-columns:repeat(5,1fr); align-items:center;
  border:1px solid var(--glass-line);
  transform-origin:50% 50%;
  will-change:transform,opacity;
  transition:background-color var(--dur-3) var(--ease-out), border-color var(--dur-3) var(--ease-out);
}
.nav-ind{
  position:absolute; top:11px; height:48px; width:48px; border-radius:17px;
  background:var(--nav-pill); left:0;
  transition:transform 520ms var(--spring), background-color var(--dur-3) var(--ease-out), width 380ms var(--ease-out);
  will-change:transform;
}

.navbtn{
  position:relative; will-change:transform,opacity; height:100%; display:grid; place-items:center; color:var(--ink-2);
  transition:color 300ms var(--ease-out), transform var(--dur-2) var(--spring);
}
.navbtn svg{width:27px;height:27px}
.navbtn:active{transform:scale(.86)}
.navbtn.on{color:var(--nav-pill-ink)}
.navbtn .bdg{
  position:absolute; top:11px; right:calc(50% - 24px);
  min-width:18px;height:18px;padding:0 5px; border-radius:9px;
  background:#E0245E; color:#fff; font-size:10.5px; font-weight:800;
  display:grid;place-items:center; line-height:1;
  box-shadow:0 0 0 2px rgba(255,255,255,.55);
  animation:bdgIn 520ms var(--spring) both;
}
/* unread notifications keep the yellow language, but show how many */
.navbtn .bdg.soft{
  top:12px; right:calc(50% - 22px);
  background:var(--accent); color:var(--accent-ink);
  box-shadow:0 0 0 2.5px var(--nav-ring), 0 0 8px rgba(247,206,69,.5);
}
@keyframes bdgIn{from{transform:scale(0)}to{transform:none}}
.fabslot{display:grid;place-items:center; position:relative; z-index:2}
.fab{
  position:absolute; top:-8px; left:0; width:62px;height:62px;
  display:grid;place-items:center; pointer-events:auto; z-index:5;
  will-change:transform;
}
.fab-core{
  width:62px;height:62px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#FFE27E,var(--accent) 60%,var(--accent-deep));
  color:var(--accent-ink); display:grid;place-items:center;
  box-shadow:0 6px 18px rgba(228,180,28,.42), var(--glow);
  transition:transform 320ms var(--spring), box-shadow var(--dur-3) var(--ease-out);
  will-change:transform;
}
.fab:active .fab-core{transform:scale(.86)}
.fab svg{transition:transform 460ms var(--spring)}
.fab.x svg{transform:rotate(135deg)}


/* ============ STACK SCREENS ============ */
.stack{position:absolute; inset:0; z-index:50; pointer-events:none}
.screen{
  position:absolute; inset:0; pointer-events:auto;
  background:var(--bg); display:flex; flex-direction:column;
  min-height:0; overflow:hidden;
  transform:translate3d(100%,0,0);
  box-shadow:-14px 0 40px rgba(0,0,0,.13);
  transition:transform 420ms var(--ease-out);
  will-change:transform;
}
.screen.in{transform:none}
.screen.out{transform:translate3d(100%,0,0)}
.tabs-root{transition:transform 420ms var(--ease-out), filter 420ms var(--ease-out)}
.tabs-root.pushed{transform:translate3d(-22%,0,0) ; filter:brightness(.94)}
[data-theme="dark"] .tabs-root.pushed{filter:brightness(.7)}

.navbar{
  position:absolute; top:0; left:0; right:0; z-index:6;
  display:flex; align-items:center; gap:6px;
  padding:calc(var(--safe-t) + 8px) 10px 12px;
  background:var(--bar);
  -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
  box-shadow:inset 0 1px 0 var(--glass-edge);
  border-bottom:1px solid transparent;
  transition:border-color var(--dur-3) var(--ease-out), background-color var(--dur-3) var(--ease-out);
}
.navbar.stuck{border-bottom-color:var(--glass-line)}
.navbar .ttl{flex:1 1 auto; text-align:center}
.navbar .side{min-width:44px; display:flex; justify-content:center; flex:0 0 auto}
/* 投稿・返信モーダルは左右ボタンの文字幅に関係なく、タイトルを画面中央へ固定 */
#composeM .navbar,#replyM .navbar{
  display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center;
}
#composeM .navbar .ttl,#replyM .navbar .ttl{
  justify-self:center; flex:none;
}
#composeM .navbar .side:first-child,#replyM .navbar .side:first-child{justify-self:start}
#composeM .navbar .side:last-child,#replyM .navbar .side:last-child{justify-self:end}
.txtbtn{padding:8px 10px; white-space:nowrap; font-size:14.5px; font-weight:700; border-radius:10px;
  transition:transform var(--dur-2) var(--spring), opacity var(--dur-1) linear}
.txtbtn:active{transform:scale(.92); opacity:.6}
.txtbtn.accent{color:var(--accent-deep); font-weight:800}
[data-theme="dark"] .txtbtn.accent{color:var(--accent)}
.txtbtn[disabled]{opacity:.35}

/* ---------- profile ---------- */
.prof{padding:26px 20px 0; text-align:center}
.prof .av{margin:0 auto 14px; box-shadow:0 6px 22px rgba(0,0,0,.08)}
/* Profile contents should appear immediately. Keep only the tab/screen transition. */
#meList .empty,#pfList .empty{animation:none}
.prof h2{margin:0; font-size:23px; font-weight:800; letter-spacing:-.02em;
  display:flex; align-items:center; justify-content:center; gap:8px}
.prof h2 .gtag{width:22px;height:22px;font-size:14px}
.prof h2 .gtag .gender-svg{width:14px;height:14px}
.prof .handle{margin:2px 0 0; font-size:14px; color:var(--ink-3); font-weight:600}
.profile-rel-status{
  display:inline-flex; align-items:center; justify-content:center;
  margin-top:10px; padding:5px 12px; border-radius:999px;
  font-size:12px; font-weight:800; line-height:1;
  border:1px solid var(--line); background:var(--field); color:var(--ink-2);
}
.profile-rel-status.blocked{color:#E0245E; border-color:rgba(224,36,94,.26); background:rgba(224,36,94,.08)}
.pill-official{
  display:inline-flex; align-items:center; gap:5px; margin-top:11px;
  background:var(--accent); color:var(--accent-ink);
  font-size:12px; font-weight:800; padding:5px 12px; border-radius:999px;
}
[data-theme="dark"] .pill-official{background:#4A3D14;color:var(--accent)}
.prof .bio{margin:13px 0 0; font-size:14.5px; font-weight:700; line-height:1.8; white-space:pre-wrap}
.prof-actions{display:flex; gap:12px; justify-content:center; margin-top:18px}
.obtn{
  display:inline-flex; align-items:center; gap:8px;
  border:1px solid var(--line); border-radius:999px;
  padding:11px 22px; font-size:14px; font-weight:800;
  transition:transform var(--dur-2) var(--spring), background-color var(--dur-2) var(--ease-out), border-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out);
}
.obtn:active{transform:scale(.93)}
.obtn.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.obtn.on svg{fill:var(--accent-ink); stroke:var(--accent-ink)}
.obtn.wide{width:100%; justify-content:center; padding:12px}
.note{margin:11px 0 0; font-size:11.5px; color:var(--ink-3); font-weight:600}
.stats{
  display:grid; grid-template-columns:repeat(3,1fr); margin:20px 20px 0;
  border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  padding:16px 0;
}
.stat{text-align:center; position:relative}
.stat+.stat::before{content:""; position:absolute; left:0; top:6px;bottom:6px; width:1px; background:var(--line)}
.stat b{display:block; font-size:20px; font-weight:800; letter-spacing:-.02em}
.stat span{font-size:12px; color:var(--ink-3); font-weight:700}

/* underline tabs */
.utabs{position:relative; display:flex; margin:6px 20px 0; border-bottom:1px solid var(--line)}
.utab{flex:1; padding:14px 0; font-size:14px; font-weight:800; color:var(--ink-3);
  transition:color 300ms var(--ease-out)}
.utab.on{color:var(--ink)}
.utab small{font-size:12px; color:var(--ink-3); margin-left:5px; font-weight:700}
.uind{position:absolute; bottom:-1px; left:0; height:2.5px; border-radius:2px; background:var(--accent-deep);
  transition:transform 460ms var(--spring), width 380ms var(--ease-out)}
[data-theme="dark"] .uind{background:var(--accent)}

/* segmented */
.seg{position:relative; display:flex; margin:12px 16px 0; background:var(--field); border-radius:14px; padding:4px}
.segbtn{flex:1; padding:10px 0; font-size:14px; font-weight:800; color:var(--ink-3); z-index:1;
  transition:color 300ms var(--ease-out)}
.segbtn.on{color:var(--ink)}
.segbtn small{font-size:11.5px; color:var(--ink-3); margin-left:5px; font-weight:800}
.segbtn.on small{color:var(--accent-deep)}
[data-theme="dark"] .segbtn.on small{color:var(--accent)}
.segind{position:absolute; top:4px; bottom:4px; left:4px; border-radius:11px; background:var(--bg-elev);
  box-shadow:0 1px 4px rgba(0,0,0,.09);
  transition:transform 480ms var(--spring), width 340ms var(--ease-out)}

/* ---------- list rows ---------- */
.row{
  position:relative; overflow:hidden;
  display:flex; align-items:flex-start; gap:13px;
  padding:16px 18px; border-bottom:1px solid var(--line-soft);
  transition:background-color var(--dur-2) var(--ease-out);
}
.row:active{background:var(--field)}
.row.tapable{cursor:pointer}
.row-main{flex:1 1 auto; min-width:0}
.row-t{font-size:15.5px; font-weight:800; line-height:1.5; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.pinmark{color:var(--ink-3); display:inline-flex}
.avhit{flex:0 0 auto; display:block; border-radius:50%;
  transition:transform var(--dur-2) var(--spring)}
.avhit:active{transform:scale(.9)}
.row-s{margin-top:3px; font-size:14.5px; color:var(--ink-3); font-weight:600; line-height:1.6;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.row-r{flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; gap:7px; padding-top:2px}
.time-s{font-size:13px; color:var(--ink-3); font-weight:600}
.unread{
  min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:#E0245E;color:#fff;
  font-size:12px;font-weight:800; display:grid;place-items:center; line-height:1;
}
.ripple{position:absolute; border-radius:50%; background:currentColor; opacity:.10; transform:scale(0);
  animation:rip 620ms var(--ease-out) forwards; pointer-events:none}
@keyframes rip{to{transform:scale(2.6); opacity:0}}

/* ---------- search ---------- */
.searchbar{
  flex:1 1 auto; display:flex; align-items:center; gap:9px;
  background:var(--field); border-radius:13px; padding:10px 13px;
  transition:background-color var(--dur-3) var(--ease-out), box-shadow var(--dur-2) var(--ease-out);
}
.searchbar:focus-within{box-shadow:inset 0 0 0 1.5px var(--accent)}
.searchbar input:focus-visible{outline:none}
.searchbar input{flex:1; font-size:14.5px; font-weight:600; min-width:0}
.searchbar input::placeholder{color:var(--ink-3)}
.row.fresh{background:var(--fresh-wash)}
.row.fresh::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--accent);
}
.newchip{
  display:inline-block; margin-right:7px; vertical-align:1px;
  background:var(--accent); color:var(--accent-ink);
  font-size:10.5px; font-weight:800; letter-spacing:.04em;
  padding:2px 8px; border-radius:999px;
}
.segdot{
  display:inline-block; margin-left:6px; vertical-align:2px;
  width:7px; height:7px; border-radius:50%; background:var(--accent);
  box-shadow:0 0 6px rgba(247,206,69,.6);
}
.segbtn{position:relative}
.segbtn small.has-new{color:var(--accent-deep); font-weight:800}
[data-theme="dark"] .segbtn small.has-new{color:var(--accent)}
.sec-h{padding:16px 18px 8px; font-size:12px; font-weight:800; color:var(--ink-3); letter-spacing:.04em}

/* ---------- chat thread ---------- */
/* DM thread is the scroll owner. The composer is position:absolute, so the
   browser still counts the area behind it as part of the visible scroller.
   On iOS, bottom padding on a flex scroller can fail to create reliable
   scrollable overflow. Keep the padding small and add a REAL flex spacer
   with ::after whose height equals the composer. That makes messages covered
   by the input bar genuinely scrollable above it. */
.thread{
  flex:1 1 0; min-height:0; min-width:0;
  overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch; touch-action:pan-y; scrollbar-width:none;
  padding:calc(var(--barH,90px) + 14px) 14px 16px;
  scroll-padding-bottom:calc(var(--barB,66px) + 18px);
  display:flex; flex-direction:column; gap:4px; overscroll-behavior-y:contain;
}
.thread::after{
  content:"";
  display:block;
  width:1px;
  height:calc(var(--barB,66px) + 18px);
  flex:0 0 calc(var(--barB,66px) + 18px);
  pointer-events:none;
}
.thread::-webkit-scrollbar{display:none}
.msgrow{display:flex; align-items:flex-end; gap:8px; margin-top:8px}
.msgrow.me{flex-direction:row-reverse}
.msgrow .av{align-self:flex-end}
.bub{
  max-width:74%; padding:11px 14px; border-radius:19px;
  font-size:14.5px; font-weight:600; line-height:1.68; word-break:break-word;
  background:var(--card-2); border:1px solid var(--line-soft);
  border-bottom-left-radius:7px;
  transition:background-color var(--dur-3) var(--ease-out), border-color var(--dur-3) var(--ease-out);
}
.msgrow.me .bub{
  background:var(--accent); color:var(--accent-ink); border-color:transparent;
  border-bottom-left-radius:19px; border-bottom-right-radius:7px;
}
/* Existing DM history is already there when a thread opens.
   Only a genuinely new message gets the small arrival motion. */
.msgrow.dm-new-message .bub,
.syschip.dm-new-message{animation:bubIn 300ms var(--ease-out) both}
@keyframes bubIn{from{opacity:0; transform:translate3d(0,7px,0) scale(.975)}to{opacity:1;transform:none}}
.mtime{font-size:10.5px; color:var(--ink-3); font-weight:600; align-self:flex-end; padding-bottom:3px; flex:0 0 auto}
.syschip{
  align-self:center; margin:10px 0 2px;
  display:inline-flex; align-items:center; gap:9px;
  background:var(--card-2); border:1px solid var(--line-soft);
  color:var(--ink-2); font-size:13px; font-weight:700;
  padding:10px 18px; border-radius:999px;
  transition:background-color var(--dur-3) var(--ease-out), border-color var(--dur-3) var(--ease-out);
}
.syschip .t{color:var(--ink-3); font-size:12px; font-weight:600}
.daychip{align-self:center; margin:14px 0 4px; font-size:11.5px; font-weight:800; color:var(--ink-3);
  background:var(--field); padding:5px 13px; border-radius:999px}
.typing{display:inline-flex; gap:4px; align-items:center; padding:14px 16px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:blink 1.25s infinite}
.typing i:nth-child(2){animation-delay:.16s} .typing i:nth-child(3){animation-delay:.32s}
@keyframes blink{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.composer-bar{
  position:absolute; left:0; right:0; bottom:0; z-index:6;
  display:flex; align-items:flex-end; gap:9px;
  padding:10px 12px calc(var(--safe-b) + 10px);
  background:var(--bar); border-top:1px solid var(--glass-line);
  -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
  transition:background-color var(--dur-3) var(--ease-out), border-color var(--dur-3) var(--ease-out);
}
/* DM compose bar: + = image/video, mic beside send */
.dm-compose-shell{
  width:100%; display:flex; align-items:flex-end; gap:6px;
  padding:5px 6px 5px 9px;
  background:var(--field); border:1px solid var(--line); border-radius:999px;
}
.dm-media-btn,.dm-mic-btn{
  width:38px;height:38px;flex:0 0 38px;
  display:grid;place-items:center; color:var(--ink-2); border-radius:50%;
  transition:transform var(--dur-2) var(--spring), background-color var(--dur-2) var(--ease-out);
}
.dm-media-btn svg,.dm-mic-btn svg{width:22px;height:22px}
.dm-media-btn:active,.dm-mic-btn:active{transform:scale(.88);background:var(--line-soft)}
.dm-media-btn[disabled],.dm-mic-btn[disabled]{opacity:.35; pointer-events:none}

/* DM: selected attachment sits above the text bar as a compact preview. */
.dm-composer-bar{
  flex-direction:column; align-items:stretch; gap:7px;
}
.dm-att-slot:empty{display:none}
.dm-att-slot{padding:0 4px}
.dm-att-row{
  display:flex; gap:10px; align-items:flex-start;
  overflow-x:auto; scrollbar-width:none; padding:7px 3px 3px;
}
.dm-att-row::-webkit-scrollbar{display:none}
.dm-att-row .dm-att-preview{flex:0 0 auto}
.dm-att-preview{
  position:relative; width:max-content; max-width:100%;
  margin:0;
}
.dm-att-thumb{
  width:72px; height:72px; overflow:hidden; border-radius:13px;
  background:var(--card-2); border:1px solid var(--line);
}
.dm-att-thumb img,.dm-att-thumb video{
  display:block; width:100%; height:100%; object-fit:cover; background:#000;
}
.dm-att-preview .dm-att-x{
  position:absolute; top:-7px; right:-7px; z-index:3;
  width:24px; height:24px; border-radius:50%;
  display:grid; place-items:center;
  background:rgba(20,19,17,.78); color:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.18);
}
.dm-att-preview .dm-att-x svg{width:14px;height:14px}
.dm-att-preview .aplayer{margin:0; max-width:min(260px,calc(100vw - 48px))}

.msgfield{
  flex:1; min-width:0; background:transparent; border-radius:0; padding:8px 6px;
  font-size:15px; font-weight:600; resize:none; max-height:120px; line-height:1.5;
  transition:none;
}
.msgfield:focus{box-shadow:none}
.sendbtn{
  width:48px;height:40px;border-radius:999px; display:grid;place-items:center; flex:0 0 48px;
  color:var(--ink-3);
  transition:transform 420ms var(--spring), color var(--dur-2) linear, background-color var(--dur-2) linear;
}
.sendbtn svg{width:22px;height:22px}
.sendbtn.live{color:var(--accent-ink); background:var(--accent); box-shadow:var(--glow)}
.sendbtn:active{transform:scale(.86)}

/* optimistic/background sending */
.msgrow.is-sending .bub{opacity:.72}
.msgrow.is-failed .bub{opacity:.82}
.mtime.send-state{white-space:nowrap}
.mtime.send-state.failed{color:#D94B62;font-weight:800}
.post-send-state{
  display:inline-flex; align-items:center; gap:6px;
  margin-top:9px; padding:4px 9px; border-radius:999px;
  background:var(--field); color:var(--ink-3);
  font-size:11.5px; font-weight:800; line-height:1.2;
}
.post-send-state.failed{color:#D94B62}

/* ---------- post detail (X-style) ---------- */
.pd-card{background:var(--bg-elev); padding:16px 18px 0;
  transition:background-color var(--dur-3) var(--ease-out)}
.pd-head{display:flex; align-items:center; gap:12px}
.pd-head .who{flex:1 1 auto; min-width:0; line-height:1.3}
.pd-head .who b{display:flex; align-items:center; gap:5px; font-size:16px; font-weight:800; letter-spacing:-.005em}
.pd-head .who > span{display:block; font-size:13px; color:var(--ink-3); font-weight:600; margin-top:1px}
.pd-body{margin:16px 0 0; font-size:18px; font-weight:700; line-height:1.62; letter-spacing:.002em; white-space:pre-wrap; word-break:break-word}
.pd-card .tag{margin-top:12px}
.pd-stats{display:flex; align-items:center; gap:22px; margin-top:14px;
  padding:13px 0; border-top:1px solid var(--line)}
.pd-stat{display:inline-flex; align-items:center; gap:9px; font-size:14.5px; font-weight:700; color:var(--ink-3);
  transition:color var(--dur-2) var(--ease-out), transform var(--dur-2) var(--spring)}
.pd-stat:active{transform:scale(.92)}
.pd-stat.liked{color:#E24A6B}
.pd-stat.liked svg{fill:#E24A6B; stroke:#E24A6B}
.pd-stat .hb{display:inline-grid; place-items:center; position:relative}
.pd-stat.pop .hb{animation:heartPop 560ms var(--spring)}
.pd-stat.pop .burst i{animation:sparkle 640ms var(--ease-out) forwards}
.pd-sep{height:1px; background:var(--line)}
.rep-empty{padding:52px 24px; text-align:center; font-size:14.5px; font-weight:700; color:var(--ink-3); line-height:2}
.rep{display:flex; gap:14px; padding:16px 17px; border-bottom:1px solid var(--line-soft)}
.rep-main{flex:1 1 auto; min-width:0}
.rep-line{display:flex; align-items:center; gap:6px; line-height:1.3}
.rep-line b{font-size:15px; font-weight:800}
.rep-line > span:not(.gtag){font-size:13px; color:var(--ink-3); font-weight:600}
.rep-body{margin:6px 0 0; font-size:16px; font-weight:600; line-height:1.6; white-space:pre-wrap; word-break:break-word}
.muted-reply-shell{border-bottom:1px solid var(--line-soft)}
.muted-reply-shell .rep{border-bottom:0}
.muted-reply-toggle{
  width:100%; min-height:54px; padding:15px 17px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  text-align:left; color:var(--ink-3); font-size:14px; font-weight:750;
  transition:background-color var(--dur-1) linear, color var(--dur-1) linear;
}
.muted-reply-toggle:active{background:var(--field); color:var(--ink-2)}
.muted-reply-chev{display:grid;place-items:center;flex:0 0 auto;transition:transform var(--dur-2) var(--ease-out)}
.muted-reply-chev svg{width:18px;height:18px}
.muted-reply-shell.open .muted-reply-chev{transform:rotate(90deg)}
.mini-head{display:flex; align-items:center; gap:11px; flex-wrap:nowrap}
.mini-who{display:flex; align-items:center; gap:6px; font-size:14.5px; font-weight:800;
  min-width:0; flex:0 1 auto; overflow:hidden; white-space:nowrap}
.mini-head .p-time{flex:0 0 auto; white-space:nowrap; margin-left:auto}
.rep-line .p-more,.mini-head .p-more{margin-left:auto; flex:0 0 auto}
.mini-head .p-more{margin-left:6px}
.reply-src{
  display:flex; align-items:center; gap:7px; margin:11px 0 0;
  font-size:12.5px; font-weight:700; color:var(--ink-3);
}
.reply-src svg{width:15px;height:15px; flex:0 0 auto}
.rep-foot{margin-top:8px; display:flex; align-items:center; gap:16px}
.mention{color:var(--accent-deep); font-weight:800}
[data-theme="dark"] .mention{color:var(--accent)}
.replying{
  display:flex; align-items:center; gap:8px;
  padding:9px 14px; margin:0 14px -2px;
  background:var(--field); border-radius:14px 14px 0 0;
  font-size:12.5px; font-weight:700; color:var(--ink-2);
  animation:riseIn 240ms var(--spring-soft) both;
}
.replying b{color:var(--ink)}
.replying .x{margin-left:auto; width:24px;height:24px;border-radius:50%;
  display:grid;place-items:center; color:var(--ink-3);
  transition:transform var(--dur-2) var(--spring), background-color var(--dur-1) linear}
.replying .x:active{transform:scale(.85); background:var(--line)}
.rep.fresh{animation:repIn 620ms var(--spring-soft) both}
@keyframes repIn{from{opacity:0; transform:translate3d(0,-10px,0) scale(.97)}to{opacity:1;transform:none}}

/* ---------- reply composer (mirrors DM bar) ---------- */
.reply-dock{
  position:absolute; left:0; right:0; bottom:0; z-index:6;
  background:var(--bar);
  -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
  border-top:1px solid var(--glass-line);
  transition:background-color var(--dur-3) var(--ease-out), border-color var(--dur-3) var(--ease-out);
}
.reply-dock .reply-bar{position:static; background:none; border-top:0; -webkit-backdrop-filter:none; backdrop-filter:none}
.reply-dock .replying{margin:10px 14px 0; border-radius:14px}
.reply-trigger{
  display:flex; align-items:center; gap:11px; width:100%;
  padding:11px 14px calc(var(--safe-b) + 11px);
  color:var(--ink-3); font-size:15px; font-weight:600; text-align:left;
  transition:background-color var(--dur-2) var(--ease-out);
}
.reply-trigger > .av{
  flex:0 0 34px; width:34px !important; height:34px !important;
  min-width:34px; max-width:34px;
}
.reply-trigger > span:not(.av){flex:1 1 auto; min-width:0}
.reply-trigger > svg{flex:0 0 auto; color:var(--ink-3)}
.reply-trigger:active{background:var(--field)}
.rc-quote{
  display:flex; align-items:flex-start; gap:11px;
  padding:13px 15px; border-radius:16px;
  background:var(--field);
}
.rc-quote b{display:block; font-size:13.5px; font-weight:800}
.rc-quote span{display:block; margin-top:3px; font-size:13px; font-weight:600;
  color:var(--ink-3); line-height:1.6}
.reply-dock.open [data-theme="dark"] .reply-dock.open .reply-bar{
  position:absolute; left:0; right:0; bottom:0; z-index:6;
  display:flex; align-items:flex-end; gap:10px;
  padding:10px 14px calc(var(--safe-b) + 10px);
  background:var(--bar); border-top:1px solid var(--glass-line);
  -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
  transition:background-color var(--dur-3) var(--ease-out), border-color var(--dur-3) var(--ease-out);
}
.reply-bar .av{align-self:center}
.replyfield{
  flex:1; background:var(--field); border:1px solid var(--line); border-radius:20px;
  padding:10px 16px; font-size:15px; font-weight:600; resize:none; max-height:120px; line-height:1.55;
  transition:background-color var(--dur-3) var(--ease-out), border-color var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out);
}
.replyfield::placeholder{color:var(--ink-3)}
.replyfield:focus{border-color:var(--accent); box-shadow:none}
.replysend{
  width:40px;height:40px;border-radius:50%; flex:0 0 auto; align-self:center;
  display:grid;place-items:center;
  background:rgba(247,206,69,.34); color:var(--ink-3);
  transition:transform 420ms var(--spring), background-color 300ms var(--ease-out), color 260ms var(--ease-out), box-shadow 300ms var(--ease-out);
}
[data-theme="dark"] .replysend{background:rgba(251,211,77,.18)}
.replysend.live{background:var(--accent); color:var(--accent-ink); box-shadow:0 4px 14px rgba(228,180,28,.4), var(--glow)}
.replysend:active{transform:scale(.85)}
.replysend.fly svg{animation:planeFly 520ms var(--ease-out)}
@keyframes planeFly{
  0%{transform:none} 35%{transform:translate3d(-5px,4px,0) scale(.86)}
  100%{transform:translate3d(26px,-22px,0) scale(.5); opacity:0}
}

/* ---------- attachments ---------- */
.media{
  position:relative; margin-top:11px; border-radius:16px; overflow:hidden;
  background:var(--card-2); border:1px solid var(--line-soft);
}
.media img,.media video{display:block; width:100%; max-height:340px; object-fit:cover; background:var(--card-2)}
/* Home feed media reserves its final box before the asset finishes loading.
   This prevents image/video metadata from repeatedly changing card height. */
.media.feed-media-stable{
  overflow:hidden; background:var(--card-2);
}
.media.feed-media-stable img,.media.feed-media-stable video{
  width:100%; height:100%; max-height:none; object-fit:contain; background:transparent;
}
.media.blurred img,.media.blurred video{filter:blur(26px) saturate(.7); transform:scale(1.08)}
/* iOS Safari can let a native <video> consume the tap before the post-card
   click guard sees it. While safety blur is active, the video is display-only:
   the veil owns the tap. Controls become interactive again after reveal. */
.media.blurred video{pointer-events:none}
.media .veil{
  position:absolute; inset:0; z-index:5; display:grid; place-items:center; gap:8px;
  pointer-events:auto; touch-action:manipulation;
  background:rgba(12,11,9,.34); color:#fff; font-size:13px; font-weight:800;
  align-content:center; text-align:center; padding:16px;
}
.media .veil small{display:block; font-weight:600; opacity:.8; font-size:11.5px; margin-top:4px}
.media-filter-restore{
  position:absolute; right:10px; bottom:10px; z-index:6;
  display:inline-flex; align-items:center; gap:6px;
  touch-action:manipulation;
  padding:7px 10px; border-radius:999px;
  background:rgba(18,17,15,.76); color:#fff;
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  font-size:11.5px; font-weight:800; line-height:1;
  box-shadow:0 2px 10px rgba(0,0,0,.18);
  transition:transform var(--dur-2) var(--spring), opacity var(--dur-1) linear;
}
.media-filter-restore svg{width:15px;height:15px}
.media-filter-restore:active{transform:none;opacity:.78}
.media-off{
  margin-top:11px; display:flex; align-items:center; gap:9px;
  padding:13px 15px; border-radius:14px;
  background:var(--field); color:var(--ink-3); font-size:13px; font-weight:700;
}
.bub .media,.bub .media-off,.bub .aplayer{margin-top:0}
.msgrow .bub.has-media{padding:6px; background:var(--card-2)}
.msgrow.me .bub.has-media{background:var(--accent)}
.bub .media{max-width:230px}



/* ---------- composer attachments ---------- */
.attgrid{display:flex; gap:8px; margin-top:14px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
.attgrid::-webkit-scrollbar{display:none}
.attgrid .attpreview{
  position:relative; flex:0 0 auto; width:132px; margin-top:0;
  border-radius:14px; overflow:hidden;
}
.attgrid .attpreview .media,.attgrid .attpreview .aplayer{margin-top:0}
.attgrid .attpreview img,.attgrid .attpreview video{height:132px; object-fit:cover}
.attgrid .attpreview .x{
  position:absolute; top:6px; right:6px; z-index:3;
  width:26px; height:26px; border-radius:50%;
  background:rgba(10,8,22,.66); color:#fff;
  display:grid; place-items:center;
}
.atthint{margin:8px 2px 0; font-size:12px; font-weight:600; color:var(--ink-3)}

/* ---------- media strip ----------
   Threads-style: one shared height, each picture keeping its own width, the
   row running past the right edge of the card. */
.mstrip{
  margin-top:11px;
  /* bleed to the card edge so the row reads as continuing off-screen */
  margin-right:-17px;
}
.mstrip-track{
  display:flex; gap:8px;
  /* Do not reserve the whole touch for the horizontal strip. Safari may keep
     a true horizontal flick here, while a vertical drag is free to bubble to
     the page / pull-to-refresh. Direction locking is finished in attachPTR. */
  touch-action:pan-x pan-y;
  overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none;
  /* contain keeps a flick from reaching the page behind; `proximity` lets a
     short drag settle where it likes instead of fighting back to a slot */
  overscroll-behavior-x:contain;
  scroll-snap-type:x proximity;
  padding-right:17px;
  -webkit-overflow-scrolling:touch;
  /* a strip that is still deciding its widths must not swallow the gesture */
  will-change:scroll-position;
}
.mstrip-track::-webkit-scrollbar{display:none}
.mstrip-item{
  flex:0 0 auto; height:240px;
  scroll-snap-align:start;
  border-radius:14px; overflow:hidden;
  /* the picture must never take the drag away from the strip */
  -webkit-user-drag:none; user-select:none;
}
.mstrip-item img,.mstrip-item video{-webkit-user-drag:none}
.mstrip-item .media,
.mstrip-item .media-off{margin-top:0; height:100%; border-radius:0}
.mstrip-item .media img,
.mstrip-item .media video{
  width:100%; height:100%; max-height:none; object-fit:cover;
}
/* the reserved box must not impose its own ratio inside the strip */
.mstrip-item .media.feed-media-stable{aspect-ratio:auto !important; max-width:none !important}

/* ---------- media viewer: native long-press save + iroha viewer ---------- */
/* Global iOS callouts are disabled elsewhere. Re-enable only revealed media and
   viewer media so long-press can still expose the OS save/share menu. */
#app .media:not(.blurred) img,
#app .media:not(.blurred) video,
#app .media-viewer-image,
#app .media-viewer-video{
  -webkit-touch-callout:default !important;
  -webkit-user-select:none;
  user-select:none;
}

/* Instagram-like media detail: the media stays a floating card and expands
   from the tapped thumbnail instead of appearing as a flat black full screen.
   The backdrop is its own layer so a pull-down can fade the page back in
   continuously without fading the photo itself too early. */
.screen.media-viewer-screen{
  background:transparent !important;
  color:var(--ink);
  box-shadow:none;
  transform:none;
  opacity:0;
  transition:opacity 220ms ease;
}
.media-viewer-backdrop{
  position:absolute; inset:0; z-index:0; pointer-events:none;
  background:var(--bg);
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  -webkit-backdrop-filter:blur(22px) saturate(1.08);
  backdrop-filter:blur(22px) saturate(1.08);
  opacity:1;
  transition:opacity 220ms ease;
  will-change:opacity;
}
.screen.media-viewer-screen.in{transform:none;opacity:1}
.screen.media-viewer-screen.is-closing,
.screen.media-viewer-screen.is-closing *{
  pointer-events:none !important;
  touch-action:auto !important;
}
.screen.media-viewer-screen.out{
  transform:none; opacity:0;
  /* inert, but still painted: the fade is what the gesture promised */
  pointer-events:none !important;
  touch-action:auto !important;
}
.screen.media-viewer-screen.out *{
  pointer-events:none !important;
  touch-action:auto !important;
}
.media-viewer-screen .media-viewer-nav{
  z-index:3;
  background:linear-gradient(to bottom,
    color-mix(in srgb,var(--bg) 94%,transparent),
    color-mix(in srgb,var(--bg) 70%,transparent),
    transparent);
  border-bottom:0;
  box-shadow:none;
  opacity:0;
  transform:translate3d(0,-8px,0);
  transition:opacity 240ms ease,transform 360ms var(--ease-out);
}
.media-viewer-screen.in .media-viewer-nav{opacity:1;transform:none}
.media-viewer-screen .media-viewer-nav .iconbtn,
.media-viewer-screen .media-viewer-nav .ttl{color:var(--ink)}
.media-viewer-screen .media-viewer-nav .side{min-width:44px}
.media-viewer-screen .media-viewer-close svg{width:22px;height:22px}
.media-viewer-screen .media-viewer-save.is-preparing{opacity:.42}
.media-viewer-screen .media-viewer-save.is-error{opacity:.35}
.media-viewer-stage{
  position:absolute;
  inset:0;
  z-index:1;
  min-width:0;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding-top:calc(var(--safe-t) + 74px);
  padding-bottom:calc(var(--safe-b) + 64px);
  padding-inline:calc(max(env(safe-area-inset-left,0px),env(safe-area-inset-right,0px)) + 12px);
  overflow:hidden;
  background:transparent;
  overscroll-behavior:none;
}
.media-viewer-card{
  position:relative;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  min-width:1px;
  min-height:1px;
  max-width:100%;
  max-height:100%;
  overflow:hidden;
  border-radius:22px;
  background:#000;
  box-shadow:0 18px 48px rgba(0,0,0,.24),0 2px 10px rgba(0,0,0,.16);
  transform-origin:0 0;
  will-change:transform,border-radius;
  touch-action:none;
}
.media-viewer-image,
.media-viewer-video{
  display:block;
  width:100%;
  height:100%;
  max-width:none;
  max-height:none;
  object-fit:contain;
  background:#000;
}
.media-viewer-image-zoom{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  transform-origin:50% 50%;
  will-change:transform;
  touch-action:none;
}
.media-viewer-image-zoom.settling{
  transition:transform 320ms cubic-bezier(.22,1,.36,1);
}
.media-viewer-card.is-image{overflow:visible;background:transparent;box-shadow:none}
.media-viewer-card.is-image.image-gesture-dismissing{background:transparent;box-shadow:none}
.media-viewer-card.is-image .media-viewer-image{border-radius:inherit;background:transparent}
.media-viewer-card.is-dragging{box-shadow:0 12px 34px rgba(0,0,0,.20)}
/* A temporary neighbour is laid beside the active card while a gallery swipe
   is in flight. It is real media, not a screenshot, so the transition stays
   crisp at every device scale. */
.media-viewer-card.media-viewer-gallery-neighbor{
  position:absolute;
  margin:0;
  pointer-events:none;
  z-index:2;
  transition:none;
  will-change:transform;
}
.media-viewer-card.media-viewer-gallery-sliding{
  will-change:transform;
}
@media (max-width:520px){
  .media-viewer-card{border-radius:19px}
  .media-viewer-stage{padding-inline:12px}
}

/* Inline videos no longer expose Safari's browser controls. A quiet play mark
   makes it clear that tapping opens iroha's own player. */
.media .iroha-inline-video{cursor:pointer}
.video-open-indicator{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;
  color:#fff;background:rgba(0,0,0,.52);
  -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
  box-shadow:0 3px 15px rgba(0,0,0,.22);
  pointer-events:none;
  z-index:3;
}
.video-open-indicator svg{width:20px;height:20px;margin:0;display:block}
.media.blurred .video-open-indicator{opacity:0}
/* Feed videos never play on their own. A center button starts/pauses them in
   place, a corner button opens the full video detail, a bottom-right button
   is the shared mute toggle, and tapping anywhere else on the video just
   shows or hides all three while playback continues — the same "tap to
   reveal controls" feel as YouTube's inline player. */
.feed-video-play{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:52px;height:52px;border:0;border-radius:50%;padding:0;
  display:grid;place-items:center;color:#fff;
  background:rgba(0,0,0,.52);
  -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
  box-shadow:0 3px 15px rgba(0,0,0,.22);
  touch-action:manipulation;cursor:pointer;
  transition:opacity 160ms ease, transform 160ms var(--spring);
  z-index:4;
}
.feed-video-play:active{transform:translate(-50%,-50%) scale(.91)}
.feed-video-play svg{width:21px;height:21px;margin:0;display:block}
.feed-video-expand{
  position:absolute;right:10px;top:10px;z-index:4;
  width:32px;height:32px;border:0;border-radius:50%;padding:0;
  display:grid;place-items:center;color:#fff;
  background:rgba(16,16,16,.56);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 2px 10px rgba(0,0,0,.2);
  touch-action:manipulation;cursor:pointer;
  transition:opacity 160ms ease, transform 160ms var(--spring);
}
.feed-video-expand:active{transform:scale(.9)}
.feed-video-expand svg{width:15px;height:15px;margin:0;display:block}
.feed-video-mute{
  position:absolute;right:10px;bottom:10px;z-index:4;
  width:34px;height:34px;border:0;border-radius:50%;padding:0;
  display:grid;place-items:center;color:#fff;
  background:rgba(16,16,16,.62);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 2px 10px rgba(0,0,0,.22);
  touch-action:manipulation;cursor:pointer;
  transition:opacity 160ms ease, transform 160ms var(--spring);
}
.feed-video-mute:active{transform:scale(.91)}
.feed-video-mute svg{width:18px;height:18px;display:block}
.media.feed-media-stable:has(.media-filter-restore) .feed-video-mute{bottom:52px}
.media.blurred .feed-video-play,.media.blurred .feed-video-expand,.media.blurred .feed-video-mute{opacity:0;pointer-events:none}
.media.feed-media-stable.chrome-hidden .feed-video-play,
.media.feed-media-stable.chrome-hidden .feed-video-mute,
.media.feed-media-stable.chrome-hidden .feed-video-expand,
.media.feed-media-stable.chrome-hidden .media-filter-restore{opacity:0;pointer-events:none}

/* Video detail controls: simple bottom transport bar like the reference clip. */
.media-video-center{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:66px;height:66px;border-radius:50%;
  display:none;place-items:center;
  background:rgba(20,20,20,.60);color:#fff;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  pointer-events:none;
  transition:opacity 140ms ease, transform 180ms var(--spring);
  z-index:3;
}
.media-video-center svg{width:27px;height:27px;margin:0;display:block}
.media-video-center.playing{opacity:0;transform:translate(-50%,-50%) scale(.88)}
.media-video-controls{
  position:absolute;
  left:18px;right:18px;
  bottom:calc(var(--safe-b) + 18px);
  z-index:5;
  display:grid;
  grid-template-columns:34px minmax(0,1fr) 34px;
  align-items:center;
  gap:10px;
  padding:5px 0;
  color:#fff;
  background:transparent;
}
.media-video-toggle,.media-video-sound-toggle{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;
  filter:drop-shadow(0 1px 4px rgba(0,0,0,.55));
  touch-action:manipulation;
}
.media-video-toggle:active,.media-video-sound-toggle:active{transform:scale(.88)}
.media-video-toggle svg,.media-video-sound-toggle svg{width:23px;height:23px;display:block}
.media-video-range{
  --video-progress:0%;
  min-width:0;width:100%;height:32px;margin:0;padding:0;background:transparent;
  -webkit-appearance:none;appearance:none;touch-action:none;cursor:pointer;
}
.media-video-range::-webkit-slider-runnable-track{
  height:4px;border-radius:999px;
  background:linear-gradient(to right,#fff 0 var(--video-progress),rgba(255,255,255,.34) var(--video-progress) 100%);
  box-shadow:0 1px 3px rgba(0,0,0,.25);
}
.media-video-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;margin-top:-4px;border:0;
  box-shadow:0 1px 4px rgba(0,0,0,.32);
}
.media-video-range::-moz-range-track{height:4px;border-radius:999px;background:rgba(255,255,255,.34)}
.media-video-range::-moz-range-progress{height:4px;border-radius:999px;background:#fff}
.media-video-range::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:0}
/* v8.6: the whole video transport bar mirrors the dark theme in light mode. */
[data-theme="light"] .media-video-controls{color:#111}
[data-theme="light"] .media-video-toggle,
[data-theme="light"] .media-video-sound-toggle{
  color:#111;
  filter:drop-shadow(0 1px 3px rgba(255,255,255,.75));
}
[data-theme="light"] .media-video-range::-webkit-slider-runnable-track{
  background:linear-gradient(to right,#111 0 var(--video-progress),rgba(17,17,17,.32) var(--video-progress) 100%);
  box-shadow:0 1px 3px rgba(255,255,255,.18);
}
[data-theme="light"] .media-video-range::-webkit-slider-thumb{background:#111;box-shadow:0 1px 4px rgba(0,0,0,.24)}
[data-theme="light"] .media-video-range::-moz-range-track{background:rgba(17,17,17,.32)}
[data-theme="light"] .media-video-range::-moz-range-progress{background:#111}
[data-theme="light"] .media-video-range::-moz-range-thumb{background:#111}
@media (max-width:420px){
  .media-video-controls{left:16px;right:16px;grid-template-columns:32px minmax(0,1fr) 32px;gap:9px}
  .media-video-toggle,.media-video-sound-toggle{width:32px;height:32px}
}


/* v5.0: unloaded DM media keeps a lightweight box until it nears the viewport. */
.dm-media-lazy{
  width:230px; max-width:100%; height:156px;
  border-radius:16px;
  display:grid; place-items:center;
  background:var(--card-2); border:1px solid var(--line-soft);
  color:var(--muted); font-size:12px;
}
.dm-media-lazy[style*="aspect-ratio"]{height:auto}
.dm-media-lazy-video{height:132px}
.dm-media-lazy-audio{height:52px; border-radius:14px}

/* voice note */
.aplayer{
  display:flex; align-items:center; gap:12px; margin-top:11px;
  padding:11px 14px; border-radius:16px;
  background:var(--field); border:1px solid var(--line-soft);
  min-width:190px;
}
.apbtn{
  width:36px;height:36px;border-radius:50%; flex:0 0 auto; display:grid;place-items:center;
  background:var(--accent); color:var(--accent-ink);
  transition:transform var(--dur-2) var(--spring);
}
.apbtn:active{transform:scale(.88)}
.apwave{flex:1 1 auto; display:flex; align-items:center; gap:2.5px; height:26px; overflow:hidden}
.apwave i{flex:1 1 auto; min-width:2px; border-radius:2px; background:var(--ink-3); opacity:.42}
.apwave i.on{background:var(--accent-deep); opacity:1}
[data-theme="dark"] .apwave i.on{background:var(--accent)}
.aptime{flex:0 0 auto; font-size:12px; font-weight:700; color:var(--ink-3); font-variant-numeric:tabular-nums}

/* composer attachment strip */
.attachrow{display:flex; gap:9px; margin-top:16px; flex-wrap:nowrap}
/* v2.40.1 の「雑談」「相談」チップと同じ外枠・色。文字だけ外してアイコンを中央に置く。 */
.attbtn{
  flex:0 0 auto;
  display:inline-grid; place-items:center;
  padding:9px 16px; border-radius:999px;
  border:1.5px solid var(--line); color:var(--ink-2); background:transparent;
  transition:transform var(--dur-2) var(--spring), background-color var(--dur-2) var(--ease-out), border-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out);
}
.attbtn svg{width:20px;height:20px}
.attbtn:active{transform:scale(.93)}
.attbtn[disabled]{opacity:.4}
/* 投稿・返信: 添付ボタンの見た目は変えず、配置だけ参考画像に寄せる */
.compose-input-grid{
  display:grid;
  grid-template-columns:40px minmax(0,1fr);
  column-gap:12px;
  align-items:start;
}
.compose-input-rail{
  grid-column:1;
  grid-row:1;
  align-self:stretch;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.compose-input-rail .av{
  width:40px !important;
  height:40px !important;
  flex:0 0 40px;
}
.compose-input-line{
  width:3px;
  flex:1 1 auto;
  min-height:76px;
  margin-top:9px;
  margin-bottom:20px;
  border-radius:999px;
  background:var(--line);
}
.compose-input-main{
  grid-column:2;
  min-width:0;
}
.compose-text{
  width:100%;
  min-height:130px;
  font-size:17px;
  font-weight:600;
  line-height:1.7;
  resize:none;
  border:0;
  outline:none;
  box-shadow:none;
}
.compose-text:focus,.compose-text:focus-visible{
  border:0;
  outline:none;
  box-shadow:none;
}
.compose-tools{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:6px;
}
.compose-tools .attachrow{
  margin-top:0;
}
.compose-count{
  margin-left:auto;
  text-align:right;
  font-size:12px;
  color:var(--ink-3);
  font-weight:700;
  white-space:nowrap;
}
.attpreview{position:relative; margin-top:14px}
.attpreview .x{
  position:absolute; top:10px; right:10px; width:30px;height:30px;border-radius:50%;
  background:rgba(12,11,9,.62); color:#fff; display:grid;place-items:center; z-index:2;
  transition:transform var(--dur-2) var(--spring);
}
.attpreview .x:active{transform:scale(.86)}

/* recorder sheet */
.rec-face{display:grid; place-items:center; gap:6px; padding:14px 0 4px}
.rec-dot{
  width:76px;height:76px;border-radius:50%;
  background:#E0245E; display:grid;place-items:center; color:#fff;
  box-shadow:0 8px 26px rgba(224,36,94,.4);
  transition:transform 420ms var(--spring), background-color var(--dur-2) linear;
}
.rec-dot.on{animation:recPulse 1.5s ease-in-out infinite}
.rec-dot:active{transform:scale(.9)}
@keyframes recPulse{0%,100%{box-shadow:0 8px 26px rgba(224,36,94,.4)}50%{box-shadow:0 8px 26px rgba(224,36,94,.4),0 0 0 16px rgba(224,36,94,.10)}}
.rec-time{font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.02em}
.rec-hint{font-size:12.5px; color:var(--ink-3); font-weight:600}
.rec-bars{display:flex; align-items:center; justify-content:center; gap:3px; height:34px; width:100%; padding:0 20px}
.rec-bars i{flex:1 1 auto; background:var(--accent); border-radius:2px; height:4px; transition:height 90ms linear}

/* ---------- settings ---------- */
.group{margin:18px 16px 0}
.group>h4{margin:0 0 8px 6px; font-size:12px; font-weight:800; color:var(--ink-3); letter-spacing:.04em}
.gcard{background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden;
  box-shadow:var(--shadow-card);
  transition:background-color var(--dur-3) var(--ease-out), border-color var(--dur-3) var(--ease-out)}
.gitem{
  position:relative; overflow:hidden;
  display:flex; align-items:center; gap:14px; padding:14px 16px; width:100%; text-align:left;
  transition:background-color var(--dur-2) var(--ease-out);
}
.gitem+.gitem{border-top:1px solid var(--line-soft)}
.gitem:active{background:var(--field)}
.gitem .gi{flex:0 0 auto; color:var(--ink-2); display:grid;place-items:center}
.gitem .gt{flex:1 1 auto; min-width:0}
.gitem .gt b{display:block; font-size:14.5px; font-weight:800}
.gitem .gt span{display:block; font-size:12.5px; color:var(--ink-3); font-weight:600; margin-top:1px}
.chev{color:var(--ink-3); flex:0 0 auto; transition:transform var(--dur-2) var(--ease-out)}
.gitem:active .chev{transform:translateX(3px)}

.sw{
  flex:0 0 auto; width:50px;height:30px;border-radius:999px; background:var(--field);
  border:1px solid var(--line); position:relative;
  transition:background-color 380ms var(--ease-out), border-color 380ms var(--ease-out);
}
.sw::after{
  content:""; position:absolute; top:2px; left:2px; width:24px;height:24px;border-radius:50%;
  background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.22);
  transition:transform 420ms var(--spring), width 200ms var(--ease-out);
}
.sw:active::after{width:29px}
.sw.on{background:var(--accent); border-color:var(--accent)}
.sw.on::after{transform:translateX(20px)}
.sw.on:active::after{transform:translateX(15px)}

.radio{
  flex:0 0 auto; width:22px;height:22px;border-radius:50%;
  border:2px solid var(--line); position:relative;
  transition:border-color 320ms var(--ease-out);
}
.radio::after{
  content:""; position:absolute; inset:3px; border-radius:50%; background:var(--accent);
  transform:scale(0); transition:transform 420ms var(--spring);
}
.radio.on{border-color:var(--accent-deep)}
[data-theme="dark"] .radio.on{border-color:var(--accent)}
.radio.on::after{transform:scale(1)}

/* ---------- profile banner (X-style header) ---------- */
.banner{
  position:relative; height:132px; overflow:hidden;
  background-size:cover; background-position:center;
  transition:background-color var(--dur-3) var(--ease-out);
}
.banner::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.10) 100%);
}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.prof.under{padding-top:0; margin-top:-44px; position:relative; z-index:1}
.prof.under .av{border:4px solid var(--bg); box-shadow:0 8px 26px rgba(0,0,0,.16);
  transition:border-color var(--dur-3) var(--ease-out)}
.banner-edit{
  position:relative; border-radius:16px; overflow:hidden; height:118px; margin-top:2px;
  background-size:cover; background-position:center;
}
.banner-edit .campin{right:10px; bottom:10px; border-width:0}

/* ---------- image cropper ---------- */
.crop{
  position:absolute; inset:0; z-index:95; background:#0C0C0C; color:#F5F3EF;
  display:flex; flex-direction:column;
  transform:translate3d(0,100%,0);
  transition:transform 480ms var(--spring-soft);
}
.crop.on{transform:none}
.crop-bar{
  display:flex; align-items:center; gap:8px;
  padding:calc(var(--safe-t) + 10px) 14px 12px;
}
.crop-bar .ttl{flex:1; text-align:center; font-size:16px; font-weight:800; color:#F5F3EF}
.crop-bar button{font-size:15px; font-weight:800; padding:8px 6px; color:#F5F3EF; white-space:nowrap;
  transition:transform var(--dur-2) var(--spring), opacity var(--dur-1) linear}
.crop-bar button:active{transform:scale(.92); opacity:.6}
.crop-bar .go{color:var(--accent)}
.crop-stagewrap{flex:1 1 auto; display:grid; place-items:center; padding:0 16px; min-height:0}
.crop-stage{
  position:relative; overflow:hidden; touch-action:none; cursor:grab;
  background:#171717; max-width:100%;
}
.crop-stage:active{cursor:grabbing}
.crop-stage img{
  position:absolute; left:50%; top:50%; transform-origin:0 0;
  will-change:transform; user-select:none; -webkit-user-drag:none; pointer-events:none;
  max-width:none;
}
.crop-mask{position:absolute; inset:0; pointer-events:none}
.crop-mask .hole{position:absolute; inset:0; box-shadow:0 0 0 9999px rgba(10,10,10,.62)}
.crop-mask .hole.round{border-radius:50%}
.crop-mask .grid{position:absolute; inset:0; opacity:.34}
.crop-mask .grid i{position:absolute; background:#fff}
.crop-mask .grid i.v{top:0;bottom:0;width:1px} .crop-mask .grid i.h{left:0;right:0;height:1px}
.crop-tools{padding:18px 26px calc(var(--safe-b) + 26px)}
.crop-hint{text-align:center; font-size:12.5px; font-weight:600; color:#9A958E; margin:0 0 16px}
.zoomrow{display:flex; align-items:center; gap:14px}
.zoomrow svg{color:#9A958E; flex:0 0 auto}
.zoomrow input[type=range]{
  flex:1; -webkit-appearance:none; appearance:none; height:4px; border-radius:2px;
  background:#3A3733; outline:none;
}
.zoomrow input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:26px;height:26px;border-radius:50%; background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.5); cursor:pointer;
}
.zoomrow input[type=range]::-moz-range-thumb{
  width:26px;height:26px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.5);
}
.imgrow{display:flex; gap:10px; justify-content:center; margin-top:14px}
.imgrow .ghostbtn{margin:0}
.dangerlink{background:none; color:#E0245E; font-size:13.5px; font-weight:800; padding:9px 18px; border-radius:999px;
  transition:transform var(--dur-2) var(--spring)}
.dangerlink:active{transform:scale(.93)}

/* ---------- edit profile ---------- */
.editwrap{padding:22px 18px calc(var(--safe-b) + 40px)}
.avpick{display:grid; place-items:center; position:relative; width:112px; margin:0 auto}
.avpick .av{box-shadow:0 8px 24px rgba(0,0,0,.10)}
.campin{
  position:absolute; right:-2px; bottom:6px; width:36px;height:36px;border-radius:50%;
  background:var(--ink-2); color:#fff; display:grid;place-items:center;
  border:3px solid var(--bg);
  transition:transform var(--dur-2) var(--spring), background-color var(--dur-3) var(--ease-out);
}
.campin:active{transform:scale(.86)}
.ghostbtn{
  display:block; margin:14px auto 0; background:var(--field); border-radius:999px;
  padding:9px 20px; font-size:13.5px; font-weight:800;
  transition:transform var(--dur-2) var(--spring), background-color var(--dur-2) var(--ease-out);
}
.ghostbtn:active{transform:scale(.93)}
.hint{margin:8px 0 0; text-align:center; font-size:11.5px; color:var(--ink-3); font-weight:600}
.pick-h{margin:22px 0 12px; text-align:center; font-size:14px; font-weight:800}
.swatches{display:flex; gap:14px; justify-content:center}
.genderpick{display:flex; gap:10px; justify-content:center}
.gopt{
  display:flex; align-items:center; gap:8px;
  padding:10px 18px; border-radius:999px;
  border:1.5px solid var(--line); color:var(--ink-2);
  font-size:14px; font-weight:700;
  transition:transform var(--dur-2) var(--spring), border-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out), background-color var(--dur-2) var(--ease-out);
}
.gopt:active{transform:scale(.93)}
.gopt.on{border-color:var(--accent); background:var(--field); color:var(--ink)}
.g-secret{background:var(--field); color:var(--ink-3)}
.sw-dot{
  width:44px;height:44px;border-radius:50%; position:relative;
  display:grid;place-items:center; color:#fff;
  box-shadow:inset 0 0 0 2px var(--bg), 0 0 0 2px var(--line);
  transition:transform 460ms var(--spring), box-shadow 340ms var(--ease-out);
}
.sw-dot:active{transform:scale(.86)}
.sw-dot svg{opacity:0; transform:scale(.4); transition:opacity 260ms var(--ease-out), transform 420ms var(--spring)}
.sw-dot.on{box-shadow:inset 0 0 0 3px var(--bg), 0 0 0 2.5px var(--ink); transform:scale(1.06)}
.sw-dot.on svg{opacity:1; transform:none}
.field{
  background:var(--field); border-radius:16px; padding:12px 15px 9px; margin-top:14px;
  border:1.5px solid transparent;
  transition:border-color var(--dur-2) var(--ease-out), background-color var(--dur-3) var(--ease-out);
}
.field:focus-within{border-color:var(--accent)}
.field label{display:block; font-size:11.5px; font-weight:800; color:var(--ink-2)}
.field .fin{display:flex; align-items:center; gap:6px; margin-top:3px}
.field input,.field textarea{width:100%; font-size:17px; font-weight:700; letter-spacing:-.01em}
.field textarea{resize:none; min-height:74px; font-size:16px; line-height:1.65}
.field .at{font-size:17px; font-weight:700; color:var(--ink-3)}
.field .cnt{display:block; text-align:right; font-size:11px; color:var(--ink-3); font-weight:700; margin-top:2px}
.field .sub{display:block; text-align:right; font-size:11px; color:var(--ink-3); font-weight:600}
.doc{padding:18px 20px 50px}
.doc section{margin-bottom:26px}
.doc h3{margin:0 0 8px; font-size:15.5px; font-weight:800}
.doc p{margin:0; font-size:14.5px; font-weight:500; line-height:1.85; color:var(--ink-2)}
.safety{display:flex; align-items:center; gap:9px; margin-top:20px; font-size:12px; color:var(--ink-3); font-weight:600}
#composeM .safety,#replyM .safety{gap:7px;font-size:11.5px;white-space:nowrap}
#composeM .safety span,#replyM .safety span{white-space:nowrap}
#composeM .safety svg,#replyM .safety svg{width:16px;height:16px;flex:0 0 auto}

/* ============ FIRST RUN ============ */
.first-setup{
  position:absolute; inset:0; z-index:110;
  display:flex; flex-direction:column;
  overflow-y:auto; overscroll-behavior:contain;
  padding:calc(var(--safe-t) + 22px) 22px calc(var(--safe-b) + 22px);
  background:var(--bg);
}
.first-setup-inner{
  width:min(100%,370px);
  margin:auto;
  padding:8px 0 16px;
}
.first-setup-brand{
  margin-bottom:34px;
  font-family:"Snell Roundhand","Segoe Script","Brush Script MT",cursive;
  font-size:28px; font-weight:600; letter-spacing:.01em;
  line-height:1;
  text-align:center;
}
.first-setup h1{
  margin:0 0 28px;
  font-size:28px; line-height:1.3; letter-spacing:-.035em;
}
.first-name-label{
  display:block;
  margin:0 0 7px 0;
  color:var(--ink-3);
  font-size:11px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:lowercase;
}
.first-name-row{
  position:relative;
  height:48px;
  border-bottom:1.5px solid var(--line);
  transition:border-color var(--dur-2) var(--ease-out);
}
.first-name-row:focus-within{border-bottom-color:var(--ink)}
.first-name-row input{
  width:100%; height:100%;
  padding:0 44px 0 2px;
  font-size:18px; font-weight:700;
  letter-spacing:-.015em;
  color:var(--ink);
}
.first-name-row input::placeholder{color:var(--ink-3); font-weight:600}
.first-name-count{
  position:absolute;
  right:2px;
  bottom:8px;
  color:var(--ink-3);
  font-size:10px;
  font-weight:700;
  line-height:1;
  pointer-events:none;
}
.first-setup .pick-h{
  margin:28px 0 10px;
  text-align:left;
  color:var(--ink-3);
  font-size:11px;
  font-weight:800;
  letter-spacing:.08em;
}
.first-setup .genderpick{margin-top:9px}
.first-setup .hint{
  margin:8px 2px 0;
  text-align:left;
  font-size:11.5px;
  color:var(--ink-3);
  font-weight:600;
  line-height:1.65;
}
.first-setup .profile-note{margin-top:2px}
.first-setup .bigbtn{
  margin-top:30px;
  border-radius:14px;
  padding:14px;
  box-shadow:none;
}
.first-setup .textlink{
  margin-top:2px;
  padding:12px;
  font-size:13.5px;
}
.first-setup.busy{pointer-events:none}
.first-setup.busy .bigbtn,.first-setup.busy .textlink{opacity:.48}
.first-setup.busy .bigbtn::after{
  content:""; display:inline-block; width:14px; height:14px; margin-left:9px;
  border:2px solid rgba(36,30,5,.28); border-top-color:var(--accent-ink);
  border-radius:50%; vertical-align:-2px; animation:sp .7s linear infinite;
}

/* ============ OVERLAYS ============ */
.scrim{
  position:absolute; inset:0; z-index:88; background:rgba(14,12,8,.42);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  opacity:0; pointer-events:none;
  transition:opacity 340ms var(--ease-out);
}
.scrim.on{opacity:1; pointer-events:auto}
.sheet{
  position:absolute; left:0; right:0; bottom:0; z-index:90;
  background:var(--bg-elev); border-radius:26px 26px 0 0;
  padding:10px 22px calc(var(--safe-b) + 20px);
  box-shadow:var(--shadow-pop);
  transform:translate3d(0,110%,0);
  transition:transform 520ms var(--spring-soft);
  will-change:transform; touch-action:none;
}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line); margin:0 auto 14px}
.sheet-ico{
  width:64px;height:64px;border-radius:20px; margin:6px auto 0;
  background:var(--accent); color:var(--accent-ink); display:grid;place-items:center;
  box-shadow:var(--glow);
  animation:icoIn 620ms var(--spring) both;
}
[data-theme="dark"] .sheet-ico{background:#F5DE86}
@keyframes icoIn{from{transform:scale(.4) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:16px 0 0; text-align:center; font-size:21px; font-weight:800; line-height:1.45; letter-spacing:-.01em}
.sheet .lead{margin:10px 0 0; text-align:center; font-size:12.5px; color:var(--ink-3); font-weight:600; line-height:1.75}
.bigbtn{
  display:block; width:100%; margin-top:18px; padding:15px; border-radius:15px;
  background:var(--accent); color:var(--accent-ink); font-size:15px; font-weight:800; text-align:center;
  box-shadow:0 6px 18px rgba(228,180,28,.32);
  transition:transform 420ms var(--spring), opacity var(--dur-2) linear;
}
.bigbtn:active{transform:scale(.965)}
.bigbtn.danger{background:#E0245E; color:#fff; box-shadow:0 6px 18px rgba(224,36,94,.34)}
.textlink{display:block; width:100%; margin-top:6px; padding:14px; font-size:14.5px; font-weight:700; color:var(--ink-2); text-align:center;
  transition:transform var(--dur-2) var(--spring)}
.textlink:active{transform:scale(.95)}
.obox{
  border:1.5px solid var(--line); border-radius:16px; padding:12px 15px 8px; margin-top:18px;
  transition:border-color var(--dur-2) var(--ease-out);
}
.obox:focus-within{border-color:var(--accent)}
.obox label{font-size:11.5px; font-weight:800}
.obox label i{font-style:normal; color:var(--ink-3); font-weight:700; font-size:11px; margin-left:4px}
.obox textarea{width:100%; margin-top:6px; min-height:62px; resize:none; font-size:15.5px; font-weight:600; line-height:1.6}
.obox textarea::placeholder{color:var(--ink-3)}
/* the notes stay centred; inside the box every line starts at the same edge */
.request-sheet .req-note{margin-top:5px; font-size:11.5px}
.request-sheet .obox{padding:12px 15px 8px}
.request-sheet .obox label,
.request-sheet .obox textarea{display:block; margin-left:0; padding-left:0; text-indent:0}

/* action menu */
.menu{
  position:absolute; left:14px; right:14px; bottom:calc(var(--safe-b) + 14px); z-index:90;
  transform:translate3d(0,20px,0) scale(.97); opacity:0; pointer-events:none;
  transition:transform 460ms var(--spring-soft), opacity 260ms var(--ease-out);
}
.menu.on{transform:none; opacity:1; pointer-events:auto}
.menu .mcard{background:var(--bg-elev); border-radius:18px; overflow:hidden; box-shadow:var(--shadow-pop)}
.menu button{display:block; width:100%; padding:16px; font-size:15.5px; font-weight:700; text-align:center;
  transition:background-color var(--dur-1) linear}
.menu button:active{background:var(--field)}
.menu button+button{border-top:1px solid var(--line-soft)}
.menu .danger{color:#E0245E; font-weight:800}
.menu .mcard.solo{margin-top:9px}
.menu .mcard.solo button{font-weight:800}


/* ---------- post upload status (Threads-style, above bottom nav) ---------- */
.post-upload-status{
  position:absolute;
  left:16px; right:16px;
  bottom:calc(var(--safe-b) + 94px);
  z-index:115;
  min-height:62px;
  display:flex; align-items:center; gap:12px;
  padding:10px 13px 10px 14px;
  border-radius:20px;
  color:var(--ink);
  background:var(--nav);
  border:1px solid var(--glass-line);
  -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
  box-shadow:0 12px 34px rgba(0,0,0,.18), inset 0 1px 0 var(--glass-edge);
  opacity:0; transform:translate3d(0,18px,0) scale(.985);
  pointer-events:none;
  transition:opacity 220ms var(--ease-out), transform 420ms var(--spring-soft);
}
.post-upload-status.on{opacity:1; transform:none; pointer-events:auto}
.post-upload-status.bye{opacity:0; transform:translate3d(0,10px,0) scale(.99); pointer-events:none}
.post-upload-status .pus-mark{
  flex:0 0 38px; width:38px; height:38px; border-radius:50%;
  display:grid; place-items:center;
  background:var(--field); border:1px solid var(--line-soft); color:var(--ink-2);
}
.post-upload-status .pus-ring{
  width:20px; height:20px; border-radius:50%;
  border:2.5px solid currentColor; border-right-color:transparent;
  animation:pusSpin .8s linear infinite;
}
.post-upload-status.done .pus-ring{animation:none; border:0; width:22px; height:22px}
.post-upload-status.done .pus-ring::before{content:'✓'; display:block; font-size:19px; line-height:22px; font-weight:900; text-align:center}
.post-upload-status.failed .pus-ring{animation:none; border:0; width:22px; height:22px}
.post-upload-status.failed .pus-ring::before{content:'!'; display:block; font-size:19px; line-height:22px; font-weight:900; text-align:center}
.post-upload-status .pus-copy{min-width:0; flex:1; display:flex; flex-direction:column; gap:2px}
.post-upload-status .pus-copy b{font-size:15px; font-weight:800; letter-spacing:.01em}
.post-upload-status .pus-copy span{font-size:11.5px; font-weight:650; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.post-upload-status .pus-view{
  flex:0 0 auto; min-width:58px; height:40px; padding:0 10px;
  display:grid; place-items:center;
  font-size:14px; font-weight:850; color:var(--ink);
  border-radius:14px;
  transition:transform var(--dur-2) var(--spring), background-color var(--dur-2) var(--ease-out);
}
.post-upload-status .pus-view:active{transform:scale(.92); background:var(--field)}
@keyframes pusSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.post-upload-status .pus-ring{animation-duration:1.5s}}

/* toast */
.toastwrap{position:absolute; left:0;right:0; bottom:calc(var(--safe-b) + 96px); z-index:120;
  display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none}
.toast{
  display:inline-flex; align-items:center; gap:9px;
  background:var(--toast-bg); color:var(--toast-ink);
  padding:11px 20px; border-radius:999px; font-size:13.5px; font-weight:800;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  animation:toastIn 560ms var(--spring) both;
}
.toast.bye{animation:toastOut 300ms var(--ease-in-out) forwards}
@keyframes toastIn{from{opacity:0; transform:translate3d(0,26px,0) scale(.9)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0; transform:translate3d(0,14px,0) scale(.95)}}

/* compose modal */
.modal{
  position:absolute; inset:0; z-index:80; background:var(--bg);
  display:flex; flex-direction:column;
  transform:translate3d(0,100%,0);
  transition:transform 500ms var(--spring-soft);
  will-change:transform;
}
.modal.on{transform:none}
.tagpick{
  display:grid; grid-template-columns:1.45fr repeat(4,minmax(0,1fr));
  gap:6px; margin-top:4px; width:100%;
}
.tagopt{
  min-width:0; padding:9px 4px; border-radius:10px; font-size:12.5px; font-weight:800;
  border:1.5px solid var(--line); color:var(--ink-2); white-space:nowrap;
  transition:transform var(--dur-2) var(--spring), background-color var(--dur-2) var(--ease-out), border-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out);
}
.tagopt:active{transform:scale(.92)}
.tagopt.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}

/* misc */
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(0,0,0,.16);border-top-color:var(--accent-ink);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.fadein{animation:fadeIn 420ms var(--ease-out) both}
