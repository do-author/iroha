<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FAF8F4">
<title>iroha</title>
<style>
/* ============================================================
   iroha v2.0  —  design tokens
   ============================================================ */
:root{
  --accent:#F7CE45;
  --accent-deep:#E4B41C;
  --accent-ink:#241E05;

  --bg:#FAF8F4;
  --bg-elev:#FFFFFF;
  --bar:rgba(250,248,244,.52);
  --card:#FFFFFF;
  --card-2:#F5F2EC;
  --line:#EDE8E0;
  --line-soft:#F2EEE7;
  --ink:#1A1917;
  --ink-2:#5C574F;
  --ink-3:#A6A099;
  --field:#F3F0EA;
  --nav:rgba(255,255,255,.48);
  --nav-ring:rgba(252,251,248,.9);
  --nav-pill:#1A1917;
  --nav-pill-ink:var(--accent);
  --shadow-card:0 1px 2px rgba(28,24,16,.04);
  --shadow-nav:0 8px 30px rgba(40,34,20,.13), 0 2px 6px rgba(40,34,20,.06);
  --shadow-pop:0 18px 48px rgba(30,26,16,.20);
  --glow:none;
  --skel:linear-gradient(90deg,#F0ECE5 0%,#F8F5F0 40%,#F0ECE5 80%);
  --glass:saturate(200%) blur(38px);
  --glass-edge:rgba(255,255,255,.72);
  --glass-line:rgba(120,110,90,.14);
  --fresh-wash:rgba(247,206,69,.10);
  --toast-bg:#1A1917; --toast-ink:#fff;

  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-in-out:cubic-bezier(.65,0,.35,1);
  --spring:cubic-bezier(.34,1.42,.5,1);
  --spring-soft:cubic-bezier(.2,.9,.28,1.06);
  --dur-1:140ms; --dur-2:220ms; --dur-3:340ms; --dur-4:480ms;

  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --accent:#FBD34D;
  --accent-deep:#F5C21F;
  --accent-ink:#241E05;

  --bg:#0B0B0B;
  --bg-elev:#141414;
  --bar:rgba(13,13,13,.44);
  --card:#151414;
  --card-2:#1D1C1A;
  --line:#272524;
  --line-soft:#1E1D1B;
  --ink:#F7F5F1;
  --ink-2:#B4AEA6;
  --ink-3:#7E7972;
  --field:#1B1A18;
  --nav:rgba(28,27,25,.44);
  --nav-ring:rgba(30,29,27,.92);
  --nav-pill:#F3EFE6;
  --nav-pill-ink:#705816;
  --shadow-card:0 1px 2px rgba(0,0,0,.4);
  --shadow-nav:0 10px 34px rgba(0,0,0,.62);
  --shadow-pop:0 22px 60px rgba(0,0,0,.7);
  --glow:0 0 22px rgba(251,211,77,.34);
  --skel:linear-gradient(90deg,#1A1918 0%,#232120 40%,#1A1918 80%);
  --glass:saturate(190%) blur(38px);
  --glass-edge:rgba(255,255,255,.10);
  --glass-line:rgba(255,255,255,.10);
  --fresh-wash:rgba(251,211,77,.07);
  --toast-bg:#F3EFE6; --toast-ink:#171614;
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
  font-size:15px; line-height:1.62;
  letter-spacing:.01em;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  transition:background-color var(--dur-3) var(--ease-out), color var(--dur-3) var(--ease-out);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:none}
:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px;border-radius:8px}
.msgfield:focus-visible,.replyfield:focus-visible,.field input:focus-visible,
.field textarea:focus-visible,.obox textarea:focus-visible{outline:none}
.msgfield,.replyfield{
  -webkit-appearance:none; appearance:none;
  resize:none; overflow-y:auto; scrollbar-width:none;
}
.msgfield::-webkit-scrollbar,.replyfield::-webkit-scrollbar{display:none;width:0;height:0}
.msgfield::-webkit-resizer,.replyfield::-webkit-resizer{display:none}

/* ---------- app frame ---------- */
#app{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  overflow:hidden;
  max-width:520px; margin:0 auto;
  background:var(--bg);
  transition:background-color var(--dur-3) var(--ease-out);
}
.layer{position:absolute; inset:0; display:flex; flex-direction:column; background:var(--bg);
  transition:background-color var(--dur-3) var(--ease-out)}

/* ============ TAB LAYER ============ */
.tabs-root{position:absolute; inset:0}
.tabpane{
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  opacity:0; visibility:hidden;
  transform:translate3d(0,10px,0) scale(.994);
  transition:opacity 110ms var(--ease-out), transform 170ms var(--ease-out), visibility 0s linear 170ms;
}
.tabpane.on{opacity:1; visibility:visible; transform:none; transition:opacity 170ms var(--ease-out), transform 260ms var(--spring-soft), visibility 0s;}
.tabpane.leaving{transform:translate3d(0,-8px,0) scale(.994)}

/* ---------- header ---------- */
.appbar{
  position:absolute; top:0; left:0; right:0; z-index:6;
  padding:calc(var(--safe-t) + 10px) 18px 12px;
  background:var(--bar);
  -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
  box-shadow:inset 0 1px 0 var(--glass-edge);
  border-bottom:1px solid transparent;
  transition:border-color var(--dur-3) var(--ease-out), background-color var(--dur-3) var(--ease-out);
}
.appbar.stuck{border-bottom-color:var(--glass-line)}
.appbar-row{display:flex; align-items:center; gap:12px; min-height:34px}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:auto}
.brand-dot{
  width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle at 34% 32%,#FFF0B4,var(--accent) 62%,var(--accent-deep));
  box-shadow:var(--glow);
  align-self:center; flex:0 0 auto;
  animation:dotIn 900ms var(--spring) both;
}
@keyframes dotIn{0%{transform:scale(.2) rotate(-90deg);opacity:0}100%{transform:none;opacity:1}}
.brand-name{font-size:26px; font-weight:800; letter-spacing:-.035em; line-height:1}
.brand-ver{font-size:11px; font-weight:700; color:var(--ink-3); letter-spacing:.02em}
.iconbtn{
  width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center; color:var(--ink);
  transition:transform var(--dur-2) var(--spring), background-color var(--dur-1) linear;
}
.iconbtn:active{transform:scale(.86); background:var(--field)}
.ttl{font-size:16px;font-weight:800;letter-spacing:.01em}

/* ---------- composer ---------- */
.composer{
  margin:14px 0 0; width:100%;
  display:flex; align-items:center; gap:10px;
  background:var(--field); border-radius:16px;
  padding:13px 16px; text-align:left; color:var(--ink-3);
  font-size:14.5px; font-weight:500;
  transition:transform var(--dur-2) var(--spring), background-color var(--dur-3) var(--ease-out), box-shadow var(--dur-2) var(--ease-out);
}
.composer span{flex:1}
.composer:active{transform:scale(.978)}

/* ---------- filter chips ---------- */
.chiprow{
  display:flex; gap:9px; margin-top:13px;
  overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none;
  padding:2px 18px; margin-left:-18px; margin-right:-18px;
  scroll-behavior:smooth;
}
.chiprow::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; padding:9px 19px; border-radius:999px;
  background:var(--field); color:var(--ink); font-size:14px; font-weight:700;
  transition:transform var(--dur-2) var(--spring), background-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out), box-shadow var(--dur-3) var(--ease-out);
}
.chip:active{transform:scale(.93)}
.chip.on{background:var(--accent); color:var(--accent-ink); box-shadow:var(--glow)}

/* ---------- scroller ---------- */
.scroll{
  flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  padding:calc(var(--barH,124px) + 12px) 12px calc(var(--safe-b) + 116px);
  scrollbar-width:none;
}
.scroll.withbar{padding-bottom:calc(var(--barB,66px) + 16px)}
.scroll::-webkit-scrollbar{display:none}
.scroll.flush{padding-left:0;padding-right:0}

/* ---------- pull to refresh ---------- */
.ptr{
  position:absolute; left:0; right:0; top:calc(var(--barH,124px) + 10px);
  display:grid; place-items:center; pointer-events:none; z-index:3;
}
.ptr-ring{
  width:32px;height:32px;border-radius:50%;
  background:var(--bg-elev); box-shadow:0 3px 12px rgba(0,0,0,.14);
  display:grid; place-items:center; color:var(--ink-3);
  opacity:0; transform:scale(.5);
  transition:opacity 160ms linear, box-shadow 220ms var(--ease-out), color 220ms linear;
}
.ptr-ring.ready{color:var(--accent-deep)}
[data-theme="dark"] .ptr-ring.ready{color:var(--accent)}
.ptr-ring .arc{transform-origin:50% 50%}
.ptr-ring.busy{color:var(--accent-deep)}
[data-theme="dark"] .ptr-ring.busy{color:var(--accent)}
.ptr-ring.busy .arc{animation:sp .68s linear infinite}
.pull-host{transition:transform 460ms var(--spring-soft)}

/* ---------- post card ---------- */
.card{
  background:var(--card); border:1px solid var(--line);
  border-radius:20px; padding:16px 17px 13px; margin-bottom:12px;
  box-shadow:var(--shadow-card);
  transition:transform var(--dur-2) var(--ease-out), background-color var(--dur-3) var(--ease-out), border-color var(--dur-3) var(--ease-out);
}
.card.tap:active{transform:scale(.988)}
.p-head{display:flex; align-items:flex-start; gap:15px}
.av{flex:0 0 auto; border-radius:50%; overflow:hidden; display:block; background:var(--card-2);
  transition:transform var(--dur-2) var(--spring)}
.av:active{transform:scale(.92)}
.av svg{display:block;width:100%;height:100%}
.p-meta{flex:1 1 auto; min-width:0}
.p-line{display:flex; align-items:center; gap:5px; flex-wrap:nowrap; line-height:1.35; min-width:0}
.p-name{font-size:15px; font-weight:800; letter-spacing:-.01em; white-space:nowrap; flex:0 0 auto}
.gtag{
  flex:0 0 auto; width:18px; height:18px; border-radius:50%;
  display:inline-grid; place-items:center;
  font-size:12px; font-weight:700; line-height:1;
  transition:background-color var(--dur-3) var(--ease-out);
}
.g-male{background:rgba(74,124,180,.16); color:#4A7CB4}
.g-female{background:rgba(196,96,132,.16); color:#C46084}
.gtag .gender-svg{display:block;width:12px;height:12px}
[data-theme="dark"] .g-male{background:rgba(122,166,214,.18); color:#7AA6D6}
[data-theme="dark"] .g-female{background:rgba(224,138,170,.18); color:#E08AAA}
.badge-demo{
  flex:0 0 auto;
  display:inline-flex; align-items:center; gap:4px;
  background:var(--field); color:var(--ink-2); border:1px solid var(--line);
  font-size:10.5px; font-weight:700; letter-spacing:.06em;
  padding:3px 10px; border-radius:999px;
}
.badge-bot{
  flex:0 0 auto;
  display:inline-flex; align-items:center; gap:4px;
  background:rgba(228,180,28,.20); color:#8A6B14;
  font-size:11px; font-weight:700; letter-spacing:.05em;
  padding:3.5px 10px; border-radius:999px;
}
[data-theme="dark"] .gtag{
  flex:0 0 auto; width:18px; height:18px; border-radius:50%;
  display:inline-grid; place-items:center;
  font-size:12px; font-weight:700; line-height:1;
  transition:background-color var(--dur-3) var(--ease-out);
}
.g-male{background:rgba(74,124,180,.16); color:#4A7CB4}
.g-female{background:rgba(196,96,132,.16); color:#C46084}
[data-theme="dark"] .g-male{background:rgba(122,166,214,.18); color:#7AA6D6}
[data-theme="dark"] .g-female{background:rgba(224,138,170,.18); color:#E08AAA}
.badge-demo{
  flex:0 0 auto;
  display:inline-flex; align-items:center; gap:4px;
  background:var(--field); color:var(--ink-2); border:1px solid var(--line);
  font-size:10.5px; font-weight:700; letter-spacing:.06em;
  padding:3px 10px; border-radius:999px;
}
.badge-bot{background:#4A3D14;color:var(--accent)}
.p-time{font-size:13px; white-space:nowrap; color:var(--ink-3); font-weight:500}
.dot-sep{width:3.5px; height:3.5px; border-radius:50%; background:var(--ink-3);
  display:inline-block; margin:0 4px; flex:0 0 auto; align-self:center}
.p-more{margin-left:auto; width:34px;height:22px; display:grid;place-items:center; color:var(--ink-3);
  transition:transform var(--dur-2) var(--spring), color var(--dur-2) linear}
.p-more:active{transform:scale(.8); color:var(--ink)}
.p-body{margin:9px 0 0; font-size:16px; font-weight:600; line-height:1.64; letter-spacing:.005em; word-break:break-word; white-space:pre-wrap}
.p-full .p-body{padding-left:0}
.p-col{flex:1 1 auto; min-width:0}
.tag{
  display:inline-block; margin-top:9px;
  font-size:12.5px; font-weight:700; line-height:1.25; padding:4px 11px; border-radius:9px;
}
.tag-hitorigoto{background:#F6F0DC;color:#7B6A42}
.tag-soudan{background:#EDE9F7;color:#625787}
.tag-zatsudan{background:#E7F0E8;color:#4E6B54}
.tag-shitsumon{background:#F5ECE7;color:#87614F}
.tag-shumi{background:#E6EFF6;color:#4B6075}
.tag-arch{background:var(--field);color:var(--ink-3)}
.p-foot{display:flex; align-items:center; gap:22px; margin-top:9px}
.act{
  display:inline-flex; align-items:center; gap:8px;
  font-size:14px; font-weight:700; color:var(--ink-3);
  padding:6px 2px; border-radius:10px;
  transition:color var(--dur-2) var(--ease-out), transform var(--dur-2) var(--spring);
}
.act:active{transform:scale(.9)}
.act.liked{color:#E24A6B}
.act.liked svg{fill:#E24A6B; stroke:#E24A6B}
.act .hb{display:inline-grid; place-items:center; position:relative}
.act.pop .hb{animation:heartPop 560ms var(--spring)}
@keyframes heartPop{
  0%{transform:scale(1)} 22%{transform:scale(.78)} 48%{transform:scale(1.36)} 70%{transform:scale(.94)} 100%{transform:scale(1)}
}
.burst{position:absolute; inset:-14px; pointer-events:none; overflow:visible; font-size:0; line-height:0}
.burst i{
  position:absolute; left:50%; top:50%; width:3.5px;height:3.5px;border-radius:2px;
  background:#E24A6B; opacity:0;
}
.act.pop .burst i{animation:sparkle 640ms var(--ease-out) forwards}
@keyframes sparkle{
  0%{opacity:0; transform:translate(-50%,-50%) scale(.3)}
  25%{opacity:1}
  100%{opacity:0; transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.5)}
}
.talkbtn{
  margin-left:auto; display:inline-flex; align-items:center; gap:8px;
  border:1px solid var(--line); border-radius:999px;
  padding:9px 17px; font-size:14px; font-weight:800; color:var(--ink);
  transition:transform var(--dur-2) var(--spring), background-color var(--dur-2) var(--ease-out), border-color var(--dur-2) var(--ease-out);
}
.talkbtn:active{transform:scale(.92); background:var(--field)}
.talkbtn.done{border-color:var(--accent); background:var(--accent); color:var(--accent-ink)}

/* entrance stagger */
.stagger{opacity:0; transform:translate3d(0,16px,0)}
.stagger.in{animation:riseIn 330ms var(--spring-soft) both}
@keyframes riseIn{from{opacity:0;transform:translate3d(0,18px,0) scale(.985)}to{opacity:1;transform:none}}

/* ---------- skeleton ---------- */
.sk{border-radius:8px; background:var(--skel); background-size:220% 100%; animation:shimmer 1.35s linear infinite}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}

/* ---------- empty ---------- */
.empty{padding:64px 30px; text-align:center; animation:riseIn 300ms var(--spring-soft) both}
.empty h3{margin:0 0 8px; font-size:15px; font-weight:800}
.empty p{margin:0; font-size:13px; color:var(--ink-3); font-weight:600; line-height:1.8}

/* ============ BOTTOM NAV ============ */
.navwrap{
  position:absolute; left:0; right:0; bottom:0; z-index:40;
  padding:0 34px calc(var(--safe-b) + 18px);
  pointer-events:none;
  transition:transform var(--dur-3) var(--ease-out), opacity var(--dur-2) var(--ease-out);
}
.navwrap.hide{transform:translate3d(0,120%,0); opacity:0}
.nav{
  position:relative; pointer-events:auto;
  height:63px; border-radius:999px;
  background:var(--nav);
  -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
  box-shadow:var(--shadow-nav), inset 0 1px 0 var(--glass-edge);
  display:grid; grid-template-columns:repeat(5,1fr); align-items:center;
  border:1px solid var(--glass-line);
  transform-origin:50% 50%;
  will-change:transform,opacity;
  transition:background-color var(--dur-3) var(--ease-out), border-color var(--dur-3) var(--ease-out);
}
.nav-ind{
  position:absolute; top:6px; height:52px; width:54px; border-radius:18px;
  background:var(--nav-pill); left:0;
  transition:transform 520ms var(--spring), background-color var(--dur-3) var(--ease-out), width 380ms var(--ease-out);
  will-change:transform;
}

.navbtn{
  position:relative; will-change:transform,opacity; height:100%; display:grid; place-items:center; color:var(--ink);
  transition:color 300ms var(--ease-out), transform var(--dur-2) var(--spring);
}
.navbtn svg{width:30px;height:30px}
.navbtn.on svg *{stroke-width:2.6}
.navbtn:active{transform:scale(.86)}
.navbtn.on{color:var(--nav-pill-ink)}
.navbtn .bdg{
  position:absolute; top:7px; right:calc(50% - 25px);
  min-width:18px;height:18px;padding:0 5px; border-radius:9px;
  background:#E0245E; color:#fff; font-size:10.5px; font-weight:800;
  display:grid;place-items:center; line-height:1;
  box-shadow:0 0 0 2px rgba(255,255,255,.55);
  animation:bdgIn 520ms var(--spring) both;
}
/* unread notifications keep the yellow language, but show how many */
.navbtn .bdg.soft{
  top:8px; right:calc(50% - 23px);
  background:var(--accent); color:var(--accent-ink);
  box-shadow:0 0 0 2.5px var(--nav-ring), 0 0 8px rgba(247,206,69,.5);
}
@keyframes bdgIn{from{transform:scale(0)}to{transform:none}}
.fabslot{display:grid;place-items:center; position:relative; z-index:2}
.fab{
  position:absolute; top:-5px; left:0; width:62px;height:62px;
  display:grid;place-items:center; pointer-events:auto; z-index:5;
  will-change:transform;
}
.fab-core{
  width:62px;height:62px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#FFE27E,var(--accent) 60%,var(--accent-deep));
  color:var(--accent-ink); display:grid;place-items:center;
  box-shadow:0 6px 18px rgba(228,180,28,.42), var(--glow);
  transition:transform 320ms var(--spring), box-shadow var(--dur-3) var(--ease-out);
  will-change:transform;
}
.fab:active .fab-core{transform:scale(.86)}
.fab svg{transition:transform 460ms var(--spring)}
.fab.x svg{transform:rotate(135deg)}


/* ============ STACK SCREENS ============ */
.stack{position:absolute; inset:0; z-index:50; pointer-events:none}
.screen{
  position:absolute; inset:0; pointer-events:auto;
  background:var(--bg); display:flex; flex-direction:column;
  transform:translate3d(100%,0,0);
  box-shadow:-14px 0 40px rgba(0,0,0,.13);
  transition:transform 420ms var(--ease-out);
  will-change:transform;
}
.screen.in{transform:none}
.screen.out{transform:translate3d(100%,0,0)}
.tabs-root{transition:transform 420ms var(--ease-out), filter 420ms var(--ease-out)}
.tabs-root.pushed{transform:translate3d(-22%,0,0) ; filter:brightness(.94)}
[data-theme="dark"] .tabs-root.pushed{filter:brightness(.7)}

.navbar{
  position:absolute; top:0; left:0; right:0; z-index:6;
  display:flex; align-items:center; gap:6px;
  padding:calc(var(--safe-t) + 8px) 10px 12px;
  background:var(--bar);
  -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
  box-shadow:inset 0 1px 0 var(--glass-edge);
  border-bottom:1px solid transparent;
  transition:border-color var(--dur-3) var(--ease-out), background-color var(--dur-3) var(--ease-out);
}
.navbar.stuck{border-bottom-color:var(--glass-line)}
.navbar .ttl{flex:1 1 auto; text-align:center}
.navbar .side{min-width:44px; display:flex; justify-content:center; flex:0 0 auto}
.txtbtn{padding:8px 10px; white-space:nowrap; font-size:14.5px; font-weight:700; border-radius:10px;
  transition:transform var(--dur-2) var(--spring), opacity var(--dur-1) linear}
.txtbtn:active{transform:scale(.92); opacity:.6}
.txtbtn.accent{color:var(--accent-deep); font-weight:800}
[data-theme="dark"] .txtbtn.accent{color:var(--accent)}
.txtbtn[disabled]{opacity:.35}

/* ---------- profile ---------- */
.prof{padding:26px 20px 0; text-align:center}
.prof .av{margin:0 auto 14px; box-shadow:0 6px 22px rgba(0,0,0,.08); animation:avIn 380ms var(--spring) both}
.prof.noanim .av{animation:none}
@keyframes avIn{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.prof h2{margin:0; font-size:23px; font-weight:800; letter-spacing:-.02em;
  display:flex; align-items:center; justify-content:center; gap:8px}
.prof h2 .gtag{width:22px;height:22px;font-size:14px}
.prof h2 .gtag .gender-svg{width:14px;height:14px}
.prof .handle{margin:2px 0 0; font-size:14px; color:var(--ink-3); font-weight:600}
.pill-official{
  display:inline-flex; align-items:center; gap:5px; margin-top:11px;
  background:var(--accent); color:var(--accent-ink);
  font-size:12px; font-weight:800; padding:5px 12px; border-radius:999px;
}
[data-theme="dark"] .pill-official{background:#4A3D14;color:var(--accent)}
.prof .bio{margin:13px 0 0; font-size:14.5px; font-weight:700; line-height:1.8; white-space:pre-wrap}
.prof-actions{display:flex; gap:12px; justify-content:center; margin-top:18px}
.obtn{
  display:inline-flex; align-items:center; gap:8px;
  border:1px solid var(--line); border-radius:999px;
  padding:11px 22px; font-size:14px; font-weight:800;
  transition:transform var(--dur-2) var(--spring), background-color var(--dur-2) var(--ease-out), border-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out);
}
.obtn:active{transform:scale(.93)}
.obtn.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.obtn.on svg{fill:var(--accent-ink); stroke:var(--accent-ink)}
.obtn.wide{width:100%; justify-content:center; padding:12px}
.note{margin:11px 0 0; font-size:11.5px; color:var(--ink-3); font-weight:600}
.stats{
  display:grid; grid-template-columns:repeat(3,1fr); margin:20px 20px 0;
  border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  padding:16px 0;
}
.stat{text-align:center; position:relative}
.stat+.stat::before{content:""; position:absolute; left:0; top:6px;bottom:6px; width:1px; background:var(--line)}
.stat b{display:block; font-size:20px; font-weight:800; letter-spacing:-.02em}
.stat span{font-size:12px; color:var(--ink-3); font-weight:700}

/* underline tabs */
.utabs{position:relative; display:flex; margin:6px 20px 0; border-bottom:1px solid var(--line)}
.utab{flex:1; padding:14px 0; font-size:14px; font-weight:800; color:var(--ink-3);
  transition:color 300ms var(--ease-out)}
.utab.on{color:var(--ink)}
.utab small{font-size:12px; color:var(--ink-3); margin-left:5px; font-weight:700}
.uind{position:absolute; bottom:-1px; left:0; height:2.5px; border-radius:2px; background:var(--accent-deep);
  transition:transform 460ms var(--spring), width 380ms var(--ease-out)}
[data-theme="dark"] .uind{background:var(--accent)}

/* segmented */
.seg{position:relative; display:flex; margin:12px 16px 0; background:var(--field); border-radius:14px; padding:4px}
.segbtn{flex:1; padding:10px 0; font-size:14px; font-weight:800; color:var(--ink-3); z-index:1;
  transition:color 300ms var(--ease-out)}
.segbtn.on{color:var(--ink)}
.segbtn small{font-size:11.5px; color:var(--ink-3); margin-left:5px; font-weight:800}
.segbtn.on small{color:var(--accent-deep)}
[data-theme="dark"] .segbtn.on small{color:var(--accent)}
.segind{position:absolute; top:4px; bottom:4px; left:4px; border-radius:11px; background:var(--bg-elev);
  box-shadow:0 1px 4px rgba(0,0,0,.09);
  transition:transform 480ms var(--spring), width 340ms var(--ease-out)}

/* ---------- list rows ---------- */
.row{
  position:relative; overflow:hidden;
  display:flex; align-items:flex-start; gap:13px;
  padding:16px 18px; border-bottom:1px solid var(--line-soft);
  transition:background-color var(--dur-2) var(--ease-out);
}
.row:active{background:var(--field)}
.row.tapable{cursor:pointer}
.row-main{flex:1 1 auto; min-width:0}
.row-t{font-size:15.5px; font-weight:800; line-height:1.5; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.pinmark{color:var(--ink-3); display:inline-flex}
.avhit{flex:0 0 auto; display:block; border-radius:50%;
  transition:transform var(--dur-2) var(--spring)}
.avhit:active{transform:scale(.9)}
.row-s{margin-top:3px; font-size:14.5px; color:var(--ink-3); font-weight:600; line-height:1.6;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.row-r{flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; gap:7px; padding-top:2px}
.time-s{font-size:13px; color:var(--ink-3); font-weight:600}
.unread{
  min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:#E0245E;color:#fff;
  font-size:12px;font-weight:800; display:grid;place-items:center; line-height:1;
}
.ripple{position:absolute; border-radius:50%; background:currentColor; opacity:.10; transform:scale(0);
  animation:rip 620ms var(--ease-out) forwards; pointer-events:none}
@keyframes rip{to{transform:scale(2.6); opacity:0}}

/* ---------- search ---------- */
.searchbar{
  flex:1 1 auto; display:flex; align-items:center; gap:9px;
  background:var(--field); border-radius:13px; padding:10px 13px;
  transition:background-color var(--dur-3) var(--ease-out), box-shadow var(--dur-2) var(--ease-out);
}
.searchbar:focus-within{box-shadow:inset 0 0 0 1.5px var(--accent)}
.searchbar input:focus-visible{outline:none}
.searchbar input{flex:1; font-size:14.5px; font-weight:600; min-width:0}
.searchbar input::placeholder{color:var(--ink-3)}
.row.fresh{background:var(--fresh-wash)}
.row.fresh::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--accent);
}
.newchip{
  display:inline-block; margin-right:7px; vertical-align:1px;
  background:var(--accent); color:var(--accent-ink);
  font-size:10.5px; font-weight:800; letter-spacing:.04em;
  padding:2px 8px; border-radius:999px;
}
.segdot{
  display:inline-block; margin-left:6px; vertical-align:2px;
  width:7px; height:7px; border-radius:50%; background:var(--accent);
  box-shadow:0 0 6px rgba(247,206,69,.6);
}
.segbtn{position:relative}
.segbtn small.has-new{color:var(--accent-deep); font-weight:800}
[data-theme="dark"] .segbtn small.has-new{color:var(--accent)}
.sec-h{padding:16px 18px 8px; font-size:12px; font-weight:800; color:var(--ink-3); letter-spacing:.04em}

/* ---------- chat thread ---------- */
.thread{flex:1 1 auto; overflow-y:auto; scrollbar-width:none;
  padding:calc(var(--barH,90px) + 14px) 14px calc(var(--barB,66px) + 16px);
  display:flex; flex-direction:column; gap:4px; overscroll-behavior-y:contain}
.thread::-webkit-scrollbar{display:none}
.msgrow{display:flex; align-items:flex-end; gap:8px; margin-top:8px}
.msgrow.me{flex-direction:row-reverse}
.msgrow .av{align-self:flex-end}
.bub{
  max-width:74%; padding:11px 14px; border-radius:19px;
  font-size:14.5px; font-weight:600; line-height:1.68; word-break:break-word;
  background:var(--card-2); border:1px solid var(--line-soft);
  border-bottom-left-radius:7px;
  animation:bubIn 480ms var(--spring-soft) both;
  transition:background-color var(--dur-3) var(--ease-out), border-color var(--dur-3) var(--ease-out);
}
.msgrow.me .bub{
  background:var(--accent); color:var(--accent-ink); border-color:transparent;
  border-bottom-left-radius:19px; border-bottom-right-radius:7px;
}
@keyframes bubIn{from{opacity:0; transform:translate3d(0,12px,0) scale(.94)}to{opacity:1;transform:none}}
.mtime{font-size:10.5px; color:var(--ink-3); font-weight:600; align-self:flex-end; padding-bottom:3px; flex:0 0 auto}
.syschip{
  align-self:center; margin:10px 0 2px;
  display:inline-flex; align-items:center; gap:9px;
  background:var(--card-2); border:1px solid var(--line-soft);
  color:var(--ink-2); font-size:13px; font-weight:700;
  padding:10px 18px; border-radius:999px;
  animation:bubIn 420ms var(--spring-soft) both;
  transition:background-color var(--dur-3) var(--ease-out), border-color var(--dur-3) var(--ease-out);
}
.syschip .t{color:var(--ink-3); font-size:12px; font-weight:600}
.daychip{align-self:center; margin:14px 0 4px; font-size:11.5px; font-weight:800; color:var(--ink-3);
  background:var(--field); padding:5px 13px; border-radius:999px}
.typing{display:inline-flex; gap:4px; align-items:center; padding:14px 16px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:blink 1.25s infinite}
.typing i:nth-child(2){animation-delay:.16s} .typing i:nth-child(3){animation-delay:.32s}
@keyframes blink{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.composer-bar{
  position:absolute; left:0; right:0; bottom:0; z-index:6;
  display:flex; align-items:flex-end; gap:9px;
  padding:10px 12px calc(var(--safe-b) + 10px);
  background:var(--bar); border-top:1px solid var(--glass-line);
  -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
  transition:background-color var(--dur-3) var(--ease-out), border-color var(--dur-3) var(--ease-out);
}
.msgfield{
  flex:1; background:var(--field); border-radius:20px; padding:10px 15px;
  font-size:15px; font-weight:600; resize:none; max-height:120px; line-height:1.5;
  transition:background-color var(--dur-3) var(--ease-out), box-shadow var(--dur-2) var(--ease-out);
}
.msgfield:focus{box-shadow:inset 0 0 0 1.5px var(--accent)}
.sendbtn{
  width:38px;height:38px;border-radius:50%; display:grid;place-items:center; flex:0 0 auto;
  color:var(--ink-3);
  transition:transform 420ms var(--spring), color var(--dur-2) linear, background-color var(--dur-2) linear;
}
.sendbtn.live{color:var(--accent-ink); background:var(--accent); box-shadow:var(--glow)}
.sendbtn:active{transform:scale(.84)}

/* ---------- post detail (X-style) ---------- */
.pd-card{background:var(--bg-elev); padding:16px 18px 0;
  transition:background-color var(--dur-3) var(--ease-out)}
.pd-head{display:flex; align-items:center; gap:12px}
.pd-head .who{flex:1 1 auto; min-width:0; line-height:1.3}
.pd-head .who b{display:flex; align-items:center; gap:5px; font-size:16px; font-weight:800; letter-spacing:-.005em}
.pd-head .who > span{display:block; font-size:13px; color:var(--ink-3); font-weight:600; margin-top:1px}
.pd-body{margin:16px 0 0; font-size:18px; font-weight:700; line-height:1.62; letter-spacing:.002em; white-space:pre-wrap; word-break:break-word}
.pd-card .tag{margin-top:12px}
.pd-stats{display:flex; align-items:center; gap:22px; margin-top:14px;
  padding:13px 0; border-top:1px solid var(--line)}
.pd-stat{display:inline-flex; align-items:center; gap:9px; font-size:14.5px; font-weight:700; color:var(--ink-3);
  transition:color var(--dur-2) var(--ease-out), transform var(--dur-2) var(--spring)}
.pd-stat:active{transform:scale(.92)}
.pd-stat.liked{color:#E24A6B}
.pd-stat.liked svg{fill:#E24A6B; stroke:#E24A6B}
.pd-stat .hb{display:inline-grid; place-items:center; position:relative}
.pd-stat.pop .hb{animation:heartPop 560ms var(--spring)}
.pd-stat.pop .burst i{animation:sparkle 640ms var(--ease-out) forwards}
.pd-sep{height:1px; background:var(--line)}
.rep-empty{padding:52px 24px; text-align:center; font-size:14.5px; font-weight:700; color:var(--ink-3); line-height:2}
.rep{display:flex; gap:14px; padding:16px 17px; border-bottom:1px solid var(--line-soft)}
.rep-main{flex:1 1 auto; min-width:0}
.rep-line{display:flex; align-items:center; gap:6px; flex-wrap:wrap; line-height:1.3}
.rep-line b{font-size:15px; font-weight:800}
.rep-line > span:not(.gtag){font-size:13px; color:var(--ink-3); font-weight:600}
.rep-body{margin:6px 0 0; font-size:16px; font-weight:600; line-height:1.6; white-space:pre-wrap; word-break:break-word}
.rep-foot{margin-top:8px; display:flex; align-items:center; gap:16px}
.mention{color:var(--accent-deep); font-weight:800}
[data-theme="dark"] .mention{color:var(--accent)}
.replying{
  display:flex; align-items:center; gap:8px;
  padding:9px 14px; margin:0 14px -2px;
  background:var(--field); border-radius:14px 14px 0 0;
  font-size:12.5px; font-weight:700; color:var(--ink-2);
  animation:riseIn 240ms var(--spring-soft) both;
}
.replying b{color:var(--ink)}
.replying .x{margin-left:auto; width:24px;height:24px;border-radius:50%;
  display:grid;place-items:center; color:var(--ink-3);
  transition:transform var(--dur-2) var(--spring), background-color var(--dur-1) linear}
.replying .x:active{transform:scale(.85); background:var(--line)}
.rep.fresh{animation:repIn 620ms var(--spring-soft) both}
@keyframes repIn{from{opacity:0; transform:translate3d(0,-10px,0) scale(.97)}to{opacity:1;transform:none}}

/* ---------- reply composer (mirrors DM bar) ---------- */
.reply-dock{
  position:absolute; left:0; right:0; bottom:0; z-index:6;
  background:var(--bar);
  -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
  border-top:1px solid var(--glass-line);
  transition:background-color var(--dur-3) var(--ease-out), border-color var(--dur-3) var(--ease-out);
}
.reply-dock .reply-bar{position:static; background:none; border-top:0; -webkit-backdrop-filter:none; backdrop-filter:none}
.reply-dock .replying{margin:10px 14px 0; border-radius:14px}
.reply-bar{
  position:absolute; left:0; right:0; bottom:0; z-index:6;
  display:flex; align-items:flex-end; gap:10px;
  padding:10px 14px calc(var(--safe-b) + 10px);
  background:var(--bar); border-top:1px solid var(--glass-line);
  -webkit-backdrop-filter:var(--glass); backdrop-filter:var(--glass);
  transition:background-color var(--dur-3) var(--ease-out), border-color var(--dur-3) var(--ease-out);
}
.reply-bar .av{align-self:center}
.replyfield{
  flex:1; background:var(--field); border:1px solid var(--line); border-radius:20px;
  padding:10px 16px; font-size:15px; font-weight:600; resize:none; max-height:120px; line-height:1.55;
  transition:background-color var(--dur-3) var(--ease-out), border-color var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out);
}
.replyfield::placeholder{color:var(--ink-3)}
.replyfield:focus{border-color:var(--accent); box-shadow:none}
.replysend{
  width:40px;height:40px;border-radius:50%; flex:0 0 auto; align-self:center;
  display:grid;place-items:center;
  background:rgba(247,206,69,.34); color:var(--ink-3);
  transition:transform 420ms var(--spring), background-color 300ms var(--ease-out), color 260ms var(--ease-out), box-shadow 300ms var(--ease-out);
}
[data-theme="dark"] .replysend{background:rgba(251,211,77,.18)}
.replysend.live{background:var(--accent); color:var(--accent-ink); box-shadow:0 4px 14px rgba(228,180,28,.4), var(--glow)}
.replysend:active{transform:scale(.85)}
.replysend.fly svg{animation:planeFly 520ms var(--ease-out)}
@keyframes planeFly{
  0%{transform:none} 35%{transform:translate3d(-5px,4px,0) scale(.86)}
  100%{transform:translate3d(26px,-22px,0) scale(.5); opacity:0}
}

/* ---------- settings ---------- */
.group{margin:18px 16px 0}
.group>h4{margin:0 0 8px 6px; font-size:12px; font-weight:800; color:var(--ink-3); letter-spacing:.04em}
.gcard{background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden;
  box-shadow:var(--shadow-card);
  transition:background-color var(--dur-3) var(--ease-out), border-color var(--dur-3) var(--ease-out)}
.gitem{
  position:relative; overflow:hidden;
  display:flex; align-items:center; gap:14px; padding:14px 16px; width:100%; text-align:left;
  transition:background-color var(--dur-2) var(--ease-out);
}
.gitem+.gitem{border-top:1px solid var(--line-soft)}
.gitem:active{background:var(--field)}
.gitem .gi{flex:0 0 auto; color:var(--ink-2); display:grid;place-items:center}
.gitem .gt{flex:1 1 auto; min-width:0}
.gitem .gt b{display:block; font-size:14.5px; font-weight:800}
.gitem .gt span{display:block; font-size:12.5px; color:var(--ink-3); font-weight:600; margin-top:1px}
.chev{color:var(--ink-3); flex:0 0 auto; transition:transform var(--dur-2) var(--ease-out)}
.gitem:active .chev{transform:translateX(3px)}

.sw{
  flex:0 0 auto; width:50px;height:30px;border-radius:999px; background:var(--field);
  border:1px solid var(--line); position:relative;
  transition:background-color 380ms var(--ease-out), border-color 380ms var(--ease-out);
}
.sw::after{
  content:""; position:absolute; top:2px; left:2px; width:24px;height:24px;border-radius:50%;
  background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.22);
  transition:transform 420ms var(--spring), width 200ms var(--ease-out);
}
.sw:active::after{width:29px}
.sw.on{background:var(--accent); border-color:var(--accent)}
.sw.on::after{transform:translateX(20px)}
.sw.on:active::after{transform:translateX(15px)}

.radio{
  flex:0 0 auto; width:22px;height:22px;border-radius:50%;
  border:2px solid var(--line); position:relative;
  transition:border-color 320ms var(--ease-out);
}
.radio::after{
  content:""; position:absolute; inset:3px; border-radius:50%; background:var(--accent);
  transform:scale(0); transition:transform 420ms var(--spring);
}
.radio.on{border-color:var(--accent-deep)}
[data-theme="dark"] .radio.on{border-color:var(--accent)}
.radio.on::after{transform:scale(1)}

/* ---------- profile banner (X-style header) ---------- */
.banner{
  position:relative; height:132px; overflow:hidden;
  background-size:cover; background-position:center;
  transition:background-color var(--dur-3) var(--ease-out);
}
.banner::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.10) 100%);
}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.prof.under{padding-top:0; margin-top:-44px; position:relative; z-index:1}
.prof.under .av{border:4px solid var(--bg); box-shadow:0 8px 26px rgba(0,0,0,.16);
  transition:border-color var(--dur-3) var(--ease-out)}
.banner-edit{
  position:relative; border-radius:16px; overflow:hidden; height:118px; margin-top:2px;
  background-size:cover; background-position:center;
}
.banner-edit .campin{right:10px; bottom:10px; border-width:0}

/* ---------- image cropper ---------- */
.crop{
  position:absolute; inset:0; z-index:95; background:#0C0C0C; color:#F5F3EF;
  display:flex; flex-direction:column;
  transform:translate3d(0,100%,0);
  transition:transform 480ms var(--spring-soft);
}
.crop.on{transform:none}
.crop-bar{
  display:flex; align-items:center; gap:8px;
  padding:calc(var(--safe-t) + 10px) 14px 12px;
}
.crop-bar .ttl{flex:1; text-align:center; font-size:16px; font-weight:800; color:#F5F3EF}
.crop-bar button{font-size:15px; font-weight:800; padding:8px 6px; color:#F5F3EF; white-space:nowrap;
  transition:transform var(--dur-2) var(--spring), opacity var(--dur-1) linear}
.crop-bar button:active{transform:scale(.92); opacity:.6}
.crop-bar .go{color:var(--accent)}
.crop-stagewrap{flex:1 1 auto; display:grid; place-items:center; padding:0 16px; min-height:0}
.crop-stage{
  position:relative; overflow:hidden; touch-action:none; cursor:grab;
  background:#171717; max-width:100%;
}
.crop-stage:active{cursor:grabbing}
.crop-stage img{
  position:absolute; left:50%; top:50%; transform-origin:0 0;
  will-change:transform; user-select:none; -webkit-user-drag:none; pointer-events:none;
  max-width:none;
}
.crop-mask{position:absolute; inset:0; pointer-events:none}
.crop-mask .hole{position:absolute; inset:0; box-shadow:0 0 0 9999px rgba(10,10,10,.62)}
.crop-mask .hole.round{border-radius:50%}
.crop-mask .grid{position:absolute; inset:0; opacity:.34}
.crop-mask .grid i{position:absolute; background:#fff}
.crop-mask .grid i.v{top:0;bottom:0;width:1px} .crop-mask .grid i.h{left:0;right:0;height:1px}
.crop-tools{padding:18px 26px calc(var(--safe-b) + 26px)}
.crop-hint{text-align:center; font-size:12.5px; font-weight:600; color:#9A958E; margin:0 0 16px}
.zoomrow{display:flex; align-items:center; gap:14px}
.zoomrow svg{color:#9A958E; flex:0 0 auto}
.zoomrow input[type=range]{
  flex:1; -webkit-appearance:none; appearance:none; height:4px; border-radius:2px;
  background:#3A3733; outline:none;
}
.zoomrow input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:26px;height:26px;border-radius:50%; background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.5); cursor:pointer;
}
.zoomrow input[type=range]::-moz-range-thumb{
  width:26px;height:26px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.5);
}
.imgrow{display:flex; gap:10px; justify-content:center; margin-top:14px}
.imgrow .ghostbtn{margin:0}
.dangerlink{background:none; color:#E0245E; font-size:13.5px; font-weight:800; padding:9px 18px; border-radius:999px;
  transition:transform var(--dur-2) var(--spring)}
.dangerlink:active{transform:scale(.93)}

.editwrap{padding:22px 18px calc(var(--safe-b) + 40px)}
.avpick{display:grid; place-items:center; position:relative; width:112px; margin:0 auto}
.avpick .av{box-shadow:0 8px 24px rgba(0,0,0,.10)}
.campin{
  position:absolute; right:-2px; bottom:6px; width:36px;height:36px;border-radius:50%;
  background:var(--ink-2); color:#fff; display:grid;place-items:center;
  border:3px solid var(--bg);
  transition:transform var(--dur-2) var(--spring), background-color var(--dur-3) var(--ease-out);
}
.campin:active{transform:scale(.86)}
.ghostbtn{
  display:block; margin:14px auto 0; background:var(--field); border-radius:999px;
  padding:9px 20px; font-size:13.5px; font-weight:800;
  transition:transform var(--dur-2) var(--spring), background-color var(--dur-2) var(--ease-out);
}
.ghostbtn:active{transform:scale(.93)}
.hint{margin:8px 0 0; text-align:center; font-size:11.5px; color:var(--ink-3); font-weight:600}
.pick-h{margin:22px 0 12px; text-align:center; font-size:14px; font-weight:800}
.swatches{display:flex; gap:14px; justify-content:center}
.genderpick{display:flex; gap:10px; justify-content:center}
.gopt{
  display:flex; align-items:center; gap:8px;
  padding:10px 18px; border-radius:999px;
  border:1.5px solid var(--line); color:var(--ink-2);
  font-size:14px; font-weight:700;
  transition:transform var(--dur-2) var(--spring), border-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out), background-color var(--dur-2) var(--ease-out);
}
.gopt:active{transform:scale(.93)}
.gopt.on{border-color:var(--accent); background:var(--field); color:var(--ink)}
.g-secret{background:var(--field); color:var(--ink-3)}
.sw-dot{
  width:44px;height:44px;border-radius:50%; position:relative;
  display:grid;place-items:center; color:#fff;
  box-shadow:inset 0 0 0 2px var(--bg), 0 0 0 2px var(--line);
  transition:transform 460ms var(--spring), box-shadow 340ms var(--ease-out);
}
.sw-dot:active{transform:scale(.86)}
.sw-dot svg{opacity:0; transform:scale(.4); transition:opacity 260ms var(--ease-out), transform 420ms var(--spring)}
.sw-dot.on{box-shadow:inset 0 0 0 3px var(--bg), 0 0 0 2.5px var(--ink); transform:scale(1.06)}
.sw-dot.on svg{opacity:1; transform:none}
.field{
  background:var(--field); border-radius:16px; padding:12px 15px 9px; margin-top:14px;
  border:1.5px solid transparent;
  transition:border-color var(--dur-2) var(--ease-out), background-color var(--dur-3) var(--ease-out);
}
.field:focus-within{border-color:var(--accent)}
.field label{display:block; font-size:11.5px; font-weight:800; color:var(--ink-2)}
.field .fin{display:flex; align-items:center; gap:6px; margin-top:3px}
.field input,.field textarea{width:100%; font-size:17px; font-weight:700; letter-spacing:-.01em}
.field textarea{resize:none; min-height:74px; font-size:16px; line-height:1.65}
.field .at{font-size:17px; font-weight:700; color:var(--ink-3)}
.field .cnt{display:block; text-align:right; font-size:11px; color:var(--ink-3); font-weight:700; margin-top:2px}
.field .sub{display:block; text-align:right; font-size:11px; color:var(--ink-3); font-weight:600}
.safety{display:flex; align-items:center; gap:9px; margin-top:20px; font-size:12px; color:var(--ink-3); font-weight:600}

.scrim{
  position:absolute; inset:0; z-index:60; background:rgba(14,12,8,.42);

  transition:opacity 340ms var(--ease-out);
}
.scrim.on{opacity:1; pointer-events:auto}
.sheet{
  position:absolute; left:0; right:0; bottom:0; z-index:70;
  background:var(--bg-elev); border-radius:26px 26px 0 0;
  padding:10px 22px calc(var(--safe-b) + 20px);

  transform:translate3d(0,110%,0);
  transition:transform 520ms var(--spring-soft);
  will-change:transform; touch-action:none;
}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line); margin:0 auto 14px}
.sheet-ico{
  width:64px;height:64px;border-radius:20px; margin:6px auto 0;

  box-shadow:var(--glow);
  animation:icoIn 620ms var(--spring) both;
}
[data-theme="dark"] .sheet-ico{background:#F5DE86}
@keyframes icoIn{from{transform:scale(.4) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:16px 0 0; text-align:center; font-size:21px; font-weight:800; line-height:1.45; letter-spacing:-.01em}
.sheet .lead{margin:10px 0 0; text-align:center; font-size:12.5px; color:var(--ink-3); font-weight:600; line-height:1.75}

}
.bigbtn:active{transform:scale(.965)}

.textlink{display:block; width:100%; margin-top:6px; padding:14px; font-size:14.5px; font-weight:700; color:var(--ink-2); text-align:center;
  transition:transform var(--dur-2) var(--spring)}
.textlink:active{transform:scale(.95)}
.obox{
  border:1.5px solid var(--line); border-radius:16px; padding:12px 15px 8px; margin-top:18px;
  transition:border-color var(--dur-2) var(--ease-out);
}
.obox:focus-within{border-color:var(--accent)}
.obox label{font-size:11.5px; font-weight:800}
.obox label i{font-style:normal; color:var(--ink-3); font-weight:700; font-size:11px; margin-left:4px}
.obox textarea{width:100%; margin-top:6px; min-height:62px; resize:none; font-size:15.5px; font-weight:600; line-height:1.6}
.obox textarea::placeholder{color:var(--ink-3)}

/* action menu */
.menu{
  position:absolute; left:14px; right:14px; bottom:calc(var(--safe-b) + 14px); z-index:70;
  transform:translate3d(0,20px,0) scale(.97); opacity:0; pointer-events:none;
  transition:transform 460ms var(--spring-soft), opacity 260ms var(--ease-out);
}
.menu.on{transform:none; opacity:1; pointer-events:auto}
.menu .mcard{background:var(--bg-elev); border-radius:18px; overflow:hidden; box-shadow:var(--shadow-pop)}
.menu button{display:block; width:100%; padding:16px; font-size:15.5px; font-weight:700; text-align:center;
  transition:background-color var(--dur-1) linear}
.menu button:active{background:var(--field)}
.menu button+button{border-top:1px solid var(--line-soft)}
.menu .danger{color:#E0245E; font-weight:800}
.menu .mcard.solo{margin-top:9px}
.menu .mcard.solo button{font-weight:800}

/* toast */
.toastwrap{position:absolute; left:0;right:0; bottom:calc(var(--safe-b) + 96px); z-index:90;
  display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none}
.toast{
  display:inline-flex; align-items:center; gap:9px;
  background:var(--toast-bg); color:var(--toast-ink);
  padding:11px 20px; border-radius:999px; font-size:13.5px; font-weight:800;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  animation:toastIn 560ms var(--spring) both;
}
.toast.bye{animation:toastOut 300ms var(--ease-in-out) forwards}
@keyframes toastIn{from{opacity:0; transform:translate3d(0,26px,0) scale(.9)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0; transform:translate3d(0,14px,0) scale(.95)}}

/* compose modal */
.modal{
  position:absolute; inset:0; z-index:80; background:var(--bg);
  display:flex; flex-direction:column;
  transform:translate3d(0,100%,0);
  transition:transform 500ms var(--spring-soft);
  will-change:transform;
}
.modal.on{transform:none}
.tagpick{display:flex; gap:9px; flex-wrap:wrap; margin-top:4px}
.tagopt{
  padding:9px 16px; border-radius:999px; font-size:13.5px; font-weight:800;
  border:1.5px solid var(--line); color:var(--ink-2);
  transition:transform var(--dur-2) var(--spring), background-color var(--dur-2) var(--ease-out), border-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out);
}
.tagopt:active{transform:scale(.92)}
.tagopt.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}

/* misc */
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(0,0,0,.16);border-top-color:var(--accent-ink);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.fadein{animation:fadeIn 420ms var(--ease-out) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}
}
</style>

    <img src="${img}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">

/* ---------- time ---------- */
function ago(ts){
  const s=Math.max(0,(Date.now()-ts)/1000);
  if(s<60) return 'たった今';
  if(s<3600) return Math.floor(s/60)+'分前';
  if(s<86400) return Math.floor(s/3600)+'時間前';
  if(s<86400*7) return Math.floor(s/86400)+'日前';
  const d=new Date(ts); return (d.getMonth()+1)+'月'+d.getDate()+'日';
}
function clock(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}

/* press and hold — used for the chat row actions */
function holdMenu(node, fn, ms=460){
  let t=null, sx=0, sy=0;
  const cancel=()=>{ if(t){ clearTimeout(t); t=null; } };
  node.addEventListener('pointerdown',e=>{
    if(e.button) return;
    sx=e.clientX; sy=e.clientY;
    cancel();
    t=setTimeout(()=>{ t=null; node.dataset.longpressed='1'; haptic(16); fn(); }, ms);
  });
  node.addEventListener('pointermove',e=>{
    if(t && (Math.abs(e.clientX-sx)>8 || Math.abs(e.clientY-sy)>8)) cancel();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>node.addEventListener(ev,cancel));
}

/* ---------- ripple ---------- */
function rippleAt(host, ev){
  const r=host.getBoundingClientRect();
  const x=(ev.clientX ?? r.left+r.width/2)-r.left;
  const y=(ev.clientY ?? r.top+r.height/2)-r.top;
  const d=Math.max(r.width,r.height);
  const s=el(`<span class="ripple" style="left:${x-d/2}px;top:${y-d/2}px;width:${d}px;height:${d}px"></span>`);
  host.appendChild(s); setTimeout(()=>s.remove(),640);
}

/* ---------- stagger reveal on scroll ---------- */
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} });
},{rootMargin:'0px 0px -6% 0px', threshold:.02});

/* QUIET marks a re-render caused by a data change rather than by the person
   arriving at a screen — nothing should animate in that case */
let QUIET=false;
function quiet(fn){ const p=QUIET; QUIET=true; try{ fn(); } finally { QUIET=p; } }

function revealAll(root, base=0, q=false){
  $$('.stagger', root).forEach((n,i)=>{
    if(q){ n.classList.add('in'); n.style.animation='none';
           n.style.opacity='1'; n.style.transform='none'; return; }
    n.style.animationDelay = Math.min(base + i*26, 240)+'ms';
    io.observe(n);
  });
}

/* ---------- scroll shadow + nav autohide ---------- */
/* the bars float above the scroller, so the scroller needs their heights */
function fitBars(root){
  const top=root.querySelector('.appbar,.navbar');
  const bot=root.querySelector('.reply-dock,.composer-bar,.reply-bar');
  const set=()=>{
    if(top && top.offsetHeight) root.style.setProperty('--barH', top.offsetHeight+'px');
    if(bot && bot.offsetHeight) root.style.setProperty('--barB', bot.offsetHeight+'px');
  };
  set(); raf(set);
  if(window.ResizeObserver){
    const ro=new ResizeObserver(set);
    if(top) ro.observe(top);
    if(bot) ro.observe(bot);
  }
}

function wireScroll(scroller, bar){
  const root = scroller.closest('.tabpane,.screen,.modal') || scroller.parentElement;
  if(root) fitBars(root);
  let last=0, lastT=performance.now(), ticking=false;
  scroller.addEventListener('scroll', ()=>{
    if(ticking) return; ticking=true;
    requestAnimationFrame(()=>{
      const y=scroller.scrollTop, now=performance.now();
      const dt=Math.max(8, now-lastT); lastT=now;
      const dy=y-last, vel=dy/dt*1000;
      if(bar) bar.classList.toggle('stuck', y>4);
      if(S.tab==='home' && !$('#stack').children.length && !$('#composeM')){
        if(y<=48) navMorph.expand(vel);
        else if(dy>2.5) navMorph.collapse(vel);
        else if(dy<-2.5) navMorph.expand(vel);
      }
      last=y; ticking=false;
    });
  },{passive:true});
}

/* =========================================================
   SPRING  —  semi-implicit Euler, sub-stepped for stability
   ========================================================= */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
class Spring{
  constructor(k=210, d=16.4, m=1){
    this.k=k; this.d=d; this.m=m; this.p=0; this.v=0; this.t=0;
    this._raf=0; this.onUpdate=null;
  }
  set(target, addVel=0){ this.t=target; this.v+=addVel; this._run(); }
  jump(x){ this.p=x; this.v=0; this.t=x; if(this.onUpdate) this.onUpdate(x,0); }
  _run(){
    if(this._raf) return;
    let last=performance.now();
    const step=(now)=>{
      const dt=Math.min(.048,(now-last)/1000)||.016; last=now;
      const n=Math.max(1,Math.ceil(dt/.005)), h=dt/n;
      for(let i=0;i<n;i++){
        const f=-this.k*(this.p-this.t)-this.d*this.v;
        this.v+=f/this.m*h; this.p+=this.v*h;
      }
      if(Math.abs(this.v)<.0015 && Math.abs(this.p-this.t)<.0015){
        this.p=this.t; this.v=0; this._raf=0;
        if(this.onUpdate) this.onUpdate(this.p,0);
        return;
      }
      if(this.onUpdate) this.onUpdate(this.p,this.v);
      this._raf=requestAnimationFrame(step);
    };
    this._raf=requestAnimationFrame(step);
  }
}

/* =========================================================
   NAV MORPH  —  the bar collapses into the FAB, which lifts
   away on an arc.  Travel matches the reference recording.
   ========================================================= */
const FAB_D=62, FAB_R=FAB_D/2;   /* circle diameter */
const PEAK_TX=1.05;              /* furthest x the damped overshoot reaches */
const OUT_DIP=4;                 /* px the FAB sags on the way out */
const BACK_LIFT=22;              /* px the FAB rises on the way home */

const navMorph=(()=>{
  const sp=new Spring(210, 16.4, 1);
  let baseX=0, dx=0, ready=false, icons=[], slotCx=0, dir=1;
  const cl01=x=>x<0?0:x>1?1:x;

  function measure(){
    const wrap=$('#navwrap'), nav=$('#nav'), slot=nav&&nav.querySelector('.fabslot'), fab=$('#fab');
    if(!wrap||!nav||!slot||!fab) return false;
    const w=wrap.getBoundingClientRect(), n=nav.getBoundingClientRect(), r=slot.getBoundingClientRect();
    if(!w.width || !n.width) return false;
    baseX = r.left - w.left + r.width/2 - FAB_R;
    /* measured off the reference photo: the "+" settles with its right edge
       8px inside the card's right edge */
    /* derive the card's right edge from the scroller's padding — reading a
       card directly can catch it mid entry-animation, where scale() lies */
    const sc=document.querySelector('#feedScroll');
    let cardR = w.width - 12;
    if(sc){
      const sb=sc.getBoundingClientRect();
      cardR = (sb.right - w.left) - parseFloat(getComputedStyle(sc).paddingRight || 12);
    }
    dx = (cardR - 8 - FAB_D) - baseX;
    /* the damped overshoot still has to stay on screen */
    dx = Math.min(dx, (w.width - 6 - FAB_D - baseX)/PEAK_TX);
    slotCx = r.left - n.left + r.width/2;
    nav.style.transformOrigin = slotCx.toFixed(1)+'px 50%';
    icons = $$('#nav .navbtn').map((elm,i)=>{
      const b=elm.getBoundingClientRect();
      return {el:elm, off:(b.left+b.width/2)-(n.left+slotCx)};
    });
    return true;
  }

  function apply(t,v){
    const fab=$('#fab'), nav=$('#nav'), core=fab&&fab.querySelector('.fab-core');
    if(!fab||!nav) return;
    const b=cl01(t);

    /* The reference clip is asymmetric: leaving the bar the FAB tracks a
       straight line (it only dips a hair), while coming home it swings up
       through a clear parabola.  bell peaks mid-flight, zero at both ends. */
    const bell = 4*b*(1-b);
    const arc  = dir===1 ? bell*OUT_DIP : bell*-BACK_LIFT;

    const swell = Math.min(Math.abs(v)*.006, .035);
    /* the full overshoot would push past the card edge — damp it in x only,
       so the bounce survives without the circle running out of room */
    const tx = t<=1 ? t : 1+(t-1)*0.45;
    fab.style.transform =
      `translate3d(${(baseX+dx*tx).toFixed(2)}px,${arc.toFixed(2)}px,0) scale(${(1-.03*b+swell).toFixed(3)})`;
    if(core) core.style.boxShadow =
      `0 ${(6+10*b).toFixed(1)}px ${(20+16*b).toFixed(1)}px rgba(196,150,10,${(.42+.14*b).toFixed(2)})`;

    /* bar: shrinks toward the FAB, sinks, and dissolves */
    nav.style.opacity   = (1-b*1.12).toFixed(3);
    nav.style.transform = `translate3d(0,${(b*24).toFixed(2)}px,0) scale(${(1-b*.09).toFixed(3)})`;
    nav.style.pointerEvents = b>.5 ? 'none' : 'auto';

    /* icons peel away outside-in, so the bar reads as folding inward */
    icons.forEach(ic=>{
      const far = Math.abs(ic.off)/110;              /* 0 = nearest the FAB */
      const local = cl01((b - (1-far)*0.07) * 2.1);
      ic.el.style.opacity = (1-local).toFixed(3);
      ic.el.style.transform = `translate3d(${(-ic.off*0.12*b).toFixed(2)}px,0,0) scale(${(1-local*.16).toFixed(3)})`;
    });
  }
  sp.onUpdate=apply;

  function init(){
    ready=measure();
    if(ready) sp.jump(0); else requestAnimationFrame(init);
  }
  return{
    init,
    refresh(){ if(measure()) apply(sp.p, sp.v); },
    /* fire only on a state change — once settled (or in flight toward the
       same target) further scrolling must not feed the spring again */
    collapse(pxVel=0){ if(!ready || sp.t===1) return;
      dir=1;
      if(REDUCED){ sp.jump(1); return; }
      sp.set(1, Math.min(Math.max(pxVel/2600,0),1.3)); },
    expand(pxVel=0){ if(!ready || sp.t===0) return;
      dir=0;
      if(REDUCED){ sp.jump(0); return; }
      sp.set(0, Math.max(Math.min(pxVel/2600,0),-1.3)); },
    _jump(t,d){ if(!ready) return; if(d!==undefined) dir=d; sp.jump(t); },
    _dbg(){ return {baseX,dx,p:sp.p,t:sp.t,v:sp.v}; }
  };
})();

function allNotes(){ return [...S.notes.like, ...S.notes.reply]; }
function unseenIn(kind){ return S.notes[kind].filter(n=>!S.noteSeen.has(n.id)).length; }
function unseenNotes(){ return unseenIn('like')+unseenIn('reply'); }
function markNotesSeen(){ allNotes().forEach(n=>S.noteSeen.add(n.id)); }

/* ids highlighted for this visit — captured before the tab is marked read,
   so the new arrivals stay visible while the counter already drops */
let noteFresh=new Set();
/* opening a tab clears only that tab: likes and replies count separately */
function openNoteSegment(kind){
  const list=S.notes[kind]||[];
  noteFresh=new Set(list.filter(n=>!S.noteSeen.has(n.id)).map(n=>n.id));
  list.forEach(n=>S.noteSeen.add(n.id));
  syncNavBadges();
}

function syncNavBadges(){
  $$('#nav .navbtn').forEach(b=>{
    b.classList.toggle('on', b.dataset.tab===S.tab);
    const dotTab = b.dataset.tab==='bell';
    let n=0;
    if(b.dataset.tab==='chat') n=S.chats.reduce((a,c)=>a+c.unread,0);
    if(dotTab) n=unseenNotes();
    let bdg=b.querySelector('.bdg');
    if(n>0){
      if(!bdg){
        bdg=el(`<span class="bdg${dotTab?' soft':''}">${n}</span>`);
        b.appendChild(bdg);                                   /* animates in once */
      }else if(bdg.textContent!==String(n)) bdg.textContent=n;  /* silent update */
    }else if(bdg) bdg.remove();
  });
}

/* =========================================================
   TAB ROUTER
   ========================================================= */
const PANES={};
function goTab(id){
  if(S.tab===id){ // tap-again → scroll to top
    const sc=PANES[id]&&PANES[id].querySelector('.scroll,.thread');
    if(sc) sc.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  const prev=PANES[S.tab];
  S.tab=id;
  if(prev){ prev.classList.add('leaving'); prev.classList.remove('on');
    setTimeout(()=>prev.classList.remove('leaving'),180); }
  const pane=PANES[id]||buildPane(id);
  raf(()=>pane.classList.add('on'));
  refreshPane(id);
  moveNavInd(true);
  syncNavBadges();
  $('#navwrap').classList.remove('hide');
  navMorph.expand();
}

function buildPane(id){

}

/* =========================================================
   STACK NAVIGATION
   ========================================================= */
const stackEls=[];
function push(node){
  $('#stack').appendChild(node);
  fitBars(node);                       /* heights are only real once attached */
  stackEls.push(node);
  $('#tabsRoot').classList.add('pushed');
  $('#navwrap').classList.add('hide');
  raf(()=>node.classList.add('in'));
  wireEdgeBack(node);
  return node;
}
function pop(){
  const node=stackEls.pop(); if(!node) return;
  node.classList.remove('in'); node.classList.add('out');
  if(!stackEls.length){
    $('#tabsRoot').classList.remove('pushed');
    $('#navwrap').classList.remove('hide');
    }
  setTimeout(()=>node.remove(),430);
  refreshPane(S.tab); syncNavBadges();
}
/* edge swipe back */
function wireEdgeBack(node){
  let sx=0, sy=0, dragging=false, w=window.innerWidth;
  node.addEventListener('touchstart',e=>{
    const t=e.touches[0];
    if(t.clientX>28) return;
    sx=t.clientX; sy=t.clientY; dragging=true; w=node.getBoundingClientRect().width;
    node.style.transition='none';
  },{passive:true});
  node.addEventListener('touchmove',e=>{
    if(!dragging) return;
    const t=e.touches[0], dx=Math.max(0,t.clientX-sx), dy=Math.abs(t.clientY-sy);
    if(dy>44 && dx<10){ dragging=false; node.style.transition=''; node.style.transform=''; return; }
    node.style.transform=`translate3d(${dx}px,0,0)`;
    const pr=Math.min(1,dx/w);
    $('#tabsRoot').style.transform=`translate3d(${-22+22*pr}%,0,0)`;
  },{passive:true});
  const end=()=>{
    if(!dragging) return; dragging=false;
    const m=/translate3d\((-?[\d.]+)px/.exec(node.style.transform);
    const dx=m?parseFloat(m[1]):0;
    node.style.transition=''; node.style.transform='';
    $('#tabsRoot').style.transform='';
    if(dx>w*0.30){ pop(); }
  };
  node.addEventListener('touchend',end); node.addEventListener('touchcancel',end);
}

function pushThread(cid){
  const c=S.chats.find(x=>x.id===cid); if(!c) return;
  c.unread=0;
  const u=S.users[c.u];
  const s=el(`<section class="screen" data-chat="${c.id}" data-owner="${c.u}">
    <header class="navbar">
      <div class="side"><button class="iconbtn js-back" aria-label="戻る">${I.back}</button></div>
      <button class="ttl" id="thHead" style="display:flex;flex-direction:column;align-items:center;gap:1px;flex:1">
        <span style="display:flex;align-items:center;gap:7px">${uav(c.u,22)}<span>${esc(u.name)}</span></span>
        <span style="font-size:11px;color:var(--ink-3);font-weight:700">公式Bot</span>
      </button>
      <div class="side"><button class="iconbtn" id="thMore" aria-label="その他">${I.dots}</button></div>
    </header>
    <div class="thread" id="thread"></div>
    <div class="composer-bar">
      <button class="iconbtn" aria-label="追加">${I.plusS}</button>
      <textarea class="msgfield" id="msgIn" rows="1" placeholder="メッセージ…"></textarea>
      <button class="sendbtn" id="sendBtn" aria-label="送信">${I.send}</button>
    </div>
  </section>`);
  s.querySelector('.js-back').onclick=()=>{haptic(5);pop();};
  $('#thHead',s).onclick=()=>pushProfile(c.u);
  $('#thMore',s).onclick=()=>openMenu([
    {t:'プロフィールを見る', fn:()=>pushProfile(c.u)},
    {t:'通知をオフにする', fn:()=>toast('通知をオフにしました')},
    {t:'ブロックする', danger:true, fn:()=>toast('ブロックしました')}
  ]);

  fitBars(s);
  const th=$('#thread',s);
  paintThread(th,c);

  const inp=$('#msgIn',s), send=$('#sendBtn',s);
  const autoGrow=()=>{ inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,120)+'px';
    send.classList.toggle('live', inp.value.trim().length>0); };
  inp.addEventListener('input',autoGrow);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();fire();} });
  send.onclick=fire;

  function fire(){
    const t=inp.value.trim(); if(!t) return;
    haptic(9);
    c.msgs.push({me:true,t,ts:Date.now()}); c.ts=Date.now();
    inp.value=''; autoGrow();
    appendMsg(th,c,c.msgs[c.msgs.length-1],true);
    scrollThread(th);
    // bot typing → reply
    setTimeout(()=>{
      const dots=el(`<div class="msgrow" id="typingRow">${uav(c.u,30)}<div class="bub"><span class="typing"><i></i><i></i><i></i></span></div></div>`);
      th.appendChild(dots); scrollThread(th);
      setTimeout(()=>{
        dots.remove();
        const m={me:false, t:REPLIES[Math.floor(Math.random()*REPLIES.length)], ts:Date.now()};
        c.msgs.push(m); c.ts=Date.now();
        appendMsg(th,c,m,true); scrollThread(th);
      }, 1150+Math.random()*700);
    }, 420);
  }
  push(s);
  raf(()=>{ th.scrollTop=th.scrollHeight; });
}

function paintThread(th,c){
  th.innerHTML='';
  let lastDay='';
  c.msgs.forEach((m,i)=>{
    const day=new Date(m.ts).toDateString();
    if(day!==lastDay){
      lastDay=day;
      const d=new Date(m.ts), today=new Date().toDateString();
      const label = day===today ? '今日' : `${d.getMonth()+1}月${d.getDate()}日`;
      th.appendChild(el(`<div class="daychip">${label}</div>`));
    }
    appendMsg(th,c,m,false,i);
  });
}
function appendMsg(th,c,m,animate,i=0){
  if(m.sys){
    const chip=el(`<div class="syschip">${I.check}<span>${esc(m.t)}</span><span class="t" data-ts="${m.ts}">${ago(m.ts)}</span></div>`);
    if(!animate) chip.style.animationDelay=Math.min(i*38,300)+'ms';
    th.appendChild(chip); return;
  }
  const row=el(`<div class="msgrow${m.me?' me':''}">
    ${m.me?uav('me',30):uav(c.u,30)}
    <div class="bub">${esc(m.t)}</div>
    <span class="mtime" data-ts="${m.ts}">${ago(m.ts)}</span>
  </div>`);
  const bub=row.querySelector('.bub');
  if(!animate){ bub.style.animationDelay=Math.min(i*38,300)+'ms'; }
  th.appendChild(row);
}
function scrollThread(th){ raf(()=>th.scrollTo({top:th.scrollHeight, behavior:'smooth'})); }

function openThreadForPost(pid){ pushPostDetail(pid); }

    const tk=e.target.closest('button[data-talk]');
    if(tk){ openRequest(tk.dataset.talk); }
  });

  /* like — kept in sync with the feed card */
  const likeBtn=$('#pdLike',s);
  likeBtn.onclick=()=>{
    p.liked=!p.liked; p.likes+=p.liked?1:-1;
    haptic(p.liked?12:5);
    likeBtn.classList.toggle('liked',p.liked);
    likeBtn.querySelector('.num').textContent=p.likes+'件のいいね';
    if(p.liked){ likeBtn.classList.remove('pop'); void likeBtn.offsetWidth; likeBtn.classList.add('pop');
      setTimeout(()=>likeBtn.classList.remove('pop'),700); }
    syncCard(p);
  };

  const list=$('#repList',s);
  paintReplies();

  /* composer — same mechanics as the DM bar */
  const inp=$('#repIn',s), send=$('#repSend',s), tgtBox=$('#replyTarget',s);
  let replyTo=null;
  function setTarget(uid){
    replyTo=uid;
    if(!uid){ tgtBox.innerHTML=''; inp.placeholder='やさしく返信する…'; return; }
    const u=S.users[uid];
    tgtBox.innerHTML=`<div class="replying">${I.reply}<span><b>${esc(u.name)}</b>さんに返信中</span>
      <button class="x" id="repCancel" aria-label="やめる">${I.close}</button></div>`;
    tgtBox.querySelector('#repCancel').onclick=()=>{ haptic(5); setTarget(null); };
    inp.placeholder=`${u.name}さんへ返信…`;
    fitBars(s);
    setTimeout(()=>inp.focus(),60);
  }
  const grow=()=>{ inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,120)+'px';
    send.classList.toggle('live', inp.value.trim().length>0); };
  inp.addEventListener('input',grow);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();fire();} });
  send.onclick=fire;

  function fire(){
    const t=inp.value.trim(); if(!t) return;
    haptic(11);
    send.classList.remove('fly'); void send.offsetWidth; send.classList.add('fly');
    setTimeout(()=>send.classList.remove('fly'),540);
    p.rep.push({u:'me', t, to:replyTo, ts:Date.now(), likes:0, liked:false});
    setTarget(null);
    p.replies=p.rep.length;
    inp.value=''; grow();
    paintReplies(true);
    $('#pdRepCount',s).querySelector('.num').textContent=p.replies+'件の返信';
    syncCard(p);
    quiet(()=>{ if($('#feed')) renderFeed(false); });
    const sc=s.querySelector('.js-scroll');
    raf(()=>sc.scrollTo({top:sc.scrollHeight, behavior:'smooth'}));
  }

  function paintReplies(fresh){
    if(!p.rep.length){
      list.innerHTML=`<div class="rep-empty">まだ返信がありません。<br>最初に声をかけてみよう。</div>`;
      return;
    }
    list.innerHTML=p.rep.map((r,i)=>{
      const ru=S.users[r.u];
      return `<div class="rep${fresh&&i===p.rep.length-1?' fresh':''}" data-rep="${i}">
        <button data-user="${r.u}" style="display:contents">${uav(r.u,36,r.av)}</button>
        <div class="rep-main">
          <div class="rep-line"><b>${esc(ru.name)}</b>${genderTag(ru)}
            <span>@${esc(ru.handle)}</span><span class="dot-sep"></span>
            <span data-ts="${r.ts}">${ago(r.ts)}</span></div>
          <p class="rep-body">${r.to&&S.users[r.to]?`<span class="mention">@${esc(S.users[r.to].handle)}</span> `:''}${esc(r.t)}</p>
          <div class="rep-foot">
            <button class="act" data-repreply="${i}">${I.reply}<span class="num">返信</span></button>
            <button class="act${r.liked?' liked':''}" data-replike="${i}">
              <span class="hb">${I.heart}<span class="burst">${burstDots()}</span></span><span class="num">${r.likes}</span>
            </button>
          </div>
        </div>
      </div>`;
    }).join('');
    list.onclick=e=>{
      const rr=e.target.closest('[data-repreply]');
      if(rr){ haptic(6); setTarget(p.rep[+rr.dataset.repreply].u); return; }
      const lk=e.target.closest('[data-replike]'); if(!lk) return;
      const r=p.rep[+lk.dataset.replike];
      r.liked=!r.liked; r.likes+=r.liked?1:-1;
      haptic(r.liked?11:5);
      lk.classList.toggle('liked',r.liked);
      lk.querySelector('.num').textContent=r.likes;
      if(r.liked){ lk.classList.remove('pop'); void lk.offsetWidth; lk.classList.add('pop');
        setTimeout(()=>lk.classList.remove('pop'),700); }
    };
  }
  push(s);
}

/* keep a feed card's counters in step with the detail screen */
function syncCard(p){
  document.querySelectorAll(`[data-post="${p.id}"],[data-mini="${p.id}"]`).forEach(card=>{
    const lk=card.querySelector('[data-like]');
    if(lk){ lk.classList.toggle('liked',p.liked);
      lk.querySelector('.num').textContent=p.likes; }
    const rp=card.querySelector('[data-reply]');
    if(rp){ const t=rp.querySelector('.num');
      t.textContent = card.dataset.mini ? p.replies+'件の返信' : p.replies; }
  });
}

/* =========================================================
   IMAGE CROPPER  —  pick, pan, pinch/slide to zoom, export
   ========================================================= */
function pickImage(cb){
  const inp=el('<input type="file" accept="image/*" style="position:absolute;left:-9999px">');
  document.body.appendChild(inp);
  inp.addEventListener('change',()=>{
    const f=inp.files && inp.files[0];
    inp.remove();
    if(!f) return;
    if(!/^image\//.test(f.type)){ toast('画像ファイルを選んでください'); return; }
    const rd=new FileReader();
    rd.onload=()=>cb(rd.result);
    rd.onerror=()=>toast('画像を読み込めませんでした');
    rd.readAsDataURL(f);
  });
  inp.click();
}

/* aspect: 1 = square/avatar, 3 = wide banner.  out = exported width in px. */
function openCropper(src, {aspect=1, round=false, out=512, title='切り抜き'}, done){
  const vw=Math.min(window.innerWidth, 520);
  const fw=Math.min(vw-32, 340);
  const fh=Math.round(fw/aspect);

  const m=el(`<div class="crop">
    <div class="crop-bar">
      <button id="crNo">キャンセル</button>
      <div class="ttl">${esc(title)}</div>
      <button class="go" id="crGo">完了</button>
    </div>
    <div class="crop-stagewrap">
      <div class="crop-stage" id="crStage" style="width:${fw}px;height:${fh}px">
        <img id="crImg" alt="">
        <div class="crop-mask">
          <div class="hole${round?' round':''}"></div>
          <div class="grid">
            <i class="v" style="left:33.33%"></i><i class="v" style="left:66.66%"></i>
            <i class="h" style="top:33.33%"></i><i class="h" style="top:66.66%"></i>
          </div>
        </div>
      </div>
    </div>
    <div class="crop-tools">
      <p class="crop-hint">ドラッグで位置を調整・ピンチかスライダーで拡大</p>
      <div class="zoomrow">
        ${I.image}
        <input type="range" id="crZoom" min="100" max="320" value="100">
        ${I.plusS}
      </div>
    </div>
  </div>`);
  $('#overlays').appendChild(m);
  raf(()=>m.classList.add('on'));

  const img=$('#crImg',m), stage=$('#crStage',m), zoom=$('#crZoom',m);
  let nw=0, nh=0, base=1, z=1, x=0, y=0;

  img.onload=()=>{
    nw=img.naturalWidth; nh=img.naturalHeight;
    base=Math.max(fw/nw, fh/nh);          /* cover the frame */
    z=1; x=0; y=0; apply();
  };
  img.src=src;

  function clamp(){
    const sw=nw*base*z, sh=nh*base*z;
    const mx=Math.max(0,(sw-fw)/2), my=Math.max(0,(sh-fh)/2);
    x=Math.min(mx,Math.max(-mx,x));
    y=Math.min(my,Math.max(-my,y));
  }
  function apply(){
    clamp();
    const sw=nw*base*z, sh=nh*base*z;
    img.style.transform=`translate3d(${(x-sw/2).toFixed(2)}px,${(y-sh/2).toFixed(2)}px,0)`;
    img.style.width=sw+'px'; img.style.height=sh+'px';
  }

  /* pan + pinch */
  const pts=new Map();
  let startX=0, startY=0, startZ=1, pinch0=0;
  stage.addEventListener('pointerdown',e=>{
    stage.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){ startX=e.clientX-x; startY=e.clientY-y; }
    if(pts.size===2){ pinch0=dist(); startZ=z; }
  });
  stage.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){ const p=[...pts.values()][0]; x=p.x-startX; y=p.y-startY; apply(); }
    else if(pts.size===2 && pinch0>0){
      z=Math.min(3.2,Math.max(1,startZ*(dist()/pinch0)));
      zoom.value=Math.round(z*100); apply();
    }
  });
  const drop=e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch0=0;
    if(pts.size===1){ const p=[...pts.values()][0]; startX=p.x-x; startY=p.y-y; } };
  stage.addEventListener('pointerup',drop);
  stage.addEventListener('pointercancel',drop);
  function dist(){ const [a,b]=[...pts.values()]; return Math.hypot(a.x-b.x,a.y-b.y); }

  zoom.addEventListener('input',()=>{ z=+zoom.value/100; apply(); });

  $('#crNo',m).onclick=close;
  $('#crGo',m).onclick=()=>{
    const scale=base*z;
    const cv=document.createElement('canvas');
    cv.width=out; cv.height=Math.round(out/aspect);
    const g=cv.getContext('2d');
    g.imageSmoothingQuality='high';
    /* frame rectangle expressed in source-image coordinates */
    const sw=fw/scale, sh=fh/scale;
    const sx=nw/2-(fw/2+x)/scale, sy=nh/2-(fh/2+y)/scale;
    g.drawImage(img, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
    let url;
    try{ url=cv.toDataURL('image/jpeg',0.88); }
    catch(err){ toast('画像を書き出せませんでした'); return; }
    haptic(12); close(); setTimeout(()=>done(url),200);
  };
  function close(){ m.classList.remove('on'); setTimeout(()=>m.remove(),500); }
}

function showScrim(on, onTap){

/* ---------- request-to-talk sheet (drag dismissible) ---------- */
function openRequest(postId, uidOverride){
  const p = postId ? S.posts.find(x=>x.id===postId) : null;
  const uid = uidOverride || (p && p.u); if(!uid) return;
  if(uid==='me'){ toast('自分自身とは会話できません'); return; }
  if(S.blocked.includes(uid)){ toast('ブロック中の相手には申請できません'); return; }
  const u=S.users[uid];

  const sheet=el(`<div class="sheet" id="reqSheet">
    <div class="grab"></div>
    <div class="sheet-ico">${I.reply}</div>
    <h3>${esc(u.name)}さんに<br>会話を申請</h3>
    <p class="lead">申請後もこの画面に残ります。DMは一覧へ追加され、文章を添えた場合は最初のメッセージとして相手にも届きます。</p>
    <div class="obox"><label>申請メッセージ <i>任意</i></label>
      <textarea id="reqMsg" maxlength="120" placeholder="投稿を見て話してみたいと思いました"></textarea>
      <span class="cnt" style="display:block;text-align:right;font-size:11px;color:var(--ink-3);font-weight:700" id="reqCnt">0/120</span></div>
    <button class="bigbtn" id="reqGo">会話を申請する</button>
    <button class="textlink" id="reqNo">キャンセル</button>
  </div>`);
  $('#overlays').appendChild(sheet);
  showScrim(true, close);
  raf(()=>sheet.classList.add('on'));

  const ta=$('#reqMsg',sheet);
  ta.addEventListener('input',()=>{
    $('#reqCnt',sheet).textContent=[...ta.value].length+'/120';
    ta.style.height='auto'; ta.style.height=Math.max(62,ta.scrollHeight)+'px';
  });
  $('#reqNo',sheet).onclick=close;
  $('#reqGo',sheet).onclick=()=>{
    haptic(14);
    let c=S.chats.find(x=>x.u===uid);
    const text=ta.value.trim();
    if(!c){
      c={id:'c'+Date.now(), u:uid, unread:0, ts:Date.now(), msgs:[]};
      S.chats.push(c);
    }
    if(text) c.msgs.push({me:true, t:text, ts:Date.now()});
    else     c.msgs.push({sys:true, t:'会話申請を送信しました', ts:Date.now()});
    c.ts=Date.now();
    scheduleReplyTo(c, text);      /* they answer in their own time */
    if(p){ p.req=true;
      const btn=document.querySelector(`[data-talk="${p.id}"]`);
      if(btn){ btn.classList.add('done'); btn.innerHTML=I.reply+'申請済み'; }
    }
    close(); syncNavBadges();
    setTimeout(()=>toast('会話を申請しました'),180);
  };

  /* drag to dismiss */
  let sy=0, dy=0, drag=false;
  const start=e=>{ const t=e.touches?e.touches[0]:e;
    if(e.target.closest('textarea')) return;
    sy=t.clientY; drag=true; sheet.style.transition='none'; };
  const move=e=>{ if(!drag) return; const t=e.touches?e.touches[0]:e;
    dy=Math.max(0,t.clientY-sy);
    sheet.style.transform=`translate3d(0,${dy}px,0)`;
    $('#scrim').style.opacity = String(Math.max(0, 1-dy/380)); };
  const end=()=>{ if(!drag) return; drag=false;
    sheet.style.transition=''; $('#scrim').style.opacity='';
    if(dy>110) close(); else sheet.style.transform=''; dy=0; };
  sheet.addEventListener('touchstart',start,{passive:true});
  sheet.addEventListener('touchmove',move,{passive:true});
  sheet.addEventListener('touchend',end); sheet.addEventListener('touchcancel',end);

  function close(){
    sheet.classList.remove('on'); sheet.style.transform='';
    showScrim(false); setTimeout(()=>sheet.remove(),520);
  }
}

/* Re-render what changed, where the person already is, without replaying any
   entry animation.  scope 'posts' leaves DMs and notifications untouched —
   writing a post has nothing to do with them. */
function refreshInPlace(scope){
  quiet(()=>{
    if($('#feed')) renderFeed(false);
    if(S.tab==='me') renderMe();
    if(scope==='posts') return;
    if(S.tab==='chat') renderChatList();
    if(S.tab==='bell') renderNotes();
  });
}

function toggleMute(uid){

  if(i<0){ S.muted.push(uid); toast(`${name}をミュートしました`); }

}
function confirmBlock(uid){
  const u=S.users[uid];
  confirmSheet({
    title:`${u.name}をブロックしますか？`,
    lead:'相手の投稿は表示されなくなり、会話もできなくなります。相手に通知は届きません。',
    go:'ブロックする', danger:true,
    fn:()=>{
      if(!S.blocked.includes(uid)) S.blocked.push(uid);
      const mi=S.muted.indexOf(uid); if(mi>=0) S.muted.splice(mi,1);
      S.chats=S.chats.filter(c=>c.u!==uid);

      refreshInPlace(); syncNavBadges();
      toast(`${u.name}をブロックしました`);
    }
  });
