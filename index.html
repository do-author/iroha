/* ---------- request-to-talk sheet (drag dismissible) ---------- */
const REQUEST_IN_FLIGHT=new Set();

function openRequest(postId, uidOverride){
  if($('#reqSheet')) return;
  const p = postId ? S.posts.find(x=>x.id===postId) : null;
  const uid = uidOverride || (p && p.u); if(!uid) return;
  if(REQUEST_IN_FLIGHT.has(uid)){ toast('送信中です'); return; }
  if(p && isPostRequested(p.id) && !chatWith(uid)){
    /* Visible state is 「話す」 and no conversation exists: discard an old local marker. */
    unmarkPostRequested(p.id);
  }
  if(p && (p.req||isPostRequested(p.id))){ toast('すでに話しかけています'); return; }
  if(uid==='me'){ toast('自分自身とは会話できません'); return; }
  if(S.blocked.includes(uid)){ toast('ブロック中の相手には話しかけられません'); return; }

  const existing=chatWith(uid);
  if(!existing && !canStartNewDm(uid,true)) return;
  if(existing && dmPolicyOf(uid)==='replied' && !canSendDmNow(existing)){
    notifyDmWait(); return;
  }
  const u=S.users[uid];

  const sheet=el(`<div class="sheet request-sheet" id="reqSheet">
    <div class="grab"></div>
    <div class="sheet-ico">${I.reply}</div>
    <h3>${esc(honor(u.name))}に<br>話しかける</h3>
    <p class="lead">メッセージを書くと返信してもらいやすくなります。</p>
    <p class="lead req-note">出会い募集・連絡先・金銭要求のメッセージは禁止です。</p>
    <div class="obox"><label>メッセージ <i>任意</i></label>
      <textarea id="reqMsg" maxlength="120" placeholder="投稿を見て話してみたいと思いました"></textarea>
      <span class="cnt" style="display:block;text-align:right;font-size:11px;color:var(--ink-3);font-weight:700" id="reqCnt">0/120</span></div>
    <button class="bigbtn" id="reqGo">話したいことを伝える</button>
    <button class="textlink" id="reqNo">キャンセル</button>
  </div>`);
  $('#overlays').appendChild(sheet);
  showScrim(true, close);
  raf(()=>sheet.classList.add('on'));

  const ta=$('#reqMsg',sheet);
  const reqNo=$('#reqNo',sheet);
  const reqGo=$('#reqGo',sheet);
  let requestSubmitting=false;
  ta.addEventListener('input',()=>{
    $('#reqCnt',sheet).textContent=[...ta.value].length+'/120';
    ta.style.height='auto'; ta.style.height=Math.max(62,ta.scrollHeight)+'px';
  });
  reqNo.onclick=close;
  reqGo.onclick=()=>{
    if(requestSubmitting || REQUEST_IN_FLIGHT.has(uid)) return;
    requestSubmitting=true;
    REQUEST_IN_FLIGHT.add(uid);
    reqGo.disabled=true;
    reqGo.setAttribute('aria-busy','true');
    haptic(14);

    const text=ta.value.trim();
    let c=S.chats.find(x=>x.u===uid);
    const optimisticallyMarked=!!p;

    /* Same feel as post submit: finish this sheet immediately.
       The DM request continues in the background; this does NOT navigate to DM. */
    if(p){
      markPostRequested(p.id);
      syncRequestButtons(p.id,true);
    }
    close();

    void (async()=>{
      let sent=false;
      try{
        if(!c && cloudUserKeyIsReal(uid)) c=await cloudGetOrCreateChat(uid);
        if(!c){
          c={id:'c'+Date.now(), u:uid, unread:0, ts:Date.now(), msgs:[]};
          S.chats.push(c);
        }
        if(dmPolicyOf(uid)==='replied' && !canSendDmNow(c)){
          throw new Error('dm_waiting_for_reply');
        }

        const m=text
          ? {id:newRowId(),me:true,t:text,ts:Date.now()}
          : {id:newRowId(),me:true,sys:true,t:'会話申請を送信しました',ts:Date.now()};

        await cloudSendMessage(c,m);
        c.msgs.push(m);
        c.ts=Date.now();
        sent=true;

        if(S.users[uid]?.demo||S.users[uid]?.bot) scheduleReplyTo(c, text);
        syncNavBadges();
        toast('話しかけました');
      }catch(e){
        if(optimisticallyMarked){
          unmarkPostRequested(p.id);
          syncRequestButtons(p.id,false);
        }

        /* If we created only a temporary local empty chat and sending failed,
           remove it so a failed request does not look like a real conversation. */
        if(c && !c.msgs?.length && !c.cloud){
          const i=S.chats.indexOf(c);
          if(i>=0) S.chats.splice(i,1);
        }

        if(String(e?.message||e).includes('dm_waiting_for_reply')) notifyDmWait();
        else if(String(e?.message||e).includes('dm_favorite_only')) notifyFavOnly();
        else{
          cloudErr('conversation request',e);
          toast('話しかけられませんでした');
        }
      }finally{
        REQUEST_IN_FLIGHT.delete(uid);
        requestSubmitting=false;
      }
    })();
  };

  /* drag to dismiss */
  let sy=0, dy=0, drag=false;
  const start=e=>{ const t=e.touches?e.touches[0]:e;
    if(e.target.closest('textarea')) return;
    sy=t.clientY; drag=true; sheet.style.transition='none'; };
  const move=e=>{ if(!drag) return; const t=e.touches?e.touches[0]:e;
    dy=Math.max(0,t.clientY-sy);
    sheet.style.transform=`translate3d(0,${dy}px,0)`;
    $('#scrim').style.opacity = String(Math.max(0, 1-dy/380)); };
  const end=()=>{ if(!drag) return; drag=false;
    sheet.style.transition=''; $('#scrim').style.opacity='';
    if(dy>110) close(); else sheet.style.transform=''; dy=0; };
  sheet.addEventListener('touchstart',start,{passive:true});
  sheet.addEventListener('touchmove',move,{passive:true});
  sheet.addEventListener('touchend',end); sheet.addEventListener('touchcancel',end);

  function close(){
    sheet.classList.remove('on'); sheet.style.transform='';
    showScrim(false); setTimeout(()=>sheet.remove(),520);
  }
}

  if(on){ S.muted.push(uid); toast(`${name}をミュートしました`); }
  else{ S.muted.splice(i,1); toast(`${name}のミュートを解除しました`); }
  savePrefs();
  haptic(9); refreshInPlace(); syncNavBadges();
}
function confirmBlock(uid){
  const u=S.users[uid]; if(!u || uid==='me') return;
  confirmSheet({
    title:`${u.name}をブロックしますか？`,
    lead:'相手の投稿は表示されなくなり、会話もできなくなります。相手に通知は届きません。',
    go:'ブロックする', danger:true,
    fn:async()=>{
      if(CLOUD.enabled){
        try{ await cloudSetBlock(uid,true); }
        catch(e){ cloudErr('block user',e); return; }
      }
      if(!S.blocked.includes(uid)) S.blocked.push(uid);
      const mi=S.muted.indexOf(uid);
      if(mi>=0){
        S.muted.splice(mi,1);
        if(CLOUD.enabled) cloudSetMute(uid,false).catch(e=>cloudErr('unmute blocked user',e));
      }
      savePrefs();
      S.chats=S.chats.filter(c=>c.u!==uid);
      ['like','reply'].forEach(k=>{ S.notes[k]=S.notes[k].filter(n=>n.u!==uid); });
      haptic(12);
      /* leave any screen that belongs to the blocked person */
      for(let i=stackEls.length-1;i>=0;i--){
        if(stackEls[i].dataset.owner===uid){ while(stackEls.length>i) pop(); break; }
      }
      /* A reply-detail screen can remain open when the reply author is blocked there. */
      $$('.screen[data-post] [data-user]').forEach(btn=>{
        if(btn.dataset.user===uid) btn.closest('.rep')?.remove();
      });
      refreshInPlace(); syncNavBadges();
      toast(`${u.name}をブロックしました`);
      if(CLOUD.enabled) void cloudReloadAll(false,true);
    }
  });
}

  ta.addEventListener('input',()=>{
    const n=[...ta.value].length;
    $('#cmCnt',m).textContent=n+'/140';
    sync();
  });

  /* A voice note stands alone: mixing it with photos has no sensible layout. */
  const hasAudio=()=>atts.some(a=>a.kind==='audio');

  function paintAtts(){
    attBox.innerHTML = atts.length
      ? `<div class="attgrid">${atts.map((a,i)=>
          `<div class="attpreview">
             <button class="x" data-att-x="${i}" aria-label="取り消す">${I.close}</button>
             ${mediaHTML(a,{forceShow:true})}
           </div>`).join('')}</div>
         ${atts.length>1?`<p class="atthint">${atts.length}枚 · 横にスワイプして見られます</p>`:''}`
      : '';
    attBox.querySelectorAll('[data-att-x]').forEach(b=>b.onclick=()=>{
      haptic(6); stopAudio();
      atts.splice(Number(b.dataset.attX),1);
      paintAtts();
    });
    const full = atts.length>=MEDIA_MAX || hasAudio();
    $$('.attbtn',m).forEach(b=>{
      b.disabled = full || (b.dataset.att==='audio' && atts.length>0);
    });
    sync(); fitBars(m);
  }
  function addAtts(v){
    for(const it of (Array.isArray(v)?v:[v])){
      if(!it || atts.length>=MEDIA_MAX) break;
      atts.push(it);
    }
    paintAtts();
  }
  $$('.attbtn',m).forEach(b=>b.addEventListener('click',()=>{
    haptic(7);
    const k=b.dataset.att;
    if(k==='audio') openRecorder(addAtts);
    else pickMedia('image/*,video/*', addAtts, {multiple:true, max:MEDIA_MAX-atts.length});
  }));
  $$('.tagopt',m).forEach(b=>b.addEventListener('click',()=>{
    haptic(6); tag=b.dataset.t;
    $$('.tagopt',m).forEach(x=>x.classList.toggle('on',x===b));
  }));
  $('#cmNo',m).onclick=close;
  $('#cmGo',m).onclick=()=>{
    if(sending) return;
    const t=ta.value.trim(); if(!t && !atts.length) return;

    const left=categoryCooldownLeft(tag);
    if(left>0){
      const sec=Math.max(1,Math.ceil(left/1000));
      toast(`「${TAGS[tag]?.label||'このカテゴリー'}」はあと${sec}秒待ってください`);
      haptic(5);
      return;
    }

    sending=true; sync(); haptic(14);
    const cooldownStamp=startCategoryCooldown(tag);

    const post={id:newRowId(), u:'me', t, tag, ts:Date.now(),
      likes:0, replies:0, liked:false, req:false, rep:[], arch:false, pending:true};
    setMediaList(post, atts);
    S.posts.unshift(post);
    const newId=post.id;
    showPostUploadStatus(post);

    /* Instagram-style UX: the composer is done immediately.
       Upload/insert continues in the background while the app stays open. */
    close();
    setTimeout(()=>{
      refreshInPlace('posts');
      if(S.tab==='home'){
        const sc=$('#feedScroll'); if(sc) sc.scrollTo({top:0,behavior:'smooth'});
      }
    },80);

    void (async()=>{
      try{
        await cloudCreatePost(post);
        post.pending=false; post.failed=false;
        const live=S.posts.find(x=>x.id===post.id);
        if(live && live!==post) Object.assign(live,post);
        else if(!live) S.posts.unshift(post);
        quiet(()=>refreshInPlace('posts'));
        finishPostUploadStatus(true);
        const hidden = S.tab==='home' && !visiblePosts().some(x=>x.id===newId);
      }catch(e){
        post.pending=false; post.failed=true;
        rollbackCategoryCooldown(tag,cooldownStamp);
        const live=S.posts.find(x=>x.id===post.id);
        if(live && live!==post) Object.assign(live,post);
        else if(!live) S.posts.unshift(post);
        quiet(()=>refreshInPlace('posts'));
        finishPostUploadStatus(false);
        cloudErr('post',e);
      }
    })();
  };
  /* Wait until the post screen is visually settled before opening the keyboard. */
  focusAfterModalShown(m,ta);

  function close(){
    m.classList.remove('on');
    if(fab) fab.classList.remove('x');
    setTimeout(()=>m.remove(),520);
  }
}



/* =========================================================
   PULL TO REFRESH
   ========================================================= */
const PTR_ICON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><g class="arc"><path d="M12 4.4a7.6 7.6 0 107.4 9.3"/><path d="M19.6 4.6v4.6h-4.6"/></g></svg>';

function attachPTR(scroller, root, onRefresh){
  if(!scroller||!root||scroller.dataset.ptr) return;
  scroller.dataset.ptr='1';
  const ind=el(`<div class="ptr"><div class="ptr-ring">${PTR_ICON}</div></div>`);
  root.appendChild(ind);
  const ring=ind.querySelector('.ptr-ring');
  const TH=66, MAX=104;
  const postDetailAxisLock=!!root.dataset.post;
  let sx=0, sy=0, axis='', pulling=false, dist=0, busy=false, startedOnStrip=false;

  scroller.classList.add('pull-host');

  scroller.addEventListener('touchstart',e=>{
    if(busy || scroller.scrollTop>0 || e.touches.length>1) return;
    const t=e.touches[0];
    sx=t.clientX; sy=t.clientY; axis=''; pulling=true; dist=0;
    startedOnStrip=!!e.target.closest('.mstrip');
    scroller.style.transition='none';
  },{passive:true});

  scroller.addEventListener('touchmove',e=>{
    if(!pulling || e.touches.length!==1) return;
    const t=e.touches[0];
    const dx=t.clientX-sx, dy=t.clientY-sy;

    /* Media strips and post detail both wait for a real axis decision.
       A horizontal strip flick is left completely alone. A vertical drag is
       handed to normal page scrolling / PTR even when the finger started on
       the picture itself. */
    if(postDetailAxisLock || startedOnStrip){
      const ax=Math.abs(dx), ay=Math.abs(dy);
      if(!axis){
        if(Math.max(ax,ay)<7) return;
        if(startedOnStrip){
          if(ax>ay*1.12) axis='x';
          else if(ay>ax*1.04) axis='y';
          else return;
        }else axis=ax>ay?'x':'y';
      }
      if(axis==='x'){
        pulling=false; dist=0;
        scroller.style.transition=''; scroller.style.transform='';
        ring.style.opacity=0; ring.style.transform='scale(.5)';
        ring.classList.remove('ready','busy');
        /* Crucial: no preventDefault here. The horizontal strip owns it. */
        return;
      }
    }

    if(dy<=0){ dist=0; scroller.style.transform=''; ring.style.opacity=0; return; }
    e.preventDefault();                       /* replace the native rubber band */
    dist=Math.min(MAX, Math.pow(dy,0.82));
    const p=Math.min(1, dist/TH);
    scroller.style.transform=`translate3d(0,${dist.toFixed(1)}px,0)`;
    ring.style.opacity=p;
    ring.style.transform=`scale(${(0.5+0.5*p).toFixed(3)}) rotate(${(p*270).toFixed(0)}deg)`;
    ring.classList.toggle('ready', dist>=TH);
  },{passive:false});

  const release=()=>{
    if(!pulling){ startedOnStrip=false; return; }
    pulling=false; startedOnStrip=false;
    scroller.style.transition='';
    if(dist>=TH) run(); else settle();
  };
  scroller.addEventListener('touchend',release);
  scroller.addEventListener('touchcancel',release);

  function settle(){
    scroller.style.transform='';
    ring.style.opacity=0; ring.style.transform='scale(.5)';
    ring.classList.remove('ready','busy');
  }
  function run(){
    busy=true; haptic(11);
    scroller.style.transform='translate3d(0,58px,0)';
    ring.style.opacity=1; ring.style.transform='scale(1)';
    ring.classList.remove('ready'); ring.classList.add('busy');
    const started=Date.now();
    Promise.resolve().then(onRefresh).catch(()=>{}).then(()=>{
      const wait=Math.max(0, 620-(Date.now()-started));   /* never flash by */
      setTimeout(()=>{ busy=false; settle(); }, wait);
    });
  }
}

const DEMO_TAGS=['zatsudan','hitorigoto','soudan','shumi','shitsumon'];
const pick = a => a[Math.floor(Math.random()*a.length)];
const uid4 = () => Math.random().toString(36).slice(2,8);

function activeDemos(){
  return S.DEMOS.filter(id => !S.blocked.includes(id));
}
function pushNote(kind, uid, t, sub, postId){
  if(S.quiet) return;                    /* おやすみモード: no new notifications */
  S.notes[kind].unshift({id:'n'+uid4(), u:uid, p:postId, t, s:sub, ts:Date.now()});
  if(S.notes[kind].length>40) S.notes[kind].length=40;
}
function myPosts(){ return S.posts.filter(p=>p.u==='me' && !p.arch); }

/* --- the individual things a demo person can do --- */
function demoLike(uid){
  if(!S.users[uid]) return false;
  const mine=myPosts().filter(p=>!(p.likedBy||[]).includes(uid));
  if(!mine.length) return false;
  const p=pick(mine);
  (p.likedBy=p.likedBy||[]).push(uid);
  p.likes++;
  pushNote('like', uid, `${S.users[uid].name}があなたの投稿にいいねしました`, `「${p.t.slice(0,18)}」`, p.id);
  return true;
}
function demoReply(uid){
  if(!VOICE[uid]) return false;
  const mine=myPosts();
  if(!mine.length) return false;
  const p=pick(mine), t=pick(VOICE[uid].replies);
  p.rep.push({u:uid, t, ts:Date.now(), likes:0, liked:false});
  p.replies=p.rep.length;
  pushNote('reply', uid, `${S.users[uid].name}があなたの投稿に返信しました`, t, p.id);
  return true;
}
function demoPost(uid){
  if(!VOICE[uid]) return false;
  S.posts.unshift({id:'g'+uid4(), u:uid, t:pick(VOICE[uid].posts), tag:pick(DEMO_TAGS),
    ts:Date.now(), likes:Math.floor(Math.random()*4), replies:0, liked:false,
    req:false, rep:[], arch:false});
  if(S.posts.length>60) S.posts.length=60;
  return true;
}
function demoRequest(uid){
  if(!VOICE[uid] || S.chats.some(c=>c.u===uid)) return false;
  const c={id:'c'+uid4(), u:uid, unread:1, ts:Date.now(),
    msgs:[{sys:true, t:'会話の申請が届きました', ts:Date.now()},
          {me:false, t:VOICE[uid].hello, ts:Date.now()+1}]};
  S.chats.unshift(c);
  return true;
}
function demoDM(uid){
  if(!VOICE[uid]) return false;
  const c=S.chats.find(x=>x.u===uid);
  if(!c) return false;
  c.msgs.push({me:false, t:pick(VOICE[uid].dms), ts:Date.now()});
  c.ts=Date.now(); c.unread++; c.hidden=false;
  liveThread(c);
  return true;
}
/* if that conversation is open, drop the message straight in */
function liveThread(c){
  const scr=stackEls.find(x=>x.dataset.chat===c.id);
  if(!scr) return;
  c.unread=0;
  const th=scr.querySelector('.thread');
  if(!th) return;
  appendMsg(th, c, c.msgs[c.msgs.length-1], true);
  raf(()=>th.scrollTo({top:th.scrollHeight, behavior:'smooth'}));
}

/* someone answers a conversation request, after a human-ish pause */
function scheduleReplyTo(c, text){
  const uid=c.u;
  setTimeout(()=>{
    if(S.blocked.includes(uid)) return;
    const v=VOICE[uid];
    const t = v ? pick(v.replies) : '申請ありがとうございます。ゆっくり話しましょう。';
    c.msgs.push({me:false, t, ts:Date.now()});
    c.ts=Date.now(); c.hidden=false;
    if(!stackEls.some(x=>x.dataset.chat===c.id)) c.unread++;
    liveThread(c);
    syncNavBadges();
    quiet(()=>{ if(S.tab==='chat') renderChatList(); });
  }, 2600+Math.random()*4200);
}

/* --- the loop --- */
const DEMO_ACTIONS=[
  {w:34, fn:demoLike},
  {w:24, fn:demoReply},
  {w:20, fn:demoPost},
  {w:12, fn:demoRequest},
  {w:10, fn:demoDM}
];
function demoStep(force){
  if(document.hidden && !force) return false;
  const who=activeDemos();
  if(!who.length) return false;
  const uid=pick(who);
  const total=DEMO_ACTIONS.reduce((a,x)=>a+x.w,0);
  let r=Math.random()*total, act=DEMO_ACTIONS[0];
  for(const a of DEMO_ACTIONS){ r-=a.w; if(r<=0){ act=a; break; } }
  const did=act.fn(uid);
  if(!did && force) return demoPost(uid);   /* a pull must always yield something */
  return did;
}
/* a pull shouldn't dump everything at once — let a couple more things
   land over the next half minute so the feed keeps breathing */
function queueDemo(n){
  for(let i=0;i<n;i++){
    setTimeout(()=>{
      if(demoStep(true)){
        syncNavBadges();
        quiet(()=>{
          if($('#feed')) renderFeed(false);
          if(S.tab==='bell') renderNotes();
          if(S.tab==='chat'){ chatSig=null; renderChatList(); }
          if(S.tab==='me')   renderMe();
        });
      }
    }, 5000 + Math.random()*38000);
  }
}

function demoTick(){
  if(!S.quiet && demoStep()){
    syncNavBadges();
    quiet(()=>{
      if($('#feed')) renderFeed(false);
      if(S.tab==='bell') renderNotes();
      if(S.tab==='chat') renderChatList();
      if(S.tab==='me')   renderMe();
    });
  }
  setTimeout(demoTick, 11000+Math.random()*13000);
}

/* =========================================================
   FIRST RUN
   ========================================================= */
function openFirstSetup(prefill={}){
  return new Promise(resolve=>{
    const initialName=String(prefill.name && prefill.name!=='ユーザー' ? prefill.name : '').slice(0,10);
    let gender=['male','female','secret'].includes(prefill.gender)?prefill.gender:'secret';
    const layer=el(`<section class="first-setup" id="firstSetup" aria-label="初回設定">
      <div class="first-setup-inner">
        <div class="first-setup-brand">iroha</div>
        <h1>irohaをはじめる</h1>

        <label class="first-name-label" for="firstName">name</label>
        <div class="first-name-row">
          <input id="firstName" maxlength="10" placeholder="妖精さん" autocomplete="nickname" value="${esc(initialName)}">
          <span class="first-name-count" id="firstNameCount">${[...initialName].length}/10</span>
        </div>

        <h4 class="pick-h">gender</h4>
        <div class="genderpick" id="firstGender">
          ${Object.entries(GENDERS).map(([k,v])=>`<button class="gopt${k===gender?' on':''}" data-g="${k}">
            ${v.sym?`<span class="gtag ${v.cls}">${v.sym}</span>`:`<span class="gtag g-secret">${I.lockS}</span>`}
            <span>${v.label}</span></button>`).join('')}
        </div>
        <p class="hint">「秘密」を選ぶとプロフィールには表示されません</p>
        <p class="hint profile-note">どちらもプロフィールからあとで変更できます</p>

        <button class="bigbtn" id="firstStart">はじめる</button>
        <button class="textlink" id="firstSkip">スキップしてはじめる</button>
      </div>
    </section>`);

    $('#app').appendChild(layer);
    const nm=$('#firstName',layer);
    const start=$('#firstStart',layer);
    const skip=$('#firstSkip',layer);

    nm.addEventListener('input',()=>{
      $('#firstNameCount',layer).textContent=`${[...nm.value].length}/10`;
    });

    $$('.gopt',layer).forEach(b=>b.addEventListener('click',()=>{
      haptic(6);
      gender=b.dataset.g;
      $$('.gopt',layer).forEach(x=>x.classList.toggle('on',x===b));
    }));

    const prepareNotifications=async()=>{
      let ok=notificationPermission()==='granted';

      if(notificationPermission()==='default'){
        ok=await requestDeviceNotifications();
      }

      if(!ok){
        S.notifyWanted=false;
        savePrefs();
        return;
      }

      S.notifyWanted=true;
      savePrefs();

      try{
        await ensureBrowserPushSubscription();
      }catch(e){
        console.warn('[iroha push] first subscription',e);
      }
    };

    start.onclick=async()=>{

      const name=nm.value.trim();
      if(!name){ toast('名前を入力してください'); return; }
      if([...name].length>10){ toast('名前は10文字以内にしてください'); return; }

      layer.classList.add('busy');
      start.textContent='はじめています';

      await prepareNotifications();

      resolve({
        layer,
        name,
        gender,
        skipped:false
      });
    };

    skip.onclick=async()=>{
      
      layer.classList.add('busy');
      start.textContent='はじめています';

      await prepareNotifications();

      resolve({
        layer,
        name:initialName||'妖精さん',
        gender:['male','female','secret'].includes(prefill.gender)
          ? prefill.gender
          : 'secret',
        skipped:true
      });
    };

    setTimeout(()=>nm.focus({preventScroll:true}),80);
  });
}

/* =========================================================
   BOOT
   ========================================================= */
async function boot(){
  loadPrefs();
  watchCarousels();
  S.posts.forEach(p=>{ p.req=isPostRequested(p.id); });
  if(S.users.me) S.users.me.dmPolicy=S.who;
  setTheme(S.theme,false);

  let firstSetup=null;
  let existingSession=null;
  let existingProfile=null;

  if(cloudConfigured() && window.supabase?.createClient){
    try{
      existingSession=await cloudExistingSession();
      existingProfile=existingSession ? await cloudExistingProfile(existingSession) : null;

      /* One source of truth:
         - no profiles row         -> start screen
         - profiles.is_active=true -> normal start
         - profiles.is_active=false-> start screen (withdrawn, UUID stays) */
      const needsSetup=!existingProfile || existingProfile.is_active===false;

      if(needsSetup){
        /* A truly new profiles row gets a fresh random avatar colour here.
           Reactivating an existing/withdrawn profile keeps its previous colour. */
        if(!existingProfile){
          S.users.me.av=pickFreshAvatar();
          S.users.me.img=null;
          S.users.me.banner=null;
        }else if(existingProfile.is_active===false){
          /* The profile UUID is intentionally reused after account deletion.
             「話す」履歴は新しく始めたアカウントへ持ち越さない。 */
          resetRequestedPostsForRestart();
        }

        hideAppLoader(0);
        firstSetup=await openFirstSetup(existingProfile||{});
        showAppLoader('接続しています',0);

        /* A truly new profile is created only after the user presses a start button. */
        if(!existingProfile){
          S.users.me.name=firstSetup.name;
          S.users.me.gender=firstSetup.gender;
        }
      }
    }catch(e){
      console.warn('[iroha cloud] profile/start check',e);
    }
  }

  showAppLoader('接続しています',0);
  const cloudOK=await cloudInit();

  if(firstSetup && cloudOK){
    const u=S.users.me;

    if(existingProfile){
      /* Withdrawn profile: keep the same profiles.id and simply reactivate it.
         Skip preserves its old name/gender; normal start applies the chosen values. */
      const next=firstSetup.skipped
        ? {...u,isActive:true}
        : {...u,name:firstSetup.name,gender:firstSetup.gender,isActive:true};

      try{
        if(!firstSetup.skipped) await cloudSaveProfile(next);
        await cloudSetProfileActive(true);
        Object.assign(u,next);
      }catch(e){
        cloudErr('restart profile',e);
      }
    }else{
      /* cloudInit/cloudEnsureProfile just created this profile after the user started. */
      u.isActive=true;
    }
  }

  if(firstSetup?.layer?.isConnected) firstSetup.layer.remove();

  if(CLOUD.enabled) cloudPrepareFastShell();

  buildNav();
  buildPane('home');
  raf(()=>{
    PANES.home.classList.add('on');
    moveNavInd(false);
    syncNavBadges();
    navMorph.init();
    hideAppLoader(180);
  });
  if(CLOUD.enabled){
    cloudStartRealtime();

    /* Do not block first paint on the full cloud snapshot. Posts are painted as
       soon as they are ready; the heavier DM history continues afterwards. */
    CLOUD.initialSyncPromise=cloudReloadAll(false,true,true)
      .catch(e=>{
        console.warn('[iroha cloud] initial sync',e);
        CLOUD.postsInitialLoading=false;
        if($('#feed')) renderFeed(false);
      })
      .finally(()=>{ CLOUD.initialSyncPromise=null; });

    pushRefresh();                     /* renewals happen quietly in the browser */
    navigator.serviceWorker?.addEventListener('message',ev=>{
      if(ev.data?.type==='iroha-push') cloudReloadAll(false,false);
    });
    /* Realtimeが取りこぼした場合だけ拾う保険。通常同期はRealtime、確認は30秒ごと。 */
    setInterval(()=>{ if(!document.hidden) cloudReloadAll(false,false); }, 30000);
    
  }else{
    setTimeout(demoTick, 6000);
  }
}

/* keyboard: escape closes topmost layer */
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  const cr=$('.crop'); if(cr){ $('#crNo',cr)?.click(); return; }
  const m=$('#composeM'); if(m){ $('#cmNo',m)?.click(); return; }
  const sh=$('#reqSheet'); if(sh){ $('#reqNo',sh)?.click(); return; }
  const am=$('#actMenu'); if(am){ am.querySelector('[data-close]')?.click(); return; }
  if(stackEls.length) pop();
});

/* prevent iOS rubber-band on the shell */
document.addEventListener('touchmove',e=>{
  const t=e.target;
  if(t.closest('.scroll,.thread,.chiprow,textarea')) return;

  /* A viewer that is on its way out is inert, but the finger may well have
     landed on it. Judging by that element would refuse the gesture outright
     and leave the page feeling stuck until the layer is finally removed;
     defer to whatever is actually underneath instead. */
  const leaving=t.closest('.is-closing,.media-viewer-screen.out,.screen.out');
  if(leaving){
    const touch=e.touches&&e.touches[0];
    const under=touch
      ? document.elementsFromPoint(touch.clientX,touch.clientY)
          .find(n=>!n.closest('.is-closing,.media-viewer-screen.out,.screen.out'))
      : null;
    if(under && under.closest('.scroll,.thread,.chiprow,textarea')) return;
  }

  e.preventDefault();
},{passive:false});

boot();


</script>
