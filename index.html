@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* iPhone: place the floating bottom nav at the same lower height as the reference. */
@media (max-width: 600px){
  .navwrap{bottom:min(0px, calc(10px - var(--safe-b)));}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}
}

/* ============================================================
   test1 final visual overrides
   - no outer glow under bottom bar
   - moon FAB has zero warm/yellow light
   - home post cards and bottom nav are almost transparent
   ============================================================ */

/* Home post glass: nearly transparent, sky remains clearly visible */
[data-theme="night"] .tabpane[data-pane="home"] .card{
  background:rgba(35,28,58,.035) !important;
  border:1px solid rgba(241,237,252,.10) !important;
  -webkit-backdrop-filter:saturate(128%) blur(13px) !important;
  backdrop-filter:saturate(128%) blur(13px) !important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.035),
    0 5px 16px rgba(1,1,12,.055) !important;
}

  filter:none !important;
  box-shadow:none !important;
}
[data-theme="night"] .nav{
  background:rgba(34,27,54,.025) !important;
  border:1px solid rgba(241,237,252,.10) !important;

/* Moon FAB: cool silver/lavender only. No yellow or warm halo. */
[data-theme="night"] .fab-core{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 31% 28%, rgba(255,255,255,.94) 0 5%, transparent 6%),
    radial-gradient(circle at 67% 35%, rgba(96,91,122,.15) 0 6%, transparent 7.5%),
    radial-gradient(circle at 40% 68%, rgba(91,87,116,.12) 0 8%, transparent 9.5%),
    radial-gradient(circle at 68% 69%, rgba(93,88,119,.09) 0 4%, transparent 5.5%),
    radial-gradient(circle at 34% 28%, #F5F3FA 0%, #DFDCEB 47%, #B7B1CA 100%) !important;

  if(mime.includes('jpeg')) return 'jpg'; if(mime.includes('png')) return 'png'; if(mime.includes('webp')) return 'webp';
  if(mime.includes('mp4')) return 'mp4'; if(mime.includes('quicktime')) return 'mov';
  if(mime.includes('ogg')) return 'ogg'; if(mime.includes('mpeg')) return 'mp3'; if(mime.includes('wav')) return 'wav';
  if(kind==='video') return 'mp4'; if(kind==='audio') return 'webm'; return 'bin';
}
async function cloudUploadMedia(m,{scope='post',chatId=null}={}){
  if(!CLOUD.enabled || !m) return m;
  if(m.bucket&&m.path){
    const out={kind:m.kind,bucket:m.bucket,path:m.path,name:m.name||'',dur:m.dur||0};
    /* carried alongside, never inside the payload the DB checks */
    if(validMediaWH(m.w,m.h)){ out._w=Number(m.w); out._h=Number(m.h); }
    return out;
  }
  if(!m.src || (!m.src.startsWith('blob:')&&!m.src.startsWith('data:'))) return m;
  /* Prefer the original selected File when available. This avoids depending on
     fetch(blob:) in iOS/PWA while an upload is starting after the composer closes. */
  const blob=(m._file instanceof Blob) ? m._file : await fetch(m.src).then(r=>r.blob());
  const ext=extFor(blob,m.name,m.kind);
  const id=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));
  const isDm=scope==='dm';
  const bucket=isDm?'iroha-dm':'iroha-public';
  const folder=isDm ? `${chatId}/${CLOUD.userId}` : `${CLOUD.userId}/${scope}`;
  const path=`${folder}/${id}.${ext}`;
  must(await CLOUD.client.storage.from(bucket).upload(path,blob,{contentType:blob.type||undefined,upsert:false}));
  const out={kind:m.kind,bucket,path,name:m.name||'',dur:m.dur||0};
  if(validMediaWH(m.w,m.h)){ out._w=Number(m.w); out._h=Number(m.h); }
  return out;
}
async function cloudHydrateMedia(m){
  if(!m) return null;
  if(!m.bucket||!m.path) return m;

  const cacheKey=`${m.bucket}:${m.path}`;
  const cached=CLOUD.mediaUrlCache.get(cacheKey);
  if(cached && cached.expiresAt>Date.now()){
    return {...m,src:cached.src};
  }

  if(m.bucket==='iroha-public'){
    const {data}=CLOUD.client.storage.from(m.bucket).getPublicUrl(m.path);
    const src=data.publicUrl;
    CLOUD.mediaUrlCache.set(cacheKey,{src,expiresAt:Number.MAX_SAFE_INTEGER});
    return {...m,src};
  }

  const {data,error}=await CLOUD.client.storage.from(m.bucket).createSignedUrl(m.path,3600);
  if(error){ console.warn('[iroha cloud] signed url',error); return {...m,src:''}; }
  /* Signed URL is valid for 60 min; renew a little early instead of on every realtime event. */
  CLOUD.mediaUrlCache.set(cacheKey,{src:data.signedUrl,expiresAt:Date.now()+50*60*1000});
  return {...m,src:data.signedUrl};
}

const DM_PAGE_SIZE=40;
const DM_MEDIA_PRELOAD_MARGIN='420px 0px';
const DM_HISTORY_TRIGGER_PX=620;
const HOME_PRIORITY_POSTS=10;
const HOME_PRIORITY_MEDIA_WAIT_MS=900;

function rawPostVisibleForCurrentHome(p){
  const uid=localKey(p.author_id);
  if(S.blocked.includes(uid) || S.muted.includes(uid)) return false;
  if(p.archived && uid!=='me') return false;
  if(S.filter==='fav') return !!S.users[uid]?.fav;
  if(S.filter==='osusume') return !p.archived;
  return (p.tag||'hitorigoto')===S.filter;
}

async function waitForPriorityHomeMedia(){
  const feed=$('#feed'), sc=$('#feedScroll');
  if(!feed||!sc) return;
  const root=sc.getBoundingClientRect();
  const media=[...feed.querySelectorAll('img,video')].filter(node=>{
    const r=node.getBoundingClientRect();
    return r.bottom>=root.top-40 && r.top<=root.bottom+80;
  }).slice(0,6);
  if(!media.length) return;

  const waits=media.map(node=>{
    if(node.tagName==='IMG'){
      node.loading='eager';
      try{ node.fetchPriority='high'; }catch(_){}
      if(node.complete) return Promise.resolve();
      return new Promise(resolve=>{
        node.addEventListener('load',resolve,{once:true});
        node.addEventListener('error',resolve,{once:true});
      });
    }
    node.preload='metadata';
    if(node.readyState>=1) return Promise.resolve();
    return new Promise(resolve=>{
      node.addEventListener('loadedmetadata',resolve,{once:true});
      node.addEventListener('error',resolve,{once:true});
    });
  });
  await Promise.race([
    Promise.allSettled(waits),
    new Promise(resolve=>setTimeout(resolve,HOME_PRIORITY_MEDIA_WAIT_MS)),
    new Promise(resolve=>{
      const started=Date.now();
      const timer=setInterval(()=>{
        if(S.tab!=='home' || Date.now()-started>=HOME_PRIORITY_MEDIA_WAIT_MS){
          clearInterval(timer);
          resolve();
        }
      },50);
    })
  ]);
}

async function cloudPaintPriorityHome(sb,me,posts){
  if(!$('#feed')||!posts?.length) return false;
  const priorityRows=posts.filter(rawPostVisibleForCurrentHome).slice(0,HOME_PRIORITY_POSTS);
  if(!priorityRows.length) return false;
  const ids=priorityRows.map(p=>p.id);
  const [quickLikes,quickReplies]=await Promise.all([
    cloudRows(sb.from('post_likes').select('post_id,user_id').in('post_id',ids)),
    cloudRows(sb.from('replies').select('post_id').in('post_id',ids))
  ]);
  const likes=new Map(), replies=new Map(), liked=new Set();
  quickLikes.forEach(x=>{
    likes.set(x.post_id,(likes.get(x.post_id)||0)+1);
    if(x.user_id===me) liked.add(x.post_id);
  });
  quickReplies.forEach(x=>replies.set(x.post_id,(replies.get(x.post_id)||0)+1));

  const quick=[];
  for(const row of priorityRows){
    quick.push({
      id:row.id,u:localKey(row.author_id),t:row.body||'',tag:row.tag||'hitorigoto',
      media:await cloudHydrateMedia(row.media),ts:new Date(row.created_at).getTime(),
      likes:likes.get(row.id)||0,replies:replies.get(row.id)||0,liked:liked.has(row.id),
      req:isPostRequested(row.id),rep:[],arch:!!row.archived,cloud:true,_priorityShell:true
    });
  }
  await attachMediaLists('post', quick, p=>p.id);
  const remoteIds=new Set(quick.map(p=>p.id));
  const localOutbox=S.posts.filter(p=>(p.pending||p.failed)&&!remoteIds.has(p.id));
  S.posts=[...localOutbox,...quick].sort((a,b)=>b.ts-a.ts);
  CLOUD.feedDirty=false;
  CLOUD.postsInitialLoading=false;
  cloudRefreshUI(true);
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  await waitForPriorityHomeMedia();
  return true;
}

function cloudMessageFromRow(row, me=CLOUD.userId, priorMedia=null){

async function cloudMapLimit(items,limit,fn){
  const out=new Array(items.length);
  let next=0;
  const workers=Array.from({length:Math.min(limit,items.length)},async()=>{
    while(true){
      const i=next++;
      if(i>=items.length) return;
      out[i]=await fn(items[i],i);
    }
  });
  await Promise.all(workers);
  return out;
}

async function cloudFetchLatestDmPages(chatIds){

}

function dmLazyMediaHTML(m){

  }
  const kind=['video','audio'].includes(m.media.kind)?m.media.kind:'image';
  const label=kind==='video'?'動画':kind==='audio'?'音声':'画像';
  const geom=(kind==='image'||kind==='video')?dmMediaGeometry(m.media):null;
  const geomStyle=geom
    ? ` style="width:${geom.w}px;max-width:100%;height:auto;aspect-ratio:${geom.w} / ${geom.h}"`

  return `<div class="media dm-media-lazy dm-media-lazy-${kind}" data-dm-media-placeholder aria-busy="true"${geomStyle}><span>${label}</span></div>`;
}

function syncDmMediaNode(row,m){
  if(!row||m?.sys||!m?.media) return;
  const pending=!!(m.media.bucket&&m.media.path&&!m.media.src);
  row.toggleAttribute('data-dm-media-pending',pending);
  const bub=row.querySelector('.bub');
  if(!bub) return;
  const ph=bub.querySelector('[data-dm-media-placeholder]');
  if(m.media.src && ph){
    const node=el(mediaGroupHTML(mediaListOf(m),{forceShow:!!m.me,dmStable:true}));
    if(node){
      ph.replaceWith(node);
      const mediaEl=node.querySelector('img,video');
      if(mediaEl) rememberDmMediaGeometryFromElement(m.media,mediaEl);
    }
  }else if(pending && !ph && !bub.querySelector('.media,.media-off,.aplayer')){
    const node=el(dmLazyMediaHTML(m));
    if(node) bub.prepend(node);
  }
}

function dmMessageForRow(c,row){

async function hydrateDmMediaRow(th,c,row){
  if(!row?.isConnected) return;
  const m=dmMessageForRow(c,row);
  if(!m?.media || m.media.src || !m.media.bucket || !m.media.path){
    row.removeAttribute('data-dm-media-pending');
    return;
  }
  if(row.dataset.dmMediaLoading==='1') return;
  row.dataset.dmMediaLoading='1';
  try{
    const changed=await cloudHydrateDmMessageMedia(c,m);
    if(changed && row.isConnected){
      const fresh=dmMessageForRow(c,row)||m;
      syncDmMediaNode(row,fresh);
    }
  }catch(e){
    console.warn('[iroha cloud] dm visible media',e);
  }finally{
    delete row.dataset.dmMediaLoading;
  }
}

function wireDmThreadLazyMedia(th,c){
  if(!th||!c) return;
  const cid=String(c.id);
  if(th._dmMediaCid!==cid){
    th._dmMediaObserver?.disconnect?.();
    th._dmMediaObserver=null;
    th._dmMediaCid=cid;
  }

  const pending=[...th.querySelectorAll('[data-dm-media-pending]')];
  if(!pending.length) return;

  /* First finish what the user can actually see. IntersectionObserver callbacks
     are intentionally secondary so near-screen media cannot compete with the viewport. */
  const rootRect=th.getBoundingClientRect();
  const center=(rootRect.top+rootRect.bottom)/2;
  const visibleNow=pending.filter(row=>{
    const r=row.getBoundingClientRect();
    return r.bottom>=rootRect.top && r.top<=rootRect.bottom;
  }).sort((a,b)=>{
    const ar=a.getBoundingClientRect(), br=b.getBoundingClientRect();
    return Math.abs((ar.top+ar.bottom)/2-center)-Math.abs((br.top+br.bottom)/2-center);
  });
  visibleNow.slice(0,6).forEach(row=>void hydrateDmMediaRow(th,c,row));

  if(!('IntersectionObserver' in window)){
    pending.filter(row=>!visibleNow.includes(row)).slice(-8).forEach(row=>void hydrateDmMediaRow(th,c,row));
    return;
  }

  if(!th._dmMediaObserver){
    th._dmMediaObserver=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(!entry.isIntersecting) return;
        const row=entry.target;
        th._dmMediaObserver.unobserve(row);
        delete row.dataset.dmMediaObserved;
        void hydrateDmMediaRow(th,c,row).then(()=>{
          if(row.isConnected && row.hasAttribute('data-dm-media-pending')){
            setTimeout(()=>wireDmThreadLazyMedia(th,c),1800);
          }
        });
      });
    },{root:th,rootMargin:DM_MEDIA_PRELOAD_MARGIN,threshold:0.01});
  }

  pending.forEach(row=>{
    if(row.dataset.dmMediaObserved==='1') return;
    row.dataset.dmMediaObserved='1';
    th._dmMediaObserver.observe(row);
  });
}

async function cloudLoadOlderDm(c,th){
  if(!CLOUD.enabled||!c?.cloud||!th||c._dmHasMore===false||c._dmLoadingOlder) return false;
  const liveC=S.chats.find(x=>String(x.id)===String(c.id))||c;
  const oldest=(liveC.msgs||[]).find(m=>m?._createdAt&&!m.pending&&!m.failed);
  if(!oldest?._createdAt){ liveC._dmHasMore=false; return false; }

  const cid=String(liveC.id);
  const running=CLOUD.dmHistoryLoads.get(cid);
  if(running) return running;

  liveC._dmLoadingOlder=true;
  const oldHeight=th.scrollHeight;
  const oldTop=th.scrollTop;
  const job=(async()=>{
    const rows=await cloudRows(
      CLOUD.client.from('messages')
        .select('*')
        .eq('chat_id',liveC.id)
        .lt('created_at',oldest._createdAt)
        .order('created_at',{ascending:false})
        .limit(DM_PAGE_SIZE)
    );
    rows.reverse();
    if(!rows.length){ liveC._dmHasMore=false; return false; }

    const existingIds=new Set((liveC.msgs||[]).map(m=>String(m.id)));
    const older=rows.map(r=>cloudMessageFromRow(r)).filter(m=>!existingIds.has(String(m.id)));
    if(!older.length){
      liveC._dmHasMore=rows.length===DM_PAGE_SIZE;
      return false;
    }

    liveC.msgs=[...older,...liveC.msgs].sort((a,b)=>a.ts-b.ts);
    liveC._dmHistoryExpanded=true;
    liveC._dmHasMore=rows.length===DM_PAGE_SIZE;

    paintThread(th,liveC,{reuse:true});
    const delta=Math.max(0,th.scrollHeight-oldHeight);
    th.scrollTop=oldTop+delta;
    wireDmThreadLazyMedia(th,liveC);
    return true;
  })().catch(e=>{
    console.warn('[iroha cloud] older dm page',e);
    return false;
  }).finally(()=>{
    liveC._dmLoadingOlder=false;
    if(CLOUD.dmHistoryLoads.get(cid)===job) CLOUD.dmHistoryLoads.delete(cid);
  });

  CLOUD.dmHistoryLoads.set(cid,job);
  return job;
}

const DM_WARM_CACHE_VERSION=1;
const DM_WARM_CACHE_MAX_CHATS=20;
const DM_WARM_CACHE_MESSAGES=DM_PAGE_SIZE;
function dmWarmCacheKey(){
  return CLOUD.userId ? `iroha:dm-warm:v${DM_WARM_CACHE_VERSION}:${CLOUD.userId}` : '';
}
function dmWarmMediaForCache(media){
  if(!media || typeof media!=='object') return null;
  const out={};
  for(const k of ['kind','bucket','path','name','dur']){
    if(media[k]!==undefined && media[k]!==null) out[k]=media[k];
  }
  /* Never persist blob/data URLs or expiring private signed URLs. */
  if(!out.bucket && typeof media.src==='string' && /^https?:/i.test(media.src)) out.src=media.src;
  return Object.keys(out).length?out:null;
}
function dmWarmUserForCache(u){
  if(!u) return null;
  return {
    id:u.id,cloudId:u.cloudId||u.id,name:u.name||'このユーザー',handle:u.handle||'',bio:u.bio||'',
    av:u.av||'stone',gender:u.gender||'secret',img:u.img||null,banner:u.banner||null,
    isActive:u.isActive!==false,dmPolicy:u.dmPolicy||'all',official:!!u.official,
    fav:!!u.fav,favMe:!!u.favMe
  };
}
function cloudSaveDmWarmCache(){
  if(!CLOUD.enabled || !CLOUD.userId) return;
  const key=dmWarmCacheKey(); if(!key) return;
  try{
    const chats=S.chats
      .filter(c=>c?.cloud && !c.hidden)
      .slice()
      .sort((a,b)=>(b.pin?1:0)-(a.pin?1:0) || (b.ts||0)-(a.ts||0))
      .slice(0,DM_WARM_CACHE_MAX_CHATS)
      .map(c=>({
        id:c.id,u:c.u,unread:Number(c.unread)||0,ts:Number(c.ts)||0,pin:!!c.pin,hidden:!!c.hidden,cloud:true,
        _dmHasMore:c._dmHasMore!==false,
        msgs:(c.msgs||[]).slice(-DM_WARM_CACHE_MESSAGES).map(m=>({
          id:m.id,me:!!m.me,t:m.t||'',sys:!!m.sys,media:dmWarmMediaForCache(m.media),
          ts:Number(m.ts)||0,_createdAt:m._createdAt||null,cloud:true
        }))
      }));
    const peerIds=[...new Set(chats.map(c=>c.u).filter(Boolean))];
    const users={};
    peerIds.forEach(id=>{ const u=dmWarmUserForCache(S.users[id]); if(u) users[id]=u; });
    localStorage.setItem(key,JSON.stringify({savedAt:Date.now(),users,chats}));
  }catch(e){
    console.warn('[iroha cache] dm save',e);
  }
}
function scheduleDmWarmCacheSave(){
  if(!CLOUD.enabled) return;
  clearTimeout(CLOUD.dmWarmCacheTimer);
  CLOUD.dmWarmCacheTimer=setTimeout(()=>{
    CLOUD.dmWarmCacheTimer=null;
    cloudSaveDmWarmCache();
  },120);
}
function cloudRestoreDmWarmCache(){
  if(!CLOUD.enabled || !CLOUD.userId) return false;
  const key=dmWarmCacheKey(); if(!key) return false;
  try{
    const data=JSON.parse(localStorage.getItem(key)||'null');
    if(!data || !Array.isArray(data.chats) || !data.users || typeof data.users!=='object') return false;
    for(const [id,u] of Object.entries(data.users)){
      if(!id || id==='me' || !u) continue;
      S.users[id]={
        id,cloudId:u.cloudId||id,name:u.name||'このユーザー',handle:u.handle||'',bio:u.bio||'',
        av:u.av||'stone',gender:u.gender||'secret',img:u.img||null,banner:u.banner||null,
        isActive:u.isActive!==false,dmPolicy:u.dmPolicy||'all',official:!!u.official,
        posts:0,replies:0,talks:0,fav:!!u.fav,favMe:!!u.favMe,_dmWarm:true
      };
    }
    const pendingByChat=new Map(
      S.chats.map(c=>[String(c.id),(c.msgs||[]).filter(m=>m.pending||m.failed)])
    );
    S.chats=data.chats.map(raw=>{
      const cachedMsgs=(raw.msgs||[]).map(m=>({
        id:m.id,me:!!m.me,t:m.t||'',sys:!!m.sys,media:m.media?{...m.media}:null,
        ts:Number(m.ts)||0,_createdAt:m._createdAt||null,cloud:true,_dmWarm:true
      }));
      const ids=new Set(cachedMsgs.map(m=>String(m.id)));
      const pending=(pendingByChat.get(String(raw.id))||[]).filter(m=>!ids.has(String(m.id)));
      return {
        id:raw.id,u:raw.u,unread:Number(raw.unread)||0,ts:Number(raw.ts)||0,pin:!!raw.pin,hidden:!!raw.hidden,
        msgs:[...cachedMsgs,...pending].sort((a,b)=>(a.ts||0)-(b.ts||0)),cloud:true,
        _dmHasMore:raw._dmHasMore!==false,_dmWarm:true
      };
    }).filter(c=>c.id && c.u && S.users[c.u]);
    chatSig=null;
    return S.chats.length>0;
  }catch(e){
    console.warn('[iroha cache] dm restore',e);
    return false;
  }
}
function cloudClearDmWarmCache(){
  const key=dmWarmCacheKey();
  if(!key) return;
  try{ localStorage.removeItem(key); }catch(_){}
}
function cloudPrepareFastShell(){
  /* Posts intentionally show a loading shell until the first server snapshot.
     DMs do the opposite: restore the previous device snapshot immediately, then
     let Supabase catch up in the background. */
  Object.keys(S.users).forEach(id=>{
    if(id!=='me' && (S.users[id]?.demo || S.users[id]?.bot)) delete S.users[id];
  });
  S.posts=S.posts.filter(p=>p.pending||p.failed);
  CLOUD.postsInitialLoading=true;
  const hadDmCache=cloudRestoreDmWarmCache();
  if(!hadDmCache){
    S.chats=S.chats.filter(c=>c.cloud && (c.msgs||[]).some(m=>m.pending||m.failed));
  }
  S.notes={like:[],reply:[]};
}

async function cloudUploadProfileAsset(src,slot){
  if(!CLOUD.enabled || !src) return src||null;
  if(/^https?:/.test(src)) return src;
  if(!src.startsWith('blob:')&&!src.startsWith('data:')) return src;
  const blob=await fetch(src).then(r=>r.blob());
  const ext=extFor(blob,'',slot==='avatar'?'image':'image');
  const path=`${CLOUD.userId}/profile/${slot}-${Date.now()}.${ext}`;
  must(await CLOUD.client.storage.from('iroha-public').upload(path,blob,{contentType:blob.type||undefined,upsert:true}));
  const {data}=CLOUD.client.storage.from('iroha-public').getPublicUrl(path);
  return data.publicUrl;
}

  for(let n=0;n<4;n++){
    const ins=await CLOUD.client.from('profiles').insert({
      id:CLOUD.userId,name:me.name,handle,bio:me.bio||'',av:me.av,gender:me.gender||'secret',
      dm_policy:S.who,is_active:true
    }).select().single();
    if(!ins.error){ me.handle=handle; me.cloudId=CLOUD.userId; me.isActive=true; return; }
    if(ins.error.code!=='23505') throw ins.error;
    handle='u'+Math.random().toString(36).slice(2,11);
  }
  throw new Error('プロフィールIDを作成できませんでした');
}
function cloudClient(){
  if(!CLOUD.client && window.supabase?.createClient){
    CLOUD.client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  }
  return CLOUD.client;
}
async function cloudExistingSession(){
  if(!cloudConfigured() || !window.supabase?.createClient) return null;
  const client=cloudClient(); if(!client) return null;
  const {data:{session},error}=await client.auth.getSession();
  if(error) throw error;
  return session||null;
}
async function cloudExistingProfile(session){
  if(!session?.user?.id) return null;
  const client=cloudClient(); if(!client) return null;
  const r=await client.from('profiles')
    .select('id,name,gender,is_active')
    .eq('id',session.user.id)
    .maybeSingle();
  if(r.error) throw r.error;
  return r.data||null;
}
async function cloudInit(){
  if(!cloudConfigured()) return false;
  if(!window.supabase?.createClient){ console.error('supabase-js failed to load'); return false; }
  try{
    const client=cloudClient();
    let {data:{session},error}=await client.auth.getSession(); if(error) throw error;
    /* New anonymous Auth users are created only after the first-run screen
       has been explicitly completed or skipped. boot() enforces that gate. */
    if(!session){
      const r=await client.auth.signInAnonymously();
      if(r.error) throw r.error;
      session=r.data.session;
    }
    CLOUD.userId=session.user.id; CLOUD.enabled=true;
    
    await cloudEnsureProfile();
    return true;
  }catch(e){
    CLOUD.enabled=false; console.error('[iroha cloud] init',e);
    setTimeout(()=>toast('Supabaseに接続できません。設定を確認してください'),700);
    return false;
  }
}
async function cloudRows(promise){ const r=await promise; if(r.error) throw r.error; return r.data||[]; }


/* Load a profile's replies by author, not by the Home timeline window.
   replies already has author_id + an author index in Supabase, so no schema change is needed. */
async function cloudFetchProfileReplies(uid){
  if(!CLOUD.enabled || !cloudUserKeyIsReal(uid)) return profileReplies(uid);
  const authorId=cloudKey(uid), sb=CLOUD.client, me=CLOUD.userId;
  const token=(CLOUD.profileReplyLoads.get(uid)||0)+1;
  CLOUD.profileReplyLoads.set(uid,token);

  const rq=await sb.from('replies').select('*',{count:'exact'}).eq('author_id',authorId)
    .order('created_at',{ascending:false}).limit(200);
  if(rq.error) throw rq.error;
  if(CLOUD.profileReplyLoads.get(uid)!==token) return profileReplies(uid);

  const authored=rq.data||[];
  if(S.users[uid]) S.users[uid].replies=typeof rq.count==='number'?rq.count:authored.length;
  const postIds=[...new Set(authored.map(r=>r.post_id).filter(Boolean))];
  if(!postIds.length) return [];

  const [parents,allReps,postLikes]=await Promise.all([
    cloudRows(sb.from('posts').select('*').in('id',postIds)),
    cloudRows(sb.from('replies').select('*').in('post_id',postIds).order('created_at',{ascending:true}).limit(1000)),
    cloudRows(sb.from('post_likes').select('*').in('post_id',postIds))
  ]);
  const allReplyIds=allReps.map(r=>r.id);
  const replyLikes=allReplyIds.length
    ? await cloudRows(sb.from('reply_likes').select('*').in('reply_id',allReplyIds)) : [];

  const likesByPost=new Map(), myPostLikes=new Set();
  postLikes.forEach(x=>{
    likesByPost.set(x.post_id,(likesByPost.get(x.post_id)||0)+1);
    if(x.user_id===me) myPostLikes.add(x.post_id);
  });
  const likesByReply=new Map(), myReplyLikes=new Set();
  replyLikes.forEach(x=>{
    likesByReply.set(x.reply_id,(likesByReply.get(x.reply_id)||0)+1);
    if(x.user_id===me) myReplyLikes.add(x.reply_id);
  });

  const repsByPost=new Map();
  for(const row of allReps){
    const rr={id:row.id,u:localKey(row.author_id),t:row.body||'',to:row.reply_to?localKey(row.reply_to):null,
      media:await cloudHydrateMedia(row.media),ts:new Date(row.created_at).getTime(),
      likes:likesByReply.get(row.id)||0,liked:myReplyLikes.has(row.id),cloud:true};
    if(!repsByPost.has(row.post_id)) repsByPost.set(row.post_id,[]);
    repsByPost.get(row.post_id).push(rr);
  }

  await attachMediaLists('reply', [...repsByPost.values()].flat(), r=>r.id);

  const freshOnes=[];
  for(const row of parents){
    const rep=repsByPost.get(row.id)||[];
    const fresh={id:row.id,u:localKey(row.author_id),t:row.body||'',tag:row.tag||'hitorigoto',
      media:await cloudHydrateMedia(row.media),ts:new Date(row.created_at).getTime(),
      likes:likesByPost.get(row.id)||0,replies:rep.length,liked:myPostLikes.has(row.id),
      req:isPostRequested(row.id),rep,arch:!!row.archived,cloud:true};
    freshOnes.push(fresh);
    const existing=S.posts.find(p=>p.id===row.id);
    if(existing){
      const profileOnly=!!existing.profileOnly;
      Object.assign(existing,fresh);
      if(profileOnly) existing.profileOnly=true;
    }else{
      fresh.profileOnly=true;   /* usable in profile/detail, but never injected into Home */
      S.posts.push(fresh);
    }
  }
  await attachMediaLists('post', freshOnes.map(f=>S.posts.find(p=>p.id===f.id)||f), p=>p.id);
  return profileReplies(uid);
}


/* 投稿詳細の返信欄だけを手動更新する。
   Home全体を差し替えず、開いている投稿オブジェクトをそのまま更新する。 */
async function cloudRefreshPostReplies(p){
  if(!CLOUD.enabled || !p?.id || !p.cloud) return p?.rep||[];

  const sb=CLOUD.client, me=CLOUD.userId;
  const rows=await cloudRows(
    sb.from('replies')
      .select('*')
      .eq('post_id',p.id)
      .order('created_at',{ascending:true})
      .limit(1000)
  );

  /* 更新中に初めて現れた返信者も、その場で表示できるようプロフィールだけ補う。 */
  const relatedIds=[...new Set(rows.flatMap(r=>[r.author_id,r.reply_to]).filter(Boolean))];
  const missing=relatedIds.filter(id=>!S.users[localKey(id)]);
  if(missing.length){
    const profiles=await cloudRows(sb.from('profiles').select('*').in('id',missing));
    for(const u of profiles){
      const key=localKey(u.id);
      const target=S.users[key]||{
        id:key,posts:0,replies:0,talks:0,fav:false,favMe:false,dmPolicy:'all'
      };
      Object.assign(target,{
        id:key,cloudId:u.id,name:u.name,handle:u.handle,bio:u.bio||'',
        av:u.av||'stone',gender:u.gender||'secret',
        img:u.avatar_url||null,banner:u.banner_url||null,
        isActive:u.is_active!==false,
        dmPolicy:['all','replied','fav'].includes(u.dm_policy)?u.dm_policy:'all'
      });
      S.users[key]=target;
      if(key!=='me') CLOUD.remoteUserIds.add(key);
    }
  }

  const replyIds=rows.map(r=>r.id);
  const replyLikes=replyIds.length
    ? await cloudRows(sb.from('reply_likes').select('*').in('reply_id',replyIds))
    : [];

  const likesByReply=new Map(), myReplyLikes=new Set();
  replyLikes.forEach(x=>{
    likesByReply.set(x.reply_id,(likesByReply.get(x.reply_id)||0)+1);
    if(x.user_id===me) myReplyLikes.add(x.reply_id);
  });

  const reps=[];
  for(const row of rows){
    reps.push({
      id:row.id,
      u:localKey(row.author_id),
      t:row.body||'',
      to:row.reply_to?localKey(row.reply_to):null,
      media:await cloudHydrateMedia(row.media),
      ts:new Date(row.created_at).getTime(),
      likes:likesByReply.get(row.id)||0,
      liked:myReplyLikes.has(row.id),
      cloud:true
    });
  }

  await attachMediaLists('reply', reps, r=>r.id);
  p.rep=reps;
  p.replies=reps.length;
  return reps;
}

/* Supabaseの定期確認で、実データが変わっていないならDOMを作り直さない。 */
function cloudViewSignature(){
  const users=Object.values(S.users)
    .filter(u=>!u.demo&&!u.bot)
    .map(u=>[u.id,u.name,u.handle,u.bio,u.av,u.gender,u.img||'',u.banner||'',u.dmPolicy||'all',u.isActive!==false,!!u.fav,!!u.favMe,u.posts||0,u.replies||0,u.talks||0])
    .sort((a,b)=>String(a[0]).localeCompare(String(b[0])));
  const posts=S.posts.filter(p=>p.cloud).map(p=>[
    p.id,p.u,p.t,p.tag,p.ts,p.likes,p.replies,!!p.liked,!!p.arch,
    (p.rep||[]).map(r=>[r.id,r.u,r.t,r.to||'',r.ts,r.likes,!!r.liked])
  ]);
  const chats=S.chats.filter(c=>c.cloud).map(c=>[
    c.id,c.u,c.unread,c.ts,!!c.pin,!!c.hidden,
    (c.msgs||[]).map(m=>[m.id,!!m.me,m.t||'',!!m.sys,m.ts])
  ]);
  const notes=[...S.notes.like,...S.notes.reply].filter(n=>n.cloud).map(n=>[n.id,n.u,n.p||'',n.t,n.s||'',n.ts]);
  const seen=[...S.noteSeen].sort();
  const blocked=[...S.blocked].sort();
  const muted=[...S.muted].sort();
  return JSON.stringify([users,posts,chats,notes,seen,blocked,muted]);
}

async function cloudReloadAll(initial=false, applyPosts=true, earlyPaint=false){
  if(!CLOUD.enabled) return;
  if(CLOUD.reloading){ CLOUD.reloadAgain=true; if(applyPosts) CLOUD.reloadAgainApplyPosts=true; return; }
  CLOUD.reloading=true;
  const beforeSig=initial ? '' : cloudViewSignature();
  try{
    const sb=CLOUD.client, me=CLOUD.userId;
    const previousCloudPeers=new Set(S.chats.filter(c=>c.cloud).map(c=>c.u));
    let profiles,posts,favOut,favIn,blocks=[],mutes=[],chats=[],states=[],notes=[];
    const prioritizeHome=!!(earlyPaint&&!initial&&S.tab==='home');
    if(prioritizeHome){
      /* Do not let DM metadata/notifications compete with the first visible home screen. */
      [profiles,posts,favOut,favIn,blocks,mutes]=await Promise.all([
        cloudRows(sb.from('profiles').select('*')),
        cloudRows(sb.from('posts').select('*').order('created_at',{ascending:false}).limit(250)),
        cloudRows(sb.from('favorites').select('target_id').eq('owner_id',me)),
        cloudRows(sb.from('favorites').select('owner_id').eq('target_id',me)),
        cloudRows(sb.from('user_blocks').select('blocked_id').eq('blocker_id',me)),
        cloudRows(sb.from('user_mutes').select('muted_id').eq('owner_id',me))
      ]);
    }else{
      [profiles,posts,favOut,favIn,blocks,mutes,chats,states,notes]=await Promise.all([
        cloudRows(sb.from('profiles').select('*')),
        cloudRows(sb.from('posts').select('*').order('created_at',{ascending:false}).limit(250)),
        cloudRows(sb.from('favorites').select('target_id').eq('owner_id',me)),
        cloudRows(sb.from('favorites').select('owner_id').eq('target_id',me)),
        cloudRows(sb.from('user_blocks').select('blocked_id').eq('blocker_id',me)),
        cloudRows(sb.from('user_mutes').select('muted_id').eq('owner_id',me)),
        cloudRows(sb.from('direct_chats').select('*').or(`user_a.eq.${me},user_b.eq.${me}`).order('updated_at',{ascending:false})),
        cloudRows(sb.from('direct_chat_state').select('*').eq('user_id',me)),
        cloudRows(sb.from('notifications').select('*').eq('recipient_id',me).order('created_at',{ascending:false}).limit(100))
      ]);
    }

    const serverBlocked=[...new Set(blocks.map(x=>localKey(x.blocked_id)).filter(x=>x&&x!=='me'))];
    const blockListChanged=serverBlocked.slice().sort().join(',')!==S.blocked.slice().sort().join(',');
    const blockedSet=new Set(serverBlocked);
    const serverMuted=[...new Set(mutes.map(x=>localKey(x.muted_id)).filter(x=>x&&x!=='me'&&!blockedSet.has(x)))];
    const muteListChanged=serverMuted.slice().sort().join(',')!==S.muted.slice().sort().join(',');
    const blockedProfileCache=new Map(
      serverBlocked.map(id=>[id,S.users[id]]).filter(([,u])=>!!u)
    );
    S.blocked=serverBlocked;
    S.muted=serverMuted;
    if(blockListChanged || muteListChanged) savePrefs();

    for(const id of CLOUD.remoteUserIds) if(id!=='me') delete S.users[id];
    CLOUD.remoteUserIds.clear();
    /* Cloud接続時はローカル専用BOT/DEMOユーザーも除外する。 */
    Object.keys(S.users).forEach(id=>{ if(id!=='me' && (S.users[id]?.demo || S.users[id]?.bot)) delete S.users[id]; });
    for(const u of profiles){
      const key=localKey(u.id);
      const target=key==='me'?S.users.me:(S.users[key]||{id:key});
      Object.assign(target,{id:key,cloudId:u.id,name:u.name,handle:u.handle,bio:u.bio||'',av:u.av||'stone',gender:u.gender||'secret',
        img:u.avatar_url||null,banner:u.banner_url||null,isActive:u.is_active!==false,
        dmPolicy:['all','replied','fav'].includes(u.dm_policy)?u.dm_policy:(key==='me'?S.who:'all'),
        posts:0,replies:0,talks:0,fav:false,favMe:false});
      if(key==='me'){
        if(['all','replied','fav'].includes(u.dm_policy)) S.who=u.dm_policy;
      }
      S.users[key]=target; if(key!=='me') CLOUD.remoteUserIds.add(key);
    }
    for(const [id,u] of blockedProfileCache){
      if(!S.users[id]) S.users[id]=u;
      CLOUD.remoteUserIds.add(id);
    }
    const outSet=new Set(favOut.map(x=>x.target_id)), inSet=new Set(favIn.map(x=>x.owner_id));
    Object.values(S.users).forEach(u=>{ const id=cloudKey(u.id); if(!id) return; u.fav=outSet.has(id); u.favMe=inSet.has(id); });

    if(prioritizeHome){
      try{ await cloudPaintPriorityHome(sb,me,posts); }
      catch(e){ console.warn('[iroha cloud] priority home paint',e); }
      /* Visible posts/media have now had first claim on network/decoder time. */
      [chats,states,notes]=await Promise.all([
        cloudRows(sb.from('direct_chats').select('*').or(`user_a.eq.${me},user_b.eq.${me}`).order('updated_at',{ascending:false})),
        cloudRows(sb.from('direct_chat_state').select('*').eq('user_id',me)),
        cloudRows(sb.from('notifications').select('*').eq('recipient_id',me).order('created_at',{ascending:false}).limit(100))
      ]);
    }

    const postIds=posts.map(p=>p.id);
    const [postLikes,replies]=postIds.length?await Promise.all([
      cloudRows(sb.from('post_likes').select('*').in('post_id',postIds)),
      cloudRows(sb.from('replies').select('*').in('post_id',postIds).order('created_at',{ascending:true}))
    ]):[[],[]];
    const replyIds=replies.map(r=>r.id);
    const replyLikes=replyIds.length?await cloudRows(sb.from('reply_likes').select('*').in('reply_id',replyIds)):[];
    const likesByPost=new Map(), myPostLikes=new Set();
    postLikes.forEach(x=>{ likesByPost.set(x.post_id,(likesByPost.get(x.post_id)||0)+1); if(x.user_id===me) myPostLikes.add(x.post_id); });
    const likesByReply=new Map(), myReplyLikes=new Set();
    replyLikes.forEach(x=>{ likesByReply.set(x.reply_id,(likesByReply.get(x.reply_id)||0)+1); if(x.user_id===me) myReplyLikes.add(x.reply_id); });
    const repsByPost=new Map();
    for(const r of replies){
      const rr={id:r.id,u:localKey(r.author_id),t:r.body||'',to:r.reply_to?localKey(r.reply_to):null,
        media:await cloudHydrateMedia(r.media),ts:new Date(r.created_at).getTime(),
        likes:likesByReply.get(r.id)||0,liked:myReplyLikes.has(r.id),cloud:true};
      if(!repsByPost.has(r.post_id)) repsByPost.set(r.post_id,[]); repsByPost.get(r.post_id).push(rr);
      if(S.users[rr.u]) S.users[rr.u].replies=(S.users[rr.u].replies||0)+1;
    }
    /* a reply of mine may live on a post beyond the timeline window;
       fetch those parents so the profile's 返信 tab is never short */
    const mineReplies=await cloudRows(
      sb.from('replies').select('post_id').eq('author_id',me).limit(300));
    const seen=new Set(postIds);
    const missing=[...new Set(mineReplies.map(x=>x.post_id).filter(id=>id&&!seen.has(id)))];
    if(missing.length){
      const extra=await cloudRows(sb.from('posts').select('*').in('id',missing));
      const extraIds=extra.map(x=>x.id);
      if(extraIds.length){
        const extraReps=await cloudRows(sb.from('replies').select('*').in('post_id',extraIds).order('created_at',{ascending:true}));
        for(const r of extraReps){
          const rr={id:r.id,u:localKey(r.author_id),t:r.body||'',to:r.reply_to?localKey(r.reply_to):null,
            media:await cloudHydrateMedia(r.media),ts:new Date(r.created_at).getTime(),
            likes:0,liked:false,cloud:true};
          if(!repsByPost.has(r.post_id)) repsByPost.set(r.post_id,[]); repsByPost.get(r.post_id).push(rr);
        }
        posts=posts.concat(extra);
      }
    }

    const remotePosts=[];
    for(const p of posts){
      const rep=repsByPost.get(p.id)||[];
      const lp={id:p.id,u:localKey(p.author_id),t:p.body||'',tag:p.tag||'hitorigoto',media:await cloudHydrateMedia(p.media),
        ts:new Date(p.created_at).getTime(),likes:likesByPost.get(p.id)||0,replies:rep.length,liked:myPostLikes.has(p.id),
        req:isPostRequested(p.id),rep,arch:!!p.archived,cloud:true};
      remotePosts.push(lp); if(S.users[lp.u]) S.users[lp.u].posts=(S.users[lp.u].posts||0)+1;
    }
    /* Home timeline is X-like: background sync may learn that the server changed,
       but the visible post snapshot only changes on initial load or manual refresh. */
    if(initial || applyPosts){
    await attachMediaLists('post', remotePosts, p=>p.id);
    await attachMediaLists('reply', remotePosts.flatMap(p=>p.rep||[]), r=>r.id);

      const remoteIds=new Set(remotePosts.map(p=>p.id));
      const localOutbox=S.posts.filter(p=>(p.pending||p.failed) && !remoteIds.has(p.id));
      S.posts=[...localOutbox,...remotePosts].sort((a,b)=>b.ts-a.ts);
      CLOUD.feedDirty=false;
      CLOUD.postsInitialLoading=false;
    }else{
      const currentIds=new Set(S.posts.filter(p=>p.cloud).map(p=>p.id));
      const remoteIds=new Set(remotePosts.map(p=>p.id));
      if(currentIds.size!==remoteIds.size || [...remoteIds].some(id=>!currentIds.has(id))) CLOUD.feedDirty=true;
    }

    if(earlyPaint && !initial){
      /* Home should become useful before a large DM history finishes downloading. */
      cloudRefreshUI(true);
      await new Promise(resolve=>requestAnimationFrame(()=>resolve()));
    }

    const previousDmMedia=new Map();
    const previousChatsById=new Map(S.chats.map(c=>[String(c.id),c]));
    S.chats.forEach(c=>(c.msgs||[]).forEach(m=>{
      if(m?.id && m?.media?.src) previousDmMedia.set(String(m.id),m.media);
    }));

    const localChatOutbox=new Map(
      S.chats.map(c=>[String(c.id),(c.msgs||[]).filter(m=>m.pending||m.failed)])
    );
    const blockedChatPeers=new Set();
    const visibleChats=chats.filter(c=>{
      const other=c.user_a===me?c.user_b:c.user_a, key=localKey(other);
      const visible=!S.blocked.includes(key) && !!S.users[key];
      if(!visible) blockedChatPeers.add(key);
      return visible;
    });
    const chatIds=visibleChats.map(c=>c.id), stMap=new Map(states.map(x=>[x.chat_id,x]));

    /* v5.0: only the newest page of each conversation is fetched during sync.
       Older pages are requested only when that thread is scrolled toward the top. */
    const latestDmPages=await cloudFetchLatestDmPages(chatIds);

    const cloudChats=visibleChats.map(c=>{
      const other=c.user_a===me?c.user_b:c.user_a, key=localKey(other), st=stMap.get(c.id);
      const prev=previousChatsById.get(String(c.id));
      const rows=latestDmPages.get(String(c.id))||[];
      const latestMs=rows.map(row=>cloudMessageFromRow(row,me,previousDmMedia.get(String(row.id))));
      const latestIds=new Set(latestMs.map(m=>String(m.id)));

      /* Pages explicitly loaded by upward scrolling stay resident for this session.
         A periodic latest-page refresh must not throw that history away. */
      const retainedOlder=prev?._dmHistoryExpanded
        ? (prev.msgs||[]).filter(m=>
            !m.pending&&!m.failed&&!latestIds.has(String(m.id)) &&
            (!latestMs.length || (m.ts||0)<latestMs[0].ts)
          )
        : [];

      const localMs=(localChatOutbox.get(String(c.id))||[]).filter(m=>!latestIds.has(String(m.id)));
      const dedup=new Map();
      [...retainedOlder,...latestMs,...localMs].forEach(m=>dedup.set(String(m.id),m));
      const ms=[...dedup.values()].sort((a,b)=>a.ts-b.ts);
      const seen=st?.last_read_at?new Date(st.last_read_at).getTime():0;
      const loadedUnread=ms.filter(m=>!m.me&&!m.sys&&m.ts>seen).length;
      const unread=prev && !prev._dmHistoryExpanded ? Math.max(prev.unread||0,loadedUnread) : loadedUnread;
      if(S.users[key]) S.users[key].talks=(S.users[key].talks||0)+1;
      return {
        id:c.id,u:key,unread,
        ts:Math.max(new Date(c.updated_at||c.created_at).getTime(),...(ms.map(m=>m.ts||0))),
        msgs:ms,pin:!!st?.pinned,hidden:!!st?.hidden,cloud:true,
        _dmHistoryExpanded:!!prev?._dmHistoryExpanded,
        _dmHasMore:prev?._dmHistoryExpanded ? prev._dmHasMore : rows.length===DM_PAGE_SIZE,
        _dmLoadingOlder:false
      };
    });
    await attachMediaLists('message', cloudChats.flatMap(c=>c.msgs||[]), m=>m.id);
    S.chats=cloudChats;
    scheduleDmWarmCacheSave();

    /* If a chat was deleted by either participant, this device must also forget
       old 「申請済み」 markers so the relationship really returns to "from scratch". */
    const currentCloudPeers=new Set(cloudChats.map(c=>c.u));
    for(const uid of previousCloudPeers){
      if(!currentCloudPeers.has(uid) && !blockedChatPeers.has(uid)) clearRequestedForUser(uid);
    }
    S.posts.forEach(p=>{
      p.req=isPostRequested(p.id) && !!S.chats.find(c=>c.u===p.u);
    });

    S.notes={like:[],reply:[]};
    for(const n of notes){
      const actor=localKey(n.actor_id);
      if(S.blocked.includes(actor) || !S.users[actor]) continue;
      const p=S.posts.find(x=>x.id===n.post_id), r=p?.rep?.find(x=>x.id===n.reply_id);
      const un=S.users[actor]||{name:'ユーザー'};
      const item={id:n.id,u:actor,p:n.post_id,ts:new Date(n.created_at).getTime(),cloud:true};
      if(n.kind==='like'){ item.t=`${un.name}があなたの投稿にいいねしました`; item.s=p?`「${(p.t||'').slice(0,18)}」`:''; S.notes.like.push(item); }
      else if(n.kind==='reply'){ item.t=`${un.name}があなたの投稿に返信しました`; item.s=(r?.t||'').slice(0,80); S.notes.reply.push(item); }
      if(n.read_at) S.noteSeen.add(n.id);
    }
    const hiddenCachedPosts=S.posts.some(p=>p.cloud && p.u!=='me' && !S.users[p.u]);
    if(!initial && beforeSig!==cloudViewSignature()) cloudRefreshUI(applyPosts || blockListChanged || muteListChanged || hiddenCachedPosts);
  }catch(e){ cloudErr('reload',e); }
  finally{
    CLOUD.reloading=false;
    if(CLOUD.reloadAgain){
      const nextApplyPosts=CLOUD.reloadAgainApplyPosts;
      CLOUD.reloadAgain=false; CLOUD.reloadAgainApplyPosts=false;
      cloudReloadAll(false,nextApplyPosts);
    }
  }
}

function cloudStartRealtime(){

  ['profiles','posts','post_likes','replies','reply_likes','favorites','user_blocks','user_mutes','direct_chats','messages','notifications'].forEach(table=>{
    ch=ch.on('postgres_changes',{event:'*',schema:'public',table},cloudScheduleReload);
  });

  ch=ch.on('postgres_changes',{event:'*',schema:'public',table:'direct_chat_state'},payload=>{

/* =========================================================
   MULTI MEDIA
   Up to four attachments per post, reply or DM, stored one row
   each in post_media / reply_media / message_media and ordered
   by `position`. The parent's legacy `media` JSONB still holds
   the first item, so an older build elsewhere keeps working.
   ========================================================= */
const MEDIA_MAX=4;

/* Sizes travel next to the payload as _w/_h. posts_media_safe permits
   exactly five keys, so they are stripped before anything is inserted. */
function mediaPayload(m){
  if(!m) return null;
  const {_w,_h,...rest}=m;
  return rest;
}

/* The stored form for local state: the size stays on it, so a freshly posted
   card is laid out from the real ratio instead of a placeholder. */
function mediaWithSize(m){
  if(!m) return m;
  const out={...m};
  delete out._w; delete out._h;
  if(validMediaWH(m._w,m._h)){ out.w=Number(m._w); out.h=Number(m._h); }
  return out;
}

/* Everything downstream reads mediaListOf(). Keeping .media as the first
   item means existing single-attachment code paths need no changes. */
function mediaListOf(x){
  if(!x) return [];
  if(Array.isArray(x.mediaList)) return x.mediaList.filter(Boolean);
  return x.media ? [x.media] : [];
}
function setMediaList(x,list){
  const arr=(list||[]).filter(Boolean).slice(0,MEDIA_MAX);
  x.mediaList=arr;
  x.media=arr[0]||null;
  return arr;
}

const MEDIA_CHILD={
  post:   {table:'post_media',    fk:'post_id',    scope:'post'},
  reply:  {table:'reply_media',   fk:'reply_id',   scope:'reply'},
  message:{table:'message_media', fk:'message_id', scope:'dm'}
};

/* One query per parent kind, not one per parent. */
async function cloudFetchMediaFor(kind, ids){
  const spec=MEDIA_CHILD[kind];
  if(!CLOUD.enabled||!spec||!ids?.length) return new Map();
  const rows=await cloudRows(
    CLOUD.client.from(spec.table).select('*').in(spec.fk, ids).order('position',{ascending:true})
  );
  const out=new Map();
  for(const r of rows){
    const m=await cloudHydrateMedia({
      kind:r.kind, bucket:r.bucket, path:r.path,
      name:r.name||'', dur:Number(r.duration)||0
    });
    if(!m) continue;
    if(r.width&&r.height){ m.w=r.width; m.h=r.height; }
    const key=r[spec.fk];
    if(!out.has(key)) out.set(key,[]);
    out.get(key).push(m);
  }
  return out;
}

/* Attach what was fetched, falling back to the legacy column for rows that
   predate the migration. */
function applyMediaList(target, fetched, id){
  const rows=fetched && fetched.get(id);
  if(rows && rows.length) setMediaList(target, rows);
  else setMediaList(target, target.media?[target.media]:[]);
  return target;
}

/* Fill in attachments for a batch of freshly hydrated parents. */
async function attachMediaLists(kind, items, idOf){
  const list=(items||[]).filter(Boolean);
  if(!list.length) return list;
  const ids=[...new Set(list.map(idOf).filter(Boolean))];
  let fetched=new Map();
  try{ fetched=await cloudFetchMediaFor(kind, ids); }
  catch(e){ console.warn('[iroha media]',kind,e); }
  for(const it of list) applyMediaList(it, fetched, idOf(it));
  return list;
}

/* Write one child row per attachment. The parent must already exist: the
   table's trigger checks the storage path against its author. */
async function cloudSaveMediaList(kind, parentId, stored){
  const spec=MEDIA_CHILD[kind];
  if(!CLOUD.enabled||!spec) return [];
  const items=(stored||[]).filter(Boolean).slice(0,MEDIA_MAX);
  if(!items.length) return [];
  const rows=items.map((m,i)=>({
    [spec.fk]:parentId,
    position:i,
    kind:m.kind,
    bucket:m.bucket,
    path:m.path,
    name:m.name||null,
    width:Number.isFinite(Number(m._w))?Math.round(Number(m._w)):null,
    height:Number.isFinite(Number(m._h))?Math.round(Number(m._h)):null,
    duration:Number(m.dur)||null
  }));
  const q=await CLOUD.client.from(spec.table).insert(rows);
  if(q.error) throw q.error;
  return items;
}

/* Upload every attachment for one parent, in order. */
async function cloudUploadAll(list, opts){
  const out=[];
  for(const it of (list||[]).filter(Boolean).slice(0,MEDIA_MAX)){
    out.push(await cloudUploadMedia(it, opts));
  }
  return out;
}

const esc = (s='')=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const SUPABASE_ORIGIN = new URL(SUPABASE_URL).origin;

function safeAssetUrl(raw, { allowLocal = false } = {}) {
  const s = String(raw ?? '').trim();
  if (!s) return '';

  if (allowLocal && s.startsWith('blob:')) {
    return s;
  }

  if (
    allowLocal &&
    /^data:(image|video|audio)\/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=]+$/i.test(s)
  ) {
    return s;
  }

  try {
    const u = new URL(s);

    if (u.protocol !== 'https:') return '';
    if (u.origin !== SUPABASE_ORIGIN) return '';
    if (!u.pathname.startsWith('/storage/v1/object/')) return '';

    return u.href;
  } catch {
    return '';
  }
}

function escAttr(s = '') {
  return esc(String(s)).replace(/'/g, '&#39;');
}

const haptic = (ms=8)=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* Give every outgoing row its final UUID before the network request starts.
   A repeated request with the same row cannot become a second DB row. */
function newRowId(){
  if(globalThis.crypto?.randomUUID) return crypto.randomUUID();
  const b=new Uint8Array(16);
  if(globalThis.crypto?.getRandomValues) crypto.getRandomValues(b);
  else for(let i=0;i<b.length;i++) b[i]=Math.floor(Math.random()*256);
  b[6]=(b[6]&0x0f)|0x40; b[8]=(b[8]&0x3f)|0x80;
  const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}

/* ---------- avatar generator ---------- */
const AV_COLORS = {
  amber : {bg:'#F0E4C4', head:'#E8B93C', body:'#F5D98C'},
  slate : {bg:'#D9E2EA', head:'#3E5A70', body:'#E8EEF3'},
  moss  : {bg:'#D8E7D5', head:'#4E8258', body:'#EAF2E7'},
  plum  : {bg:'#DED2EE', head:'#F0C43C', body:'#4B2B72'},
  stone : {bg:'#E3E1DE', head:'#77726B', body:'#CFCCC7'},
  mist  : {bg:'#DCE4E9', head:'#1F3446', body:'#F2E6D4'},
  clay  : {bg:'#EFDCD2', head:'#B0654A', body:'#F7EBE3'}
};
function avatar(key, size, img){
  const safeImg = safeAssetUrl(img, { allowLocal: true });

  if(safeImg) return `<span class="av" style="width:${size}px;height:${size}px">
    <img src="${escAttr(safeImg)}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">
  </span>`;

  const c = AV_COLORS[key] || AV_COLORS.stone;
  const id = 'c'+Math.random().toString(36).slice(2,8);

  return `<span class="av" style="width:${size}px;height:${size}px">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <defs><clipPath id="${id}"><circle cx="24" cy="24" r="24"/></clipPath></defs>
      <g clip-path="url(#${id})">
        <rect width="48" height="48" fill="${c.bg}"/>
        <path d="M48 0v48H16z" fill="${c.bg}" opacity=".55"/>
        <circle cx="22.5" cy="18" r="8.4" fill="${c.head}"/>
        <path d="M24 28.4c9 0 15.4 6.4 15.4 15.2V50H8.6v-6.4C8.6 34.8 15 28.4 24 28.4z" fill="${c.body}"/>
      </g>
    </svg></span>`;
}

/* avatar for a known user — uses their uploaded photo when present */
function uav(uid, size, fallbackKey){
  const u=S.users[uid];
  return avatar(fallbackKey || (u && u.av) || 'stone', size, u && u.img);
}
  
/* header background: uploaded image, else a wash built from the chosen colour */
  
function bannerCSS(u){
  const safeBanner = safeAssetUrl(u.banner, { allowLocal: true });

  if(safeBanner) {
    return `background-image:url("${escAttr(safeBanner)}")`;
  }

  const c = AV_COLORS[u.av] || AV_COLORS.stone;

  return `background-image:
      radial-gradient(115% 150% at 10% -20%, ${c.head}99 0%, transparent 58%),
      radial-gradient(95% 130% at 95% 118%, ${c.body}CC 0%, transparent 62%),
      linear-gradient(148deg, ${c.bg} 0%, ${c.body}55 100%)`;
}

/* names that already carry an honorific shouldn't get a second one */
function honor(name){
  return /(さん|くん|ちゃん|様|さま)$/.test(name||'') ? name : name+'さん';
}

/* the small chip shown after a display name */
function accountTag(u){
  if(!u) return '';
  if(u.bot)  return `<span class="badge-bot">${I.bot}BOT</span>`;
  if(u.demo) return `<span class="badge-demo">DEMO</span>`;
  return '';
}

/* ---------- time ---------- */
function ago(ts){
  const s=Math.max(0,(Date.now()-ts)/1000);
  if(s<60) return 'たった今';
  if(s<3600) return Math.floor(s/60)+'分前';
  if(s<86400) return Math.floor(s/3600)+'時間前';
  if(s<86400*7) return Math.floor(s/86400)+'日前';
  const d=new Date(ts), now=new Date();
  const md=(d.getMonth()+1)+'月'+d.getDate()+'日';
  return d.getFullYear()===now.getFullYear() ? md : d.getFullYear()+'年'+md;
}
function clock(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}

/* a brand-new account: no handle chosen yet, colour drawn at random */
function pickFreshAvatar(){
  const keys=Object.keys(AV_COLORS);
  if(!keys.length) return 'stone';
  if(globalThis.crypto?.getRandomValues){
    const n=new Uint32Array(1);
    crypto.getRandomValues(n);
    return keys[n[0]%keys.length];
  }
  return keys[Math.floor(Math.random()*keys.length)];
}

/* ---------- persistent preferences ---------- */
const PREF_KEY='iroha:prefs:v1';
function loadPrefs(){
  try{
    const p=JSON.parse(localStorage.getItem(PREF_KEY)||'null');
    if(!p || typeof p!=='object') return;
    if(['night','light','dark'].includes(p.themeChoiceV2)) S.theme=p.themeChoiceV2;
    else if(p.theme==='dark') S.theme='dark';
    else S.theme='night';
    if(['osusume','new','fav'].includes(p.filter)) S.filter=p.filter;
    if(['safety','raw','hide'].includes(p.media)) S.media=p.media;
    const savedQuietUntil=Number(p.quietUntil)||0;
    S.quietUntil=savedQuietUntil>Date.now()?savedQuietUntil:0;
    S.quiet=S.quietUntil>Date.now();
    if(typeof p.notifyWanted==='boolean') S.notifyWanted=p.notifyWanted;
    if(typeof p.notifyDM==='boolean') S.notifyDM=p.notifyDM;
    if(typeof p.notifyActivity==='boolean') S.notifyActivity=p.notifyActivity;
    if(['all','fav','replied'].includes(p.who)){
      /* v2.40.20/21 used replied as the initial default.
         Move that old default to the new "all" default once. */
      S.who = (p.who==='replied' && !p.dmDefaultAllMigrated) ? 'all' : p.who;
    }
    if(p.postCooldowns && typeof p.postCooldowns==='object'){
      S.postCooldowns={};
      for(const [k,v] of Object.entries(p.postCooldowns)){
        if(TAGS[k] && Number.isFinite(Number(v))) S.postCooldowns[k]=Number(v);
      }
    }
    if(Array.isArray(p.requestedPosts)) S.requestedPosts=[...new Set(p.requestedPosts.filter(x=>typeof x==='string'))];
    if(Array.isArray(p.blocked)) S.blocked=[...new Set(p.blocked.filter(x=>typeof x==='string'))];
    if(Array.isArray(p.muted)) S.muted=[...new Set(p.muted.filter(x=>typeof x==='string'))];
  }catch(_){ }
}
function savePrefs(){
  try{
    localStorage.setItem(PREF_KEY,JSON.stringify({
      theme:S.theme, themeChoiceV2:S.theme, filter:S.filter, media:S.media,
      quiet:S.quiet, quietUntil:S.quietUntil, notifyWanted:S.notifyWanted,
      notifyDM:S.notifyDM, notifyActivity:S.notifyActivity, who:S.who,
      dmDefaultAllMigrated:true,
      postCooldowns:S.postCooldowns, requestedPosts:S.requestedPosts,
      blocked:S.blocked, muted:S.muted
    }));
  }catch(_){ }
}

const POST_CATEGORY_COOLDOWN=60*1000;
function categoryCooldownLeft(tag,at=Date.now()){
  const started=Number(S.postCooldowns[tag]||0);

}
function startCategoryCooldown(tag,at=Date.now()){

}
function rollbackCategoryCooldown(tag,stamp){

}

/* "返信した相手のみ":
   - 文章なしの「話す」申請(system message)は初回送信に数えない
   - 自分が実際の文章を1通送ったら、相手の最初の実返信まで待つ
   - 相手が1度でも実メッセージを返したら、そのチャットは以後ずっと通常DM
   - チャット削除で履歴ごと消えるので、その時だけリセット */
function canSendDmNow(c){
  if(!c) return false;
  const policy=dmPolicyOf(c.u);
  if(policy==='all' || policy==='fav') return true;

  const good=(c.msgs||[]).filter(m=>!m.failed);

  /* System-only request is not a reply. A real text/media/audio message is. */
  const gotRealReply=good.some(m=>
    !m.me && !m.sys && (String(m.t||'').trim().length>0 || !!m.media)
  );
  if(gotRealReply) return true;

  /* Only an actual outgoing TEXT consumes the one-message allowance.
     An empty 「話す」 request does not. */
  const sentRealText=good.some(m=>
    m.me && !m.sys && String(m.t||'').trim().length>0
  );
  return !sentRealText;
}
function notifyDmWait(){
  toast('相手が返信していないので送れません');
}
function notifyFavOnly(){
  toast('相手にお気に入りされていないのでDMできません');
}
/* Starting a new chat is different from opening an existing one.
   favorite-only blocks only a NEW conversation; an existing DM can still open. */
function canStartNewDm(uid,notify=true){
  if(chatWith(uid)) return true;
  if(dmPolicyOf(uid)==='fav' && !favoredBy(uid)){
    if(notify) notifyFavOnly();
    return false;
  }
  return true;
}

/* press and hold — used for the chat row actions */
function holdMenu(node, fn, ms=460){
  let t=null, sx=0, sy=0, active=false, pid=null, fired=false;

  const detachGlobal=()=>{
    document.removeEventListener('pointerup',globalEnd,true);
    document.removeEventListener('pointercancel',globalCancel,true);
  };
  const clearGesture=(keepFired=false)=>{
    if(t){ clearTimeout(t); t=null; }
    active=false; pid=null;
    detachGlobal();
    if(!keepFired) fired=false;
  };
  const globalEnd=e=>{
    if(pid!==null && e.pointerId!==pid) return;
    const wasFired=fired;
    clearGesture(wasFired);

    /* click は pointerup の直後に来る。
       長押しした“その1回”だけを止め、次のタップには絶対残さない。 */
    if(wasFired){
      setTimeout(()=>{ fired=false; },0);
    }
  };
  const globalCancel=e=>{
    if(pid!==null && e.pointerId!==pid) return;
    clearGesture(false);
  };

  /* 長押し後に発生する同じジェスチャの click だけを capture で破棄する。
     dataset フラグを700ms残さないので、次の通常タップは食わない。 */
  node.addEventListener('click',e=>{
    if(!fired) return;
    fired=false;
    e.preventDefault();
    e.stopImmediatePropagation();
  },true);

  node.addEventListener('pointerdown',e=>{
    if(e.button!==0 || e.isPrimary===false) return;

    /* Images/videos use the native iOS long-press menu for Save to Photos.
       Do not let iroha's own message hold-menu steal that gesture. */
    const pressTarget=e.target instanceof Element ? e.target : null;
    if(pressTarget && pressTarget.closest('.media:not(.blurred) img, .media:not(.blurred) video')){
      clearGesture(false);
      return;
    }

    clearGesture(false);
    sx=e.clientX; sy=e.clientY; active=true; pid=e.pointerId;

    document.addEventListener('pointerup',globalEnd,true);
    document.addEventListener('pointercancel',globalCancel,true);

    t=setTimeout(()=>{
      if(!active) return;
      t=null; fired=true;
      haptic(16);
      fn();
    },ms);
  });

  node.addEventListener('pointermove',e=>{
    if(!active || e.pointerId!==pid) return;
    if(Math.abs(e.clientX-sx)>8 || Math.abs(e.clientY-sy)>8) clearGesture(false);
  });
  node.addEventListener('pointerleave',e=>{
    if(active && e.pointerId===pid) clearGesture(false);
  });
  node.addEventListener('lostpointercapture',()=>clearGesture(false));
  node.addEventListener('contextmenu',e=>{
    if(active || fired) e.preventDefault();
  });
}

/* ---------- ripple ---------- */
function rippleAt(host, ev){
  const r=host.getBoundingClientRect();
  const x=(ev.clientX ?? r.left+r.width/2)-r.left;
  const y=(ev.clientY ?? r.top+r.height/2)-r.top;
  const d=Math.max(r.width,r.height);
  const s=el(`<span class="ripple" style="left:${x-d/2}px;top:${y-d/2}px;width:${d}px;height:${d}px"></span>`);
  host.appendChild(s); setTimeout(()=>s.remove(),640);
}

   arriving at a screen — nothing should animate in that case */
let QUIET=false;

function revealAll(root, base=0, q=false){
  $$('.stagger', root).forEach((n,i)=>{
    if(q){ n.classList.add('in'); n.style.animation='none';

/* ---------- scroll shadow + nav autohide ---------- */
/* the bars float above the scroller, so the scroller needs their heights */
function fitBars(root){
  const top=root.querySelector('.appbar,.navbar');
  const bot=root.querySelector('.reply-dock,.composer-bar,.reply-bar');
  const set=()=>{
    if(top && top.offsetHeight) root.style.setProperty('--barH', top.offsetHeight+'px');
    if(bot && bot.offsetHeight) root.style.setProperty('--barB', bot.offsetHeight+'px');
  };
  set(); raf(set);
  if(window.ResizeObserver){
    const ro=new ResizeObserver(set);
    if(top) ro.observe(top);
    if(bot) ro.observe(bot);
  }
}

function wireScroll(scroller, bar){
  const root = scroller.closest('.tabpane,.screen,.modal') || scroller.parentElement;
  if(root) fitBars(root);
  let last=0, lastT=performance.now(), ticking=false;
  scroller.addEventListener('scroll', ()=>{
    if(ticking) return; ticking=true;
    requestAnimationFrame(()=>{
      const y=scroller.scrollTop, now=performance.now();
      const dt=Math.max(8, now-lastT); lastT=now;
      const dy=y-last, vel=dy/dt*1000;
      if(bar) bar.classList.toggle('stuck', y>4);
      if(S.tab==='home' && !$('#stack').children.length && !$('#composeM')){
        if(y<=48) navMorph.expand(vel);
        else if(dy>2.5) navMorph.collapse(vel);
        else if(dy<-2.5) navMorph.expand(vel);
      }
      last=y; ticking=false;
    });
  },{passive:true});
}

/* =========================================================
   SPRING  —  semi-implicit Euler, sub-stepped for stability
   ========================================================= */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
class Spring{
  constructor(k=210, d=16.4, m=1){
    this.k=k; this.d=d; this.m=m; this.p=0; this.v=0; this.t=0;
    this._raf=0; this.onUpdate=null;
  }
  set(target, addVel=0){ this.t=target; this.v+=addVel; this._run(); }
  jump(x){ this.p=x; this.v=0; this.t=x; if(this.onUpdate) this.onUpdate(x,0); }
  _run(){
    if(this._raf) return;
    let last=performance.now();
    const step=(now)=>{
      const dt=Math.min(.048,(now-last)/1000)||.016; last=now;
      const n=Math.max(1,Math.ceil(dt/.005)), h=dt/n;
      for(let i=0;i<n;i++){
        const f=-this.k*(this.p-this.t)-this.d*this.v;
        this.v+=f/this.m*h; this.p+=this.v*h;
      }
      if(Math.abs(this.v)<.0015 && Math.abs(this.p-this.t)<.0015){
        this.p=this.t; this.v=0; this._raf=0;
        if(this.onUpdate) this.onUpdate(this.p,0);
        return;
      }
      if(this.onUpdate) this.onUpdate(this.p,this.v);
      this._raf=requestAnimationFrame(step);
    };
    this._raf=requestAnimationFrame(step);
  }
}

/* =========================================================
   NAV MORPH  —  the bar collapses into the FAB, which lifts
   away on an arc.  Travel matches the reference recording.
   ========================================================= */
const FAB_D=62, FAB_R=FAB_D/2;   /* circle diameter */
const PEAK_TX=1.05;              /* furthest x the damped overshoot reaches */
const OUT_DIP=4;                 /* px the FAB sags on the way out */
const BACK_LIFT=22;              /* px the FAB rises on the way home */

const navMorph=(()=>{
  const sp=new Spring(210, 16.4, 1);
  let baseX=0, dx=0, ready=false, icons=[], slotCx=0, dir=1;
  const cl01=x=>x<0?0:x>1?1:x;

  function measure(){
    const wrap=$('#navwrap'), nav=$('#nav'), slot=nav&&nav.querySelector('.fabslot'), fab=$('#fab');
    if(!wrap||!nav||!slot||!fab) return false;
    /* a re-measure can land while the bar is scaled mid-flight; reading those
       rects would fold the current scale into the geometry, so undo it first */
    const navT=nav.style.transform, fabT=fab.style.transform;
    nav.style.transform='none'; fab.style.transform='none';
    const w=wrap.getBoundingClientRect(), n=nav.getBoundingClientRect(), r=slot.getBoundingClientRect();
    const restore=()=>{ nav.style.transform=navT; fab.style.transform=fabT; };
    if(!w.width || !n.width){ restore(); return false; }
    baseX = r.left - w.left + r.width/2 - FAB_R;
    /* measured off the reference photo: the "+" settles with its right edge
       8px inside the card's right edge */
    /* Keep this geometry independent from #feedScroll's current transform.
       While a post-detail screen is open, tabsRoot is shifted left; replies
       repaint the feed in the background, and measuring that shifted rect used
       to poison the FAB's collapsed landing position.  Only the feed's fixed
       right padding matters here, so derive the card edge from navwrap itself. */
    const sc=document.querySelector('#feedScroll');
    const feedPadR=sc ? (parseFloat(getComputedStyle(sc).paddingRight) || 12) : 12;
    const cardR = w.width - feedPadR;
    dx = (cardR - 8 - FAB_D) - baseX;
    /* the damped overshoot still has to stay on screen */
    dx = Math.min(dx, (w.width - 6 - FAB_D - baseX)/PEAK_TX);
    slotCx = r.left - n.left + r.width/2;
    nav.style.transformOrigin = slotCx.toFixed(1)+'px 50%';
    icons = $$('#nav .navbtn').map((elm,i)=>{
      const b=elm.getBoundingClientRect();
      return {el:elm, off:(b.left+b.width/2)-(n.left+slotCx)};
    });
    restore();
    return true;
  }

  function apply(t,v){
    const fab=$('#fab'), nav=$('#nav'), core=fab&&fab.querySelector('.fab-core');
    if(!fab||!nav) return;
    const b=cl01(t);

    /* The reference clip is asymmetric: leaving the bar the FAB tracks a
       straight line (it only dips a hair), while coming home it swings up
       through a clear parabola.  bell peaks mid-flight, zero at both ends. */
    const bell = 4*b*(1-b);
    const arc  = dir===1 ? bell*OUT_DIP : bell*-BACK_LIFT;

    const swell = Math.min(Math.abs(v)*.006, .035);
    /* the full overshoot would push past the card edge — damp it in x only,
       so the bounce survives without the circle running out of room */
    const tx = t<=1 ? t : 1+(t-1)*0.45;
    fab.style.transform =
      `translate3d(${(baseX+dx*tx).toFixed(2)}px,${arc.toFixed(2)}px,0) scale(${(1-.03*b+swell).toFixed(3)})`;
    if(core) core.style.boxShadow =
      S.theme==='night'
        ? `0 ${(6+10*b).toFixed(1)}px ${(20+16*b).toFixed(1)}px rgba(222,216,238,${(.42+.14*b).toFixed(2)})`
        : `0 ${(6+10*b).toFixed(1)}px ${(20+16*b).toFixed(1)}px rgba(196,150,10,${(.42+.14*b).toFixed(2)})`;

    /* bar: shrinks toward the FAB, sinks, and dissolves */
    nav.style.opacity   = (1-b*1.12).toFixed(3);
    nav.style.transform = `translate3d(0,${(b*24).toFixed(2)}px,0) scale(${(1-b*.09).toFixed(3)})`;
    nav.style.pointerEvents = b>.5 ? 'none' : 'auto';

    /* icons peel away outside-in, so the bar reads as folding inward */
    icons.forEach(ic=>{
      const far = Math.abs(ic.off)/110;              /* 0 = nearest the FAB */
      const local = cl01((b - (1-far)*0.07) * 2.1);
      ic.el.style.opacity = (1-local).toFixed(3);
      ic.el.style.transform = `translate3d(${(-ic.off*0.12*b).toFixed(2)}px,0,0) scale(${(1-local*.16).toFixed(3)})`;
    });
  }
  sp.onUpdate=apply;

  function init(){
    ready=measure();
    if(ready) sp.jump(0); else requestAnimationFrame(init);
  }
  return{
    init,
    refresh(){ if(measure()) apply(sp.p, sp.v); },
    /* fire only on a state change — once settled (or in flight toward the
       same target) further scrolling must not feed the spring again */
    collapse(pxVel=0){ if(!ready || sp.t===1) return;
      dir=1;
      if(REDUCED){ sp.jump(1); return; }
      sp.set(1, Math.min(Math.max(pxVel/2600,0),1.3)); },
    expand(pxVel=0){ if(!ready || sp.t===0) return;
      dir=0;
      if(REDUCED){ sp.jump(0); return; }
      sp.set(0, Math.max(Math.min(pxVel/2600,0),-1.3)); },
    _jump(t,d){ if(!ready) return; if(d!==undefined) dir=d; sp.jump(t); },
    _dbg(){ return {baseX,dx,p:sp.p,t:sp.t,v:sp.v}; }
  };
})();

const NAV_ITEMS = [
  {id:'home',  icon:I.home},
  {id:'bell',  icon:I.bell},
  {id:'__fab'},
  {id:'chat',  icon:I.chat},
  {id:'me',    icon:I.person}

function buildNav(){
  const wrap=$('#navwrap');
  wrap.innerHTML = `<div class="nav" id="nav">
    <div class="nav-ind" id="navInd"></div>
    ${NAV_ITEMS.map(it => it.id==='__fab'
      ? `<div class="fabslot" aria-hidden="true"></div>`
      : `<button class="navbtn" data-tab="${it.id}" aria-label="${it.id}">${it.icon}</button>`
    ).join('')}
  </div>
  <button class="fab" id="fab" aria-label="投稿する"><span class="fab-core">${I.plus}</span></button>`;

  $$('#nav .navbtn').forEach(b=>{
    b.addEventListener('click',()=>{ haptic(6); goTab(b.dataset.tab); });
  });
  $('#fab').addEventListener('click', ()=>{ haptic(9); openCompose(); });
  window.addEventListener('resize', ()=>{ moveNavInd(false); navMorph.refresh(); });
}

function moveNavInd(animate=true){
  const btn=$(`#nav .navbtn[data-tab="${S.tab}"]`); const ind=$('#navInd');
  if(!btn||!ind) return;
  const nav=$('#nav').getBoundingClientRect(), b=btn.getBoundingClientRect();
  if(!animate) ind.style.transition='none';
  const w=48;
  ind.style.width=w+'px';
  ind.style.transform=`translate3d(${b.left-nav.left+(b.width-w)/2}px,0,0)`;
  if(!animate) requestAnimationFrame(()=>ind.style.transition='');
}

function visibleNotes(kind){ return (S.notes[kind]||[]).filter(n=>!S.muted.includes(n.u)); }
function allNotes(){ return [...visibleNotes('like'), ...visibleNotes('reply')]; }
function unseenIn(kind){ return visibleNotes(kind).filter(n=>!S.noteSeen.has(n.id)).length; }
function unseenNotes(){ return unseenIn('like')+unseenIn('reply'); }
function markNotesSeen(){ const list=allNotes(); list.forEach(n=>S.noteSeen.add(n.id)); cloudMarkNotesRead(list.map(n=>n.id)); }

/* ids highlighted for this visit — captured before the tab is marked read,
   so the new arrivals stay visible while the counter already drops */
let noteFresh=new Set();
/* opening a tab clears only that tab: likes and replies count separately */
function openNoteSegment(kind){
  const list=visibleNotes(kind);
  noteFresh=new Set(list.filter(n=>!S.noteSeen.has(n.id)).map(n=>n.id));
  list.forEach(n=>S.noteSeen.add(n.id));
  cloudMarkNotesRead(list.map(n=>n.id));
  syncNavBadges();
}

function syncNavBadges(){
  $$('#nav .navbtn').forEach(b=>{
    b.classList.toggle('on', b.dataset.tab===S.tab);

    const dotTab = b.dataset.tab==='bell';
    let n=0;

    if(b.dataset.tab==='chat'){
      n=S.chats.reduce(
        (a,c)=>a+(Number(c.unread)||0),
        0
      );
    }

    if(dotTab){
      n=unseenNotes();
    }

    let bdg=b.querySelector('.bdg');

    if(n>0){
      if(!bdg){
        bdg=el(
          `<span class="bdg${dotTab?' soft':''}">${n}</span>`
        );
        b.appendChild(bdg);
      }else if(bdg.textContent!==String(n)){
        bdg.textContent=n;
      }
    }else if(bdg){
      bdg.remove();
    }
  });

  /* ホーム画面アイコンのバッジ数
     通知OFFの種類は数えない */
  const dmUnread=S.chats.reduce(
    (a,c)=>a+(Number(c.unread)||0),
    0
  );

  const activityUnread=unseenNotes();

  const appUnread=S.notifyWanted
    ? (
        (S.notifyDM ? dmUnread : 0) +
        (S.notifyActivity ? activityUnread : 0)
      )
    : 0;

  try{
    if(appUnread>0 && 'setAppBadge' in navigator){
      navigator.setAppBadge(appUnread).catch(()=>{});
    }else if(appUnread===0 && 'clearAppBadge' in navigator){
      navigator.clearAppBadge().catch(()=>{});
    }
  }catch(_){}
}

/* =========================================================
   TAB ROUTER
   ========================================================= */
const PANES={};
function goTab(id){
  if(S.tab===id){ // tap-again → scroll to top
    const sc=PANES[id]&&PANES[id].querySelector('.scroll,.thread');
    if(sc) sc.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  const leavingHome=S.tab==='home'&&id!=='home';
  const prev=PANES[S.tab];
  if(leavingHome) pauseFeedVideoAutoplay();
  S.tab=id;
  if(prev){ prev.classList.add('leaving'); prev.classList.remove('on');
    setTimeout(()=>prev.classList.remove('leaving'),180); }
  const existed=!!PANES[id];
  const pane=PANES[id]||buildPane(id);
  raf(()=>pane.classList.add('on'));
  /* A newly-built pane already rendered itself. Rendering it again here
     restarted profile/content entrance animations and made the profile tab feel late. */
  if(existed) refreshPane(id);
  moveNavInd(true);
  syncNavBadges();
  $('#navwrap').classList.remove('hide');
  navMorph.expand();
  if(id==='home') setTimeout(refreshFeedVideoAutoplay,220);
}

function buildPane(id){
  const p=el(`<section class="tabpane" data-pane="${id}"></section>`);
  $('#tabsRoot').appendChild(p);
  PANES[id]=p;
  ({home:paneHome, bell:paneBell, chat:paneChat, me:paneMe})[id](p);
  return p;
}
function refreshPane(id){
  const p=PANES[id]; if(!p) return;
  if(id==='bell'){ openNoteSegment(noteSeg); renderNotes(); }
  if(id==='chat') renderChatList();
  if(id==='me')   renderMe();
  if(id==='home') { /* live */ }
}

  $('#toSearch',p).onclick   = ()=>pushSearch();
  $('#toSettings',p).onclick = ()=>pushSettings();
  $('#openCompose',p).onclick= ()=>openCompose();
  $$('.chip',p).forEach(c=>c.addEventListener('click',()=>{
    if(S.filter===c.dataset.f) return;
    haptic(6);
    $$('.chip',p).forEach(x=>x.classList.remove('on'));
    c.classList.add('on');
    S.filter=c.dataset.f; savePrefs();
    c.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
    renderFeed(true);
  }));

  attachPTR($('#feedScroll',p), p, refreshFeed);
  renderFeed(false);

function visiblePosts(){
  let list=S.posts.filter(p=>
    !p.profileOnly &&
    !!S.users[p.u] &&
    !S.blocked.includes(p.u) &&
    !S.muted.includes(p.u) &&
    !(p.arch && p.u!=='me')          /* archived posts stay visible only to me */
  );
  if(S.filter==='fav') return list.filter(p=>S.users[p.u]&&S.users[p.u].fav);
  if(S.filter==='osusume') return list.filter(p=>!p.arch);
  return list.filter(p=>p.tag===S.filter);
}

function postCard(p, opts={}){
  const u=S.users[p.u];
  const tag=TAGS[p.tag];
  return `<article class="card tap stagger" data-post="${p.id}">
    <div class="p-head">
      <button class="avbtn" data-user="${u.id}" style="display:contents">${uav(p.u,48)}</button>
      <div class="p-col">
        <div class="p-line">
          <button class="p-name" data-user="${u.id}">${esc(u.name)}</button>
          ${genderTag(u)}${accountTag(u)}

function burstDots(){
  let s='';
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2, d=17;
    s+=`<i style="--dx:${(Math.cos(a)*d).toFixed(1)}px;--dy:${(Math.sin(a)*d).toFixed(1)}px;animation-delay:${i*22}ms"></i>`;
  }
  return s;
}

function wirePostActions(root){
  if(root.dataset.postWired) return;

function onPostClick(e){
  const playBtn=e.target.closest('[data-feed-video-play]');
  if(playBtn){
    e.preventDefault(); e.stopPropagation(); haptic(5);
    toggleFeedVideoPlay(playBtn);
    return;
  }
  const expandBtn=e.target.closest('[data-feed-video-expand]');
  if(expandBtn){
    e.preventDefault(); e.stopPropagation(); haptic(5);
    openFeedVideoDetail(expandBtn);
    return;
  }
  const muteBtn=e.target.closest('[data-feed-video-mute]');
  if(muteBtn){
    e.preventDefault(); e.stopPropagation(); haptic(5);
    toggleFeedVideoMute();
    const box=muteBtn.closest('.media'); const v=box&&box.querySelector('video[data-feed-video]');
    if(v&&!v.paused&&!v.ended) scheduleFeedVideoChromeHide(v);
    return;
  }

  /* Non-interactive video taps (profile grid, replies, DM…) are owned by the
     media-viewer capture handler. Keep the post card from also opening if a
     browser lets the event reach this layer. A feed video with its own
     play/expand buttons falls through to the chrome-toggle check below instead. */
  if(e.target.closest('.media video:not([data-feed-video])')){ e.stopPropagation(); return; }

  const rm=e.target.closest('[data-repmore]');
  if(rm){ e.stopPropagation(); openReplyMenu(rm.dataset.repmore, ()=>refreshInPlace()); return; }
  const rlk=e.target.closest('[data-replike-card]');
  if(rlk){
    e.stopPropagation();
    const r=findReply(rlk.dataset['replikeCard']); if(!r) return;
    r.liked=!r.liked; r.likes+=r.liked?1:-1;
    cloudSetReplyLike(r).catch(er=>cloudErr('reply like',er));
    haptic(r.liked?11:5);
    rlk.classList.toggle('liked',r.liked);
    rlk.querySelector('.num').textContent=r.likes;
    if(r.liked){ rlk.classList.remove('pop'); void rlk.offsetWidth; rlk.classList.add('pop');
      setTimeout(()=>rlk.classList.remove('pop'),700); }
    return;
  }
  /* A sideways flick through a media strip ends with the finger still inside
     the card. Without this the gesture opens the post instead of just moving
     the pictures — which reads as "the strip does not scroll". */
  if(e.target.closest('.mstrip') && stripJustScrolled(e.target)) return;

  /* Tapping a feed video outside its two buttons never opens or plays
     anything by itself — it only shows/hides the play/expand buttons, and
     only while the video is actually playing. A paused video always keeps
     them visible, or there'd be no way to start it. */
  const feedVideoBox=e.target.closest('.media');
  const feedVideo=feedVideoBox&&feedVideoBox.querySelector('video[data-feed-video]');
  if(feedVideo){
    e.stopPropagation();
    if(!feedVideo.paused&&!feedVideo.ended){
      if(feedVideoBox.classList.contains('chrome-hidden')){
        feedVideoBox.classList.remove('chrome-hidden');
        scheduleFeedVideoChromeHide(feedVideo);
      }else{
        clearFeedVideoChromeTimer(feedVideoBox);
        feedVideoBox.classList.add('chrome-hidden');
      }
    }else{
      clearFeedVideoChromeTimer(feedVideoBox);
      feedVideoBox.classList.remove('chrome-hidden');
    }
    return;
  }

  const openp=e.target.closest('[data-openpost]');
  if(openp && !e.target.closest('button')){ pushPostDetail(openp.dataset.openpost); return; }
  const like=e.target.closest('[data-like]');
  if(like){ toggleLike(like.dataset.like, like); return; }
  const talk=e.target.closest('[data-talk]');
  if(talk){ openRequest(talk.dataset.talk); return; }
  const more=e.target.closest('[data-more]');
  if(more){ openPostMenu(more.dataset.more); return; }
  const rep=e.target.closest('[data-reply]');
  if(rep){
    if(rep.closest('#meList,#pfList')) openReplyFromProfilePost(rep.dataset.reply);
    else openThreadForPost(rep.dataset.reply);
    return;
  }
  const us=e.target.closest('[data-user]');
  if(us){ pushProfile(us.dataset.user); return; }
  const card=e.target.closest('[data-post]');
  if(card && !e.target.closest('button')){
    const p=S.posts.find(x=>x.id===card.dataset.post);
    if(p?.pending){ toast('投稿を送信中です'); return; }
    if(p?.failed){ toast('投稿を送信できませんでした'); return; }
    pushPostDetail(card.dataset.post);
  }
}

function toggleLike(id, btn){
  const p=S.posts.find(x=>x.id===id); if(!p) return;
  p.liked=!p.liked; p.likes+=p.liked?1:-1;
  cloudSetPostLike(p).catch(e=>{ p.liked=!p.liked; p.likes+=p.liked?1:-1; syncCard(p); cloudErr('like',e); });
  haptic(p.liked?12:5);
  btn.classList.toggle('liked',p.liked);
  const n=btn.querySelector('.num'); if(n) n.textContent=p.likes;
  if(p.liked){ btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
    setTimeout(()=>btn.classList.remove('pop'),700); }
}

/* live relative time
   IMPORTANT: update only leaf time labels.
   A container must never have its textContent replaced, or its children
   (DM bubble / avatar / media) would be destroyed. */
setInterval(()=>{
  $$('[data-ts]').forEach(n=>{
    if(n.children.length) return;
    const t=Number(n.dataset.ts);
    if(!Number.isFinite(t)) return;
    const s=ago(t);
    if(n.textContent!==s) n.textContent=s;
  });
},20000);

/* every reply written by a profile, newest first, with the parent post */
function profileReplies(uid){
  const out=[];
  S.posts.forEach(p=>{
    if(S.blocked.includes(p.u) || !S.users[p.u]) return;
    (p.rep||[]).forEach((r,i)=>{

      out.push({r, i, post:p});

  });
  return out.sort((a,b)=>b.r.ts-a.r.ts);
}
